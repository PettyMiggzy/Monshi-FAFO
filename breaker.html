var AC=window.AudioContext||window.webkitAudioContext,actx=null,master=null;
function initAudio(){if(actx)return;try{actx=new AC();master=actx.createGain();master.gain.value=0.25;master.connect(actx.destination);}catch(e){}}
function tone(f,t,v,o,d){if(!actx)return;var st=actx.currentTime+(o||0);var os=actx.createOscillator();var g=actx.createGain();os.type=t||'square';os.frequency.setValueAtTime(f,st);g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(v,st+0.01);g.gain.exponentialRampToValueAtTime(0.001,st+d);os.connect(g);g.connect(master);os.start(st);os.stop(st+d+0.05);}
function sfxHit(){tone(880,'square',0.1,0,0.04);}
function sfxBrick(){tone(rnd(600,1200),'square',0.12,0,0.06);}
function sfxDie(){[440,330,220].forEach(function(f,i){tone(f,'sawtooth',0.25,i*0.12,0.18);});}
function sfxWin(){[523,659,784,1046,1318].forEach(function(f,i){tone(f,'square',0.18,i*0.06,0.12);});}

var rnd=function(a,b){return a+Math.random()*(b-a);};
var state='start',score=0,best=parseInt(localStorage.getItem('breaker_best')||'0'),tick=0,level=1;
var playerName=localStorage.getItem('monshi_name')||'';
var lastScore=0,leaderboard=[],playerRank=0;

var paddle={x:BW/2-60,y:BH-50,w:120,h:14,spd:0};
var ball={x:BW/2,y:BH-80,r:12,vx:5,vy:-5,launched:false};
var bricks=[];
var BR=8,BC=10; // 8 rows, 10 cols

function makeBricks(){
  bricks=[];
  var cols=['#EF4444','#F97316','#FCD34D','#22C55E','#3B82F6','#8B5CF6','#A855F7','#EC4899'];
  var bw=(BW-40)/BC,bh=22;
  for(var r=0;r<BR;r++){
    for(var c=0;c<BC;c++){
      bricks.push({x:20+c*bw+2,y:80+r*bh+2,w:bw-4,h:bh-4,c:cols[r%cols.length],hp:Math.floor(r/4)+1,init:Math.floor(r/4)+1});
    }
  }
}

function reset(){paddle.x=BW/2-60;ball.x=BW/2;ball.y=BH-80;ball.vx=4;ball.vy=-5;ball.launched=false;score=0;level=1;makeBricks();state='playing';}

addEventListener('keydown',function(e){
  if(state==='start'&&e.code==='Space'){reset();initAudio();return;}
  if(e.code==='Space'&&!ball.launched){ball.launched=true;return;}
  if(e.key.toLowerCase()==='a'||e.key==='ArrowLeft')paddle.spd=-8;
  else if(e.key.toLowerCase()==='d'||e.key==='ArrowRight')paddle.spd=8;
});
addEventListener('keyup',function(e){if(e.key.toLowerCase()==='a'||e.key.toLowerCase()==='d'||e.key==='ArrowLeft'||e.key==='ArrowRight')paddle.spd=0;});

// Mouse/touch follow
canvas.addEventListener('mousemove',function(e){var r=canvas.getBoundingClientRect();var x=(e.clientX-r.left)/(r.width/BW);paddle.x=x-paddle.w/2;});
canvas.addEventListener('touchmove',function(e){e.preventDefault();var r=canvas.getBoundingClientRect();var x=(e.touches[0].clientX-r.left)/(r.width/BW);paddle.x=x-paddle.w/2;},{passive:false});
canvas.addEventListener('click',function(){initAudio();if(state==='start')reset();else if(!ball.launched)ball.launched=true;});
canvas.addEventListener('touchstart',function(e){e.preventDefault();initAudio();if(state==='start'){reset();return;}if(!ball.launched){ball.launched=true;return;}var r=canvas.getBoundingClientRect();var x=(e.touches[0].clientX-r.left)/(r.width/BW);paddle.x=x-paddle.w/2;},{passive:false});

function update(){
  tick++;
  if(paddle.spd){paddle.x+=paddle.spd;}
  paddle.x=Math.max(0,Math.min(BW-paddle.w,paddle.x));
  if(!ball.launched){ball.x=paddle.x+paddle.w/2;return;}
  ball.x+=ball.vx;ball.y+=ball.vy;
  // Walls
  if(ball.x-ball.r<0){ball.x=ball.r;ball.vx*=-1;sfxHit();}
  if(ball.x+ball.r>BW){ball.x=BW-ball.r;ball.vx*=-1;sfxHit();}
  if(ball.y-ball.r<0){ball.y=ball.r;ball.vy*=-1;sfxHit();}
  // Floor
  if(ball.y>BH){return die();}
  // Paddle
  if(ball.y+ball.r>paddle.y&&ball.x>paddle.x&&ball.x<paddle.x+paddle.w&&ball.vy>0){
    ball.y=paddle.y-ball.r;
    var hitPos=(ball.x-paddle.x)/paddle.w;
    var ang=(hitPos-0.5)*Math.PI*0.7;
    var spd=Math.sqrt(ball.vx*ball.vx+ball.vy*ball.vy);
    ball.vx=Math.sin(ang)*spd;ball.vy=-Math.abs(Math.cos(ang)*spd);
    sfxHit();
  }
  // Bricks
  for(var i=bricks.length-1;i>=0;i--){
    var b=bricks[i];
    if(ball.x+ball.r>b.x&&ball.x-ball.r<b.x+b.w&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+b.h){
      // Bounce direction
      var fromTop=ball.y<b.y;var fromBot=ball.y>b.y+b.h;
      if(fromTop||fromBot)ball.vy*=-1;else ball.vx*=-1;
      b.hp--;
      score+=10*level;
      if(b.hp<=0){bricks.splice(i,1);sfxBrick();}
      else sfxHit();
      // Speed up slightly each hit
      ball.vx*=1.005;ball.vy*=1.005;
      break;
    }
  }
  if(bricks.length===0){level++;ball.launched=false;ball.vx=4+level*0.5;ball.vy=-(5+level*0.5);makeBricks();sfxWin();}
}

function die(){if(state!=='playing')return;state='dead';sfxDie();lastScore=score;if(score>best){best=score;localStorage.setItem('breaker_best',best);}if(playerName)submitScore(score);else showDeathNoSubmit();}

function drawBG(){
  var g=ctx.createLinearGradient(0,0,0,BH);g.addColorStop(0,'#02000a');g.addColorStop(1,'#1a0040');
  ctx.fillStyle=g;ctx.fillRect(0,0,BW,BH);
  // Grid
  ctx.strokeStyle='rgba(120,50,200,.06)';for(var y=0;y<BH;y+=30){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(BW,y);ctx.stroke();}
}

function drawBrick(b){
  ctx.save();ctx.shadowColor=b.c;ctx.shadowBlur=8;
  var alpha=b.hp/b.init*0.5+0.5;
  ctx.fillStyle=b.c;ctx.globalAlpha=alpha;
  ctx.beginPath();ctx.roundRect(b.x,b.y,b.w,b.h,3);ctx.fill();
  ctx.globalAlpha=1;
  ctx.fillStyle='rgba(255,255,255,.2)';ctx.fillRect(b.x+2,b.y+2,b.w-4,4);
  ctx.restore();
}

function drawPaddle(){
  ctx.save();ctx.shadowColor='#8B5CF6';ctx.shadowBlur=15;
  var g=ctx.createLinearGradient(paddle.x,0,paddle.x+paddle.w,0);
  g.addColorStop(0,'#7C3AED');g.addColorStop(0.5,'#A855F7');g.addColorStop(1,'#7C3AED');
  ctx.fillStyle=g;
  ctx.beginPath();ctx.roundRect(paddle.x,paddle.y,paddle.w,paddle.h,6);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.3)';ctx.fillRect(paddle.x+5,paddle.y+2,paddle.w-10,3);
  ctx.restore();
}

function drawBall(){
  ctx.save();ctx.shadowColor='#8B5CF6';ctx.shadowBlur=15;
  if(face.complete){
    ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.clip();
    ctx.drawImage(face,ball.x-ball.r,ball.y-ball.r,ball.r*2,ball.r*2);
  }
  ctx.restore();
  ctx.save();ctx.shadowColor='#8B5CF6';ctx.shadowBlur=8;
  ctx.strokeStyle='#8B5CF6';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.stroke();
  ctx.restore();
}

function drawHUD(){
  ctx.fillStyle='rgba(0,0,0,.5)';ctx.beginPath();ctx.roundRect(12,12,180,46,8);ctx.fill();
  ctx.strokeStyle='rgba(139,92,246,.4)';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(12,12,180,46,8);ctx.stroke();
  ctx.save();ctx.shadowColor='#8B5CF6';ctx.shadowBlur=10;
  ctx.fillStyle='#fff';ctx.font='900 22px Orbitron,sans-serif';ctx.fillText(score,20,40);ctx.restore();
  ctx.fillStyle='rgba(167,139,250,.6)';ctx.font='700 9px Space Mono,monospace';ctx.fillText('SCORE',20,53);

  ctx.fillStyle='rgba(0,0,0,.5)';ctx.beginPath();ctx.roundRect(BW-100,12,88,46,8);ctx.fill();
  ctx.strokeStyle='rgba(74,222,128,.4)';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(BW-100,12,88,46,8);ctx.stroke();
  ctx.fillStyle='#4ADE80';ctx.font='900 22px Orbitron,sans-serif';ctx.textAlign='center';ctx.fillText('L'+level,BW-56,40);
  ctx.fillStyle='rgba(74,222,128,.5)';ctx.font='700 9px Space Mono,monospace';ctx.fillText('LEVEL',BW-56,53);
  ctx.textAlign='left';
  ctx.fillStyle='rgba(255,255,255,.16)';ctx.font='700 9px Space Mono,monospace';ctx.textAlign='right';ctx.fillText('a KING PETTY build',BW-12,BH-10);ctx.textAlign='left';
}

function drawStart(){
  ctx.fillStyle='rgba(0,0,8,.7)';ctx.fillRect(0,0,BW,BH);
  ctx.save();ctx.shadowColor='#8B5CF6';ctx.shadowBlur=30;
  ctx.fillStyle='#EDE9FF';ctx.font='900 50px Orbitron,sans-serif';ctx.textAlign='center';
  ctx.fillText('MONSHI',BW/2,BH/2-50);ctx.restore();
  ctx.save();ctx.shadowColor='#22C55E';ctx.shadowBlur=20;
  ctx.fillStyle='#4ADE80';ctx.font='900 36px Orbitron,sans-serif';
  ctx.fillText('BREAKER',BW/2,BH/2-10);ctx.restore();
  ctx.fillStyle='rgba(196,181,253,.7)';ctx.font='700 13px Space Mono,monospace';
  ctx.fillText('Smash the resistance levels',BW/2,BH/2+30);
  ctx.fillText('Mouse / Arrows / Touch',BW/2,BH/2+50);
  var pulse=0.5+0.5*Math.sin(tick*0.1);
  ctx.fillStyle='rgba(74,222,128,'+pulse+')';ctx.font='700 16px Orbitron,sans-serif';
  ctx.fillText('TAP / SPACE TO PLAY',BW/2,BH/2+90);
  ctx.fillStyle='#FCD34D';ctx.font='700 12px Space Mono,monospace';
  ctx.fillText('BEST: '+best,BW/2,BH/2+125);
  ctx.textAlign='left';
}

function sbH(){return{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=representation'};}
function fetchLeaderboard(){fetch(SUPABASE_URL+'/rest/v1/scores_breaker?select=name,score&order=score.desc&limit=10',{headers:sbH()}).then(function(r){return r.json();}).then(function(d){if(Array.isArray(d))leaderboard=d;}).catch(function(){});}
function submitScore(sc){fetch(SUPABASE_URL+'/rest/v1/scores_breaker',{method:'POST',headers:sbH(),body:JSON.stringify({name:playerName,score:Math.floor(sc)})}).then(function(){return fetch(SUPABASE_URL+'/rest/v1/scores_breaker?select=name,score&order=score.desc&limit=10',{headers:sbH()});}).then(function(r){return r.json();}).then(function(d){if(Array.isArray(d)){leaderboard=d;playerRank=leaderboard.findIndex(function(s){return s.name===playerName&&s.score===Math.floor(sc);})+1;renderDeath(sc);}}).catch(function(){renderDeath(sc);});}
function showDeathNoSubmit(){document.getElementById('nameSubmit').style.display='block';document.getElementById('dNameInput').value='';renderDeath(lastScore);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function renderDeath(sc){
  if(playerName)document.getElementById('nameSubmit').style.display='none';
  document.getElementById('dScore').textContent=sc;
  document.getElementById('dBest').textContent=best;
  document.getElementById('lvlTag').textContent='REACHED LEVEL '+level;
  document.getElementById('rankTag').textContent=playerRank>0?'YOU PLACED #'+playerRank+' GLOBALLY':'';
  var tbody=document.getElementById('lbBody');tbody.innerHTML='';
  leaderboard.slice(0,6).forEach(function(s,i){var tr=document.createElement('tr');var isMe=s.name===playerName&&s.score===Math.floor(sc);if(isMe)tr.className='me';var medal=['🥇','🥈','🥉'][i]||'#'+(i+1);tr.innerHTML='<td class="rank">'+medal+'</td><td>'+esc(s.name)+'</td><td class="sc">'+s.score+'</td>';tbody.appendChild(tr);});
  document.getElementById('deathPanel').classList.add('show');
}
document.getElementById('dSubmit').addEventListener('click',function(){var n=document.getElementById('dNameInput').value.trim();playerName=(n||'ANON').toUpperCase().slice(0,16);localStorage.setItem('monshi_name',playerName);document.getElementById('nameSubmit').style.display='none';submitScore(lastScore);});
document.getElementById('dNameInput').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('dSubmit').click();});
document.getElementById('btnShare').addEventListener('click',function(){var tweet='I scored '+lastScore+' on MONSHI BREAKER LVL '+level+'! '+('https://monshi-fafo.vercel.app/api/share?game=MONSHI%20BREAKER&score='+lastScore+'&name='+encodeURIComponent(playerName||'ANON')+'&rank='+(typeof playerRank!=='undefined'?playerRank:'')+'&goto='+encodeURIComponent(GAME_URL))+' $MONSHI #Monad';window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(tweet),'_blank');});
document.getElementById('btnBuy').addEventListener('click',function(){window.open(BUY_URL,'_blank');});
document.getElementById('btnRetry').addEventListener('click',function(){document.getElementById('deathPanel').classList.remove('show');reset();});
fetchLeaderboard();

makeBricks();
function loop(){requestAnimationFrame(loop);drawBG();bricks.forEach(drawBrick);drawPaddle();drawBall();if(state==='playing')update();else tick++;drawHUD();if(state==='start')drawStart();}
loop();
</script></body></html>
