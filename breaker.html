var PAD={x:W/2-50,y:H-30,w:100,h:12,spd:8};
var ball={x:W/2,y:H/2,vx:5,vy:-5,r:10};
var bricks=[];
var st='start',score=0,best=parseInt(localStorage.getItem('breaker_best')||'0'),tick=0,lives=3,level=1;

var AC=window.AudioContext||window.webkitAudioContext,actx=null;
function ia(){if(actx)return;try{actx=new AC();}catch(e){}}
function tone(f,t,v,d){if(!actx)return;var s=actx.currentTime;var o=actx.createOscillator();var g=actx.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v,s+0.005);g.gain.exponentialRampToValueAtTime(0.001,s+d);o.connect(g);g.connect(actx.destination);o.start(s);o.stop(s+d+0.05);}

function buildBricks(){
  bricks=[];
  var rows=4+level,cols=10,bw=60,bh=20,padX=(W-(cols*bw+(cols-1)*5))/2,padY=60;
  var colors=['#EF4444','#F97316','#FCD34D','#22C55E','#3B82F6','#8B5CF6','#EC4899'];
  for(var r=0;r<rows;r++){
    for(var col=0;col<cols;col++){
      bricks.push({x:padX+col*(bw+5),y:padY+r*(bh+5),w:bw,h:bh,c:colors[r%colors.length],hp:1+Math.floor(r/3)});
    }
  }
}
buildBricks();

var keys={},mx=W/2;
window.addEventListener('keydown',function(e){keys[e.key.toLowerCase()]=true;if(e.code==='Space'){e.preventDefault();if(st==='start'){st='playing';ia();}else if(st==='dead'||st==='win'){reset();st='playing';}}});
window.addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=false;});
c.addEventListener('mousemove',function(e){var r=c.getBoundingClientRect();var s=W/r.width;mx=(e.clientX-r.left)*s;});
c.addEventListener('touchmove',function(e){e.preventDefault();var r=c.getBoundingClientRect();var s=W/r.width;mx=(e.touches[0].clientX-r.left)*s;});
c.addEventListener('click',function(){ia();if(st==='start'){st='playing';}else if(st==='dead'||st==='win'){reset();st='playing';}});
c.addEventListener('touchstart',function(e){e.preventDefault();ia();if(st==='start'){st='playing';}else if(st==='dead'||st==='win'){reset();st='playing';}});

function reset(){
  PAD.x=W/2-50;ball.x=W/2;ball.y=H/2;ball.vx=5;ball.vy=-5;
  score=0;lives=3;level=1;buildBricks();
}

function loop(){
  requestAnimationFrame(loop);tick++;
  // BG
  var g=x.createRadialGradient(W/2,H/2,50,W/2,H/2,W*0.7);
  g.addColorStop(0,'#1a0040');g.addColorStop(1,'#02000a');
  x.fillStyle=g;x.fillRect(0,0,W,H);

  if(st==='playing'){
    // Paddle
    if(keys['arrowleft']||keys['a'])PAD.x-=PAD.spd;
    if(keys['arrowright']||keys['d'])PAD.x+=PAD.spd;
    if(mx>0)PAD.x+=(mx-PAD.w/2-PAD.x)*0.3;
    PAD.x=Math.max(0,Math.min(W-PAD.w,PAD.x));
    // Ball
    ball.x+=ball.vx;ball.y+=ball.vy;
    if(ball.x<ball.r||ball.x>W-ball.r){ball.vx*=-1;tone(400,'square',0.05,0.04);}
    if(ball.y<ball.r){ball.vy*=-1;tone(400,'square',0.05,0.04);}
    if(ball.y>H){lives--;tone(150,'sawtooth',0.3,0.3);if(lives<=0){st='dead';if(score>best){best=score;localStorage.setItem('breaker_best',score);}}else{ball.x=W/2;ball.y=H/2;ball.vx=(Math.random()<0.5?-1:1)*5;ball.vy=-5;}}
    // Paddle collision
    if(ball.y+ball.r>PAD.y&&ball.y-ball.r<PAD.y+PAD.h&&ball.x>PAD.x&&ball.x<PAD.x+PAD.w&&ball.vy>0){
      ball.vy=-Math.abs(ball.vy);
      var hp=(ball.x-PAD.x)/PAD.w-0.5;ball.vx=hp*10;
      tone(600,'square',0.08,0.05);
    }
    // Brick collision
    for(var i=bricks.length-1;i>=0;i--){
      var b=bricks[i];
      if(ball.x+ball.r>b.x&&ball.x-ball.r<b.x+b.w&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+b.h){
        b.hp--;
        if(b.hp<=0){bricks.splice(i,1);score+=10;}
        ball.vy*=-1;tone(800,'square',0.08,0.05);
        if(bricks.length===0){level++;buildBricks();ball.vx*=1.1;ball.vy*=1.1;tone(1500,'square',0.15,0.2);}
        break;
      }
    }
  }

  // Bricks
  bricks.forEach(function(b){
    x.save();x.shadowColor=b.c;x.shadowBlur=8;
    x.fillStyle=b.c;x.beginPath();x.roundRect(b.x,b.y,b.w,b.h,3);x.fill();x.restore();
    x.fillStyle='rgba(255,255,255,.18)';x.beginPath();x.roundRect(b.x+3,b.y+3,b.w-6,b.h/3,2);x.fill();
  });
  // Paddle
  x.save();x.shadowColor='#8B5CF6';x.shadowBlur=10;
  x.fillStyle='#8B5CF6';x.beginPath();x.roundRect(PAD.x,PAD.y,PAD.w,PAD.h,5);x.fill();x.restore();
  // Ball (Monshi)
  x.save();x.shadowColor='#8B5CF6';x.shadowBlur=12;
  if(nft.complete){
    x.beginPath();x.arc(ball.x,ball.y,ball.r,0,Math.PI*2);x.clip();
    x.drawImage(nft,ball.x-ball.r,ball.y-ball.r,ball.r*2,ball.r*2);
  }
  x.restore();
  x.strokeStyle='#8B5CF6';x.lineWidth=2;
  x.beginPath();x.arc(ball.x,ball.y,ball.r,0,Math.PI*2);x.stroke();

  // HUD
  x.fillStyle='#fff';x.font='900 22px Orbitron,sans-serif';x.fillText(score,20,30);
  x.fillStyle='rgba(167,139,250,.5)';x.font='700 8px Space Mono,monospace';x.fillText('SCORE',20,42);
  x.fillStyle='#4ADE80';x.font='900 16px Orbitron,sans-serif';x.textAlign='right';x.fillText('BEST '+best,W-20,30);
  x.fillStyle='#FCD34D';x.fillText('LVL '+level,W-20,52);
  x.fillStyle='#EF4444';x.font='700 11px Space Mono,monospace';x.textAlign='center';x.fillText('LIVES '+'❤'.repeat(lives),W/2,30);
  x.textAlign='left';

  if(st==='start'){
    x.fillStyle='rgba(0,0,8,.78)';x.fillRect(0,0,W,H);
    x.save();x.shadowColor='#8B5CF6';x.shadowBlur=24;x.fillStyle='#EDE9FF';
    x.font='900 44px Orbitron,sans-serif';x.textAlign='center';
    x.fillText('MONSHI',W/2,H/2-40);x.restore();
    x.fillStyle='#4ADE80';x.font='900 30px Orbitron,sans-serif';
    x.fillText('BREAKER',W/2,H/2-5);
    x.fillStyle='rgba(196,181,253,.6)';x.font='700 11px Space Mono,monospace';
    x.fillText('MOUSE / TOUCH / ARROWS',W/2,H/2+25);
    x.fillText('BREAK ALL THE BRICKS',W/2,H/2+42);
    var p=0.5+0.5*Math.sin(tick*0.07);
    x.fillStyle='rgba(74,222,128,'+p+')';x.font='700 13px Space Mono';
    x.fillText('[ TAP TO START ]',W/2,H/2+80);
    x.textAlign='left';
  }
  if(st==='dead'){
    x.fillStyle='rgba(0,0,8,.85)';x.fillRect(0,0,W,H);
    x.save();x.shadowColor='#EF4444';x.shadowBlur=24;x.fillStyle='#FCA5A5';
    x.font='900 46px Orbitron,sans-serif';x.textAlign='center';
    x.fillText('RUGGED',W/2,H/2-30);x.restore();
    x.fillStyle='#EDE9FF';x.font='900 28px Orbitron,sans-serif';
    x.fillText(score,W/2,H/2+10);
    x.fillStyle='#4ADE80';x.font='700 13px Space Mono';
    x.fillText('BEST  '+best,W/2,H/2+38);
    x.fillStyle='rgba(74,222,128,.6)';x.fillText('[ TAP TO RETRY ]',W/2,H/2+78);
    x.fillStyle='#22C55E';x.fillText('BUY $MONSHI →',W/2,H/2+108);
    x.textAlign='left';
  }
}
c.addEventListener('click',function(e){if(st!=='dead')return;var r=c.getBoundingClientRect();var s=W/r.width;var cy=(e.clientY-r.top)*s;if(cy>H/2+90&&cy<H/2+125){window.open(BUY_URL,'_blank');}});
loop();
