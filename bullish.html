<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#A855F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MONSHI">
<link rel="icon" type="image/png" href="/favicon.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BULLISH SCORE — MONSHI</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#02000a;font-family:'Space Mono',monospace;color:#fff;padding:30px 20px;}
.wrap{max-width:920px;margin:0 auto;}
.bk{display:inline-block;color:rgba(139,92,246,.7);text-decoration:none;font-size:11px;letter-spacing:1.5px;background:rgba(0,0,0,.5);padding:6px 12px;border-radius:8px;border:1px solid rgba(139,92,246,.2);margin-bottom:24px;}
h1{font-family:Orbitron,sans-serif;font-size:clamp(36px,7vw,72px);font-weight:900;background:linear-gradient(135deg,#22C55E,#FCD34D,#EF4444);background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:5px;text-align:center;margin-bottom:6px;}
.subt{text-align:center;color:rgba(196,181,253,.65);letter-spacing:3px;margin-bottom:30px;font-size:11px;}

/* Gauge */
.gaugeBox{padding:30px;background:radial-gradient(circle at 50% 80%,rgba(139,92,246,.15),rgba(20,5,50,.7));border:1.5px solid rgba(139,92,246,.3);border-radius:18px;margin-bottom:24px;text-align:center;}
.gaugeWrap{position:relative;width:300px;height:160px;margin:0 auto;}
.gaugeSvg{width:100%;height:auto;display:block;}
.gaugeNum{font-family:Orbitron,sans-serif;font-size:48px;font-weight:900;color:#fff;margin-top:-30px;text-shadow:0 0 20px currentColor;letter-spacing:2px;}
.gaugeLabel{font-family:Orbitron,sans-serif;font-size:18px;letter-spacing:6px;font-weight:900;margin-top:6px;}
.gaugeSub{font-size:11px;color:rgba(196,181,253,.6);letter-spacing:2px;margin-top:6px;}

/* Component breakdown */
.factors{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-bottom:24px;}
.factor{background:rgba(20,5,50,.6);border:1px solid rgba(139,92,246,.25);border-radius:14px;padding:18px;}
.fhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.fhead .nm{font-family:Orbitron,sans-serif;font-size:11px;color:#A855F7;letter-spacing:2px;font-weight:900;}
.fhead .vl{font-family:Orbitron,sans-serif;font-size:18px;font-weight:900;}
.fbar{height:8px;background:rgba(0,0,0,.4);border-radius:4px;overflow:hidden;margin-bottom:6px;}
.fbar-fill{height:100%;transition:width .6s ease;}
.fdesc{font-size:10px;color:rgba(167,139,250,.6);letter-spacing:1px;margin-top:6px;line-height:1.4;}

/* Mood verdict */
.verdict{background:rgba(20,5,50,.5);border:1.5px solid rgba(139,92,246,.3);border-radius:14px;padding:24px;text-align:center;margin-bottom:24px;}
.vEmoji{font-size:48px;margin-bottom:6px;}
.vText{font-family:Orbitron,sans-serif;font-size:14px;letter-spacing:2px;line-height:1.6;color:#fff;}

.refresh{text-align:center;font-size:10px;color:rgba(167,139,250,.4);letter-spacing:2px;margin-top:14px;}
.kingP{position:fixed;bottom:6px;right:10px;font-size:9px;color:rgba(255,255,255,.18);letter-spacing:1.5px;}
</style>
</head>
<body>
<div class="wrap">
<a class="bk" href="/">← ALL GAMES</a>
<h1>BULLISH SCORE</h1>
<div class="subt">REAL-TIME PROJECT HEALTH · UPDATES EVERY 60s</div>

<div class="gaugeBox">
  <div class="gaugeWrap">
    <svg class="gaugeSvg" viewBox="0 0 300 170">
      <defs>
        <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#EF4444"/>
          <stop offset="50%" stop-color="#FCD34D"/>
          <stop offset="100%" stop-color="#22C55E"/>
        </linearGradient>
      </defs>
      <!-- Background arc -->
      <path d="M 30 150 A 120 120 0 0 1 270 150" fill="none" stroke="rgba(139,92,246,.15)" stroke-width="22" stroke-linecap="round"/>
      <!-- Filled arc -->
      <path id="gaugeArc" d="M 30 150 A 120 120 0 0 1 270 150" fill="none" stroke="url(#gaugeGrad)" stroke-width="22" stroke-linecap="round" stroke-dasharray="377" stroke-dashoffset="377" style="transition:stroke-dashoffset 1s ease;"/>
      <!-- Tick labels -->
      <text x="30" y="170" fill="rgba(167,139,250,.5)" font-size="10" font-family="Orbitron,sans-serif" text-anchor="middle">RUG</text>
      <text x="150" y="20" fill="rgba(167,139,250,.5)" font-size="10" font-family="Orbitron,sans-serif" text-anchor="middle">⚖</text>
      <text x="270" y="170" fill="rgba(167,139,250,.5)" font-size="10" font-family="Orbitron,sans-serif" text-anchor="middle">MOON</text>
    </svg>
  </div>
  <div class="gaugeNum" id="scoreN">--</div>
  <div class="gaugeLabel" id="scoreL">CALCULATING</div>
  <div class="gaugeSub" id="scoreS">Pulling on-chain data...</div>
</div>

<div class="factors" id="factors"></div>

<div class="verdict" id="verdict">
  <div class="vEmoji">⏳</div>
  <div class="vText">Loading verdict...</div>
</div>

<div class="refresh">Auto-refreshes every 60 seconds · <span id="lastUpdate">--</span></div>
</div>

<script src="/monshi-shared.js"></script>
<script src="/referral-track.js" defer></script>
<script src="/prize-banner.js" defer></script>
<script src="/pwa-install.js" defer></script>
<div class="kingP">a KING PETTY build</div>

<script>
var CONTRACT='0xB744F5CDb792d8187640214C4A1c9aCE29af7777';

async function loadAll(){
  // 1. Price + volume from DexScreener
  var dex=null;
  try{
    var r=await fetch('https://api.dexscreener.com/latest/dex/tokens/'+CONTRACT);
    var d=await r.json();
    if(d.pairs&&d.pairs.length){dex=d.pairs.sort(function(a,b){return (b.liquidity&&b.liquidity.usd||0)-(a.liquidity&&a.liquidity.usd||0);})[0];}
  }catch(e){}
  
  // 2. Holder count from nadapp via our proxy
  var holders=null,topConcentration=null;
  try{
    var r=await fetch('/api/holders?limit=20');
    var d=await r.json();
    var hs = d.holders||d.data||(Array.isArray(d)?d:[]);
    if(hs.length){
      holders = d.total_count||d.total||hs.length;
      // Top 10 concentration  
      var top10=0,total=0;
      hs.slice(0,10).forEach(function(h){
        var info=h.balance_info||{};
        var bal=parseFloat(info.balance||h.balance||0);
        if(bal>1e15)bal=bal/1e18;
        top10+=bal;
      });
      // Use FDV/price for total supply
      if(dex&&dex.fdv&&dex.priceUsd){
        var supply=parseFloat(dex.fdv)/parseFloat(dex.priceUsd);
        if(supply>0)topConcentration=(top10/supply)*100;
      }
    }
  }catch(e){console.log('holder err',e);}
  
  computeScore(dex, holders, topConcentration);
}

function computeScore(dex, holders, topConcentration){
  var factors = [];
  var totalScore = 0, totalWeight = 0;
  
  // FACTOR 1: Buy/Sell Ratio (0-100, higher is bullish)
  var buyRatio = 50;
  if(dex && dex.txns && dex.txns.h24){
    var buys = dex.txns.h24.buys||0;
    var sells = dex.txns.h24.sells||0;
    if(buys+sells>0){
      buyRatio = (buys/(buys+sells))*100;
    }
  }
  factors.push({
    name: 'BUY PRESSURE',
    value: buyRatio.toFixed(0),
    suffix: '%',
    desc: dex&&dex.txns&&dex.txns.h24 ? (dex.txns.h24.buys||0)+' buys vs '+(dex.txns.h24.sells||0)+' sells (24h)' : 'No data',
    score: buyRatio,
    weight: 3
  });
  
  // FACTOR 2: Price 24h change (0-100, scaled)
  var priceChange = dex && dex.priceChange ? parseFloat(dex.priceChange.h24||0) : 0;
  // Map -50% to 0, 0% to 50, +50% to 100
  var priceScore = Math.max(0, Math.min(100, 50 + priceChange));
  factors.push({
    name: 'PRICE 24H',
    value: (priceChange>=0?'+':'')+priceChange.toFixed(2),
    suffix: '%',
    desc: priceChange>=0?'Bag pumping':'Bag dumping',
    score: priceScore,
    weight: 2
  });
  
  // FACTOR 3: Volume (24h vs liquidity ratio - higher = active)
  var volScore = 50;
  if(dex && dex.volume && dex.liquidity){
    var vol24 = parseFloat(dex.volume.h24||0);
    var liq = parseFloat(dex.liquidity.usd||0);
    if(liq > 0){
      var ratio = vol24 / liq;
      // Healthy ratio is 0.5-2x. Above 2x = high activity, below 0.1 = dead
      volScore = Math.min(100, ratio * 50);
    }
  }
  var volH24 = dex&&dex.volume?parseFloat(dex.volume.h24||0):0;
  factors.push({
    name: 'VOLUME (24H)',
    value: volH24>=1e6?(volH24/1e6).toFixed(2)+'M':volH24>=1e3?(volH24/1e3).toFixed(1)+'K':volH24.toFixed(0),
    suffix: ' USD',
    desc: volScore>70?'High activity':volScore>40?'Decent flow':'Slow market',
    score: volScore,
    weight: 2
  });
  
  // FACTOR 4: Holder concentration (lower = healthier distribution)
  var concScore = 50;
  if(topConcentration!=null){
    // 30% in top 10 = healthy (score 80). 70%+ = concerning (score 20)
    concScore = Math.max(0, Math.min(100, 110 - topConcentration));
  }
  factors.push({
    name: 'DISTRIBUTION',
    value: topConcentration!=null?topConcentration.toFixed(1):'--',
    suffix: '% in top 10',
    desc: concScore>70?'Healthy spread':concScore>40?'Some whales':'Heavy concentration',
    score: concScore,
    weight: 1
  });
  
  // FACTOR 5: Liquidity depth
  var liqScore = 50;
  if(dex&&dex.liquidity){
    var liq = parseFloat(dex.liquidity.usd||0);
    // $5K = poor (10), $50K = decent (50), $500K+ = excellent (100)
    if(liq>0)liqScore = Math.min(100, Math.log10(liq/500)*30+10);
  }
  var liqUsd = dex&&dex.liquidity?parseFloat(dex.liquidity.usd||0):0;
  factors.push({
    name: 'LIQUIDITY',
    value: liqUsd>=1e6?(liqUsd/1e6).toFixed(2)+'M':liqUsd>=1e3?(liqUsd/1e3).toFixed(1)+'K':liqUsd.toFixed(0),
    suffix: ' USD',
    desc: liqScore>70?'Deep pool':liqScore>40?'Trade-able':'Thin ice',
    score: liqScore,
    weight: 2
  });
  
  // Weighted average
  factors.forEach(function(f){
    totalScore += f.score * f.weight;
    totalWeight += f.weight;
  });
  var finalScore = totalWeight>0 ? Math.round(totalScore/totalWeight) : 50;
  
  renderGauge(finalScore, factors);
}

function renderGauge(score, factors){
  // Update arc
  var pct = score/100;
  var dashOffset = 377 - (377 * pct);
  document.getElementById('gaugeArc').setAttribute('stroke-dashoffset', dashOffset);
  
  // Number + label
  document.getElementById('scoreN').textContent = score;
  var label, color, emoji, verdict;
  if(score >= 80){label='MAX BULLISH';color='#22C55E';emoji='🚀';verdict='Bag is COOKING. Whales accumulating, buy pressure stacking. Don\\'t blink.';}
  else if(score >= 65){label='BULLISH';color='#4ADE80';emoji='📈';verdict='Healthy momentum. Good entries available, distribution looking clean.';}
  else if(score >= 50){label='NEUTRAL';color='#FCD34D';emoji='⚖️';verdict='Mixed signals. Watch the next 24h closely. Could break either direction.';}
  else if(score >= 35){label='BEARISH';color='#F97316';emoji='📉';verdict='Sell pressure building. Volume softening. Position cautiously.';}
  else if(score >= 20){label='VERY BEARISH';color='#EF4444';emoji='😬';verdict='Heavy red. Most metrics flashing warnings. Defensive mode.';}
  else{label='RUG MODE';color='#991B1B';emoji='💀';verdict='Everything is broken. This is when degens become legends.';}
  
  document.getElementById('scoreN').style.color = color;
  document.getElementById('scoreL').textContent = label;
  document.getElementById('scoreL').style.color = color;
  document.getElementById('scoreS').textContent = score >= 50 ? 'Project health is positive' : 'Project health needs attention';
  
  // Verdict
  document.querySelector('.vEmoji').textContent = emoji;
  document.querySelector('.vText').textContent = verdict;
  
  // Render factors
  var fEl = document.getElementById('factors');
  fEl.innerHTML = '';
  factors.forEach(function(f){
    var fcolor = f.score>=70?'#4ADE80':f.score>=40?'#FCD34D':'#F87171';
    var card = document.createElement('div');
    card.className = 'factor';
    card.innerHTML = '<div class="fhead"><div class="nm">'+f.name+'</div><div class="vl" style="color:'+fcolor+';">'+f.value+'<span style="font-size:11px;font-weight:400;color:rgba(196,181,253,.6);"> '+(f.suffix||'')+'</span></div></div>'+
      '<div class="fbar"><div class="fbar-fill" style="width:'+f.score+'%;background:'+fcolor+';"></div></div>'+
      '<div class="fdesc">'+f.desc+'</div>';
    fEl.appendChild(card);
  });
  
  document.getElementById('lastUpdate').textContent = 'Updated ' + new Date().toLocaleTimeString();
}

loadAll();
setInterval(loadAll, 60000);
</script>
</body>
</html>
