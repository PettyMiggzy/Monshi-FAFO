<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#A855F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" href="/favicon.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MONAD ECOSYSTEM — MONSHI ARCADE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:wght@400;700&family=JetBrains+Mono&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#02000a;font-family:'Space Mono',monospace;color:#fff;padding:30px 20px;}
.wrap{max-width:1200px;margin:0 auto;}
.bk{display:inline-block;color:rgba(139,92,246,.7);text-decoration:none;font-size:11px;letter-spacing:1.5px;background:rgba(0,0,0,.5);padding:6px 12px;border-radius:8px;border:1px solid rgba(139,92,246,.2);margin-bottom:24px;}
h1{font-family:Orbitron,sans-serif;font-size:clamp(32px,6vw,64px);font-weight:900;background:linear-gradient(135deg,#A855F7,#22C55E);background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:5px;text-align:center;margin-bottom:6px;}
.subt{text-align:center;color:rgba(196,181,253,.65);letter-spacing:3px;margin-bottom:20px;font-size:11px;}
.controls{display:flex;justify-content:center;gap:8px;margin-bottom:24px;flex-wrap:wrap;}
.ctrl{padding:8px 16px;background:rgba(20,5,50,.6);border:1.5px solid rgba(139,92,246,.3);border-radius:24px;color:rgba(220,210,255,.7);font-family:Orbitron,sans-serif;font-size:10px;font-weight:700;cursor:pointer;letter-spacing:2px;}
.ctrl.active{background:linear-gradient(135deg,#A855F7,#7C3AED);border-color:#A855F7;color:#fff;}

.statsBar{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px;padding:18px;background:rgba(20,5,50,.5);border:1px solid rgba(139,92,246,.2);border-radius:12px;}
.s{text-align:center;}
.s .v{font-family:Orbitron,sans-serif;font-size:22px;font-weight:900;color:#fff;}
.s .l{font-size:9px;color:rgba(167,139,250,.6);letter-spacing:2px;margin-top:4px;}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}
.card{position:relative;background:rgba(20,5,50,.6);border:1.5px solid rgba(139,92,246,.25);border-radius:14px;padding:16px;text-decoration:none;color:inherit;transition:all .25s;cursor:pointer;overflow:hidden;}
.card.monshi{background:linear-gradient(135deg,rgba(168,85,247,.2),rgba(20,5,50,.6));border-color:#A855F7;box-shadow:0 0 24px rgba(168,85,247,.3);}
.card:hover{transform:translateY(-3px);border-color:#fff;box-shadow:0 12px 24px rgba(139,92,246,.3);}
.cardHead{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.cardImg{width:44px;height:44px;border-radius:10px;background:rgba(139,92,246,.15);display:flex;align-items:center;justify-content:center;font-size:24px;border:1px solid rgba(139,92,246,.3);overflow:hidden;flex-shrink:0;}
.cardImg img{width:100%;height:100%;object-fit:cover;}
.cardName{font-family:Orbitron,sans-serif;font-size:13px;font-weight:900;color:#fff;letter-spacing:1.5px;line-height:1.2;}
.cardTicker{font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(167,139,250,.6);margin-top:2px;}
.cardDesc{color:rgba(196,181,253,.7);font-size:11px;line-height:1.5;margin-bottom:10px;letter-spacing:.3px;min-height:32px;}
.cardStats{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:1px;}
.cardStat{color:rgba(167,139,250,.7);}
.cardStat b{color:#fff;font-family:Orbitron,sans-serif;font-weight:900;}
.cardStat.up b{color:#4ADE80;}
.cardStat.down b{color:#F87171;}
.cardTags{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap;}
.cardTag{font-size:8px;padding:2px 7px;background:rgba(139,92,246,.15);border:1px solid rgba(139,92,246,.3);border-radius:10px;color:rgba(196,181,253,.8);letter-spacing:1px;font-family:Orbitron,sans-serif;font-weight:700;}
.note{margin-top:24px;text-align:center;font-size:10px;color:rgba(167,139,250,.5);letter-spacing:2px;}
.kingP{position:fixed;bottom:6px;right:10px;font-size:9px;color:rgba(255,255,255,.18);letter-spacing:1.5px;}
</style>
</head>
<body>
<div class="wrap">
<a class="bk" href="/">← ARCADE</a>
<h1>MONAD ECOSYSTEM</h1>
<div class="subt">EVERY MAJOR PROJECT · ONE PAGE · LIVE DATA</div>

<div class="controls">
  <div class="ctrl active" data-cat="all">ALL</div>
  <div class="ctrl" data-cat="memes">MEMES</div>
  <div class="ctrl" data-cat="defi">DEFI</div>
  <div class="ctrl" data-cat="infra">INFRA</div>
  <div class="ctrl" data-cat="nft">NFT</div>
  <div class="ctrl" data-cat="games">GAMES</div>
</div>

<div class="statsBar">
  <div class="s"><div class="v" id="totalProjects">--</div><div class="l">PROJECTS</div></div>
  <div class="s"><div class="v" style="color:#4ADE80;" id="totalMcap">--</div><div class="l">TOTAL MCAP</div></div>
  <div class="s"><div class="v" style="color:#FCD34D;" id="totalVol">--</div><div class="l">24H VOLUME</div></div>
  <div class="s"><div class="v" style="color:#A855F7;">MONAD</div><div class="l">CHAIN 143</div></div>
</div>

<div class="grid" id="grid"></div>

<div class="note">DATA FROM DEXSCREENER · UPDATES EVERY 60s · NOT FINANCIAL ADVICE</div>
</div>

<script src="/monshi-shared.js"></script>
<script src="/referral-track.js" defer></script>
<script src="/prize-banner.js" defer></script>
<script src="/pwa-install.js" defer></script>
<div class="kingP">a KING PETTY build</div>

<script>
// Curated list of major Monad ecosystem projects
var PROJECTS = [
  // MEMES
  {name:'MONSHI', ticker:'$MONSHI', cat:'memes', emoji:'🐱', tags:['MEME','ARCADE','NFTs'], desc:'Built on Monad. Community first. Utility driven.', addr:'0xB744F5CDb792d8187640214C4A1c9aCE29af7777', monshi:true, links:{site:'https://monshi.xyz',buy:'https://nad.fun/tokens/0xB744F5CDb792d8187640214C4A1c9aCE29af7777'}},
  {name:'CHOG', ticker:'$CHOG', cat:'memes', emoji:'😈', tags:['MEME','OG'], desc:'Monad\\'s first meme and community token.', addr:null, links:{}},
  {name:'BOB', ticker:'$BOB', cat:'memes', emoji:'🥚', tags:['MEME','COMMUNITY'], desc:'The community memecoin of Monad.', addr:null, links:{}},
  {name:'SHRAMP', ticker:'$SHRAMP', cat:'memes', emoji:'🦐', tags:['MEME','MONANIMAL'], desc:'Stands out from all other Monanimals with bright yellow.', addr:null, links:{}},
  {name:'MONCOCK', ticker:'$MONCOCK', cat:'memes', emoji:'🐔', tags:['MEME'], desc:'The unofficial mascot. Meme energy peak.', addr:null, links:{}},
  {name:'EMONAD', ticker:'$EMO', cat:'memes', emoji:'🖤', tags:['MEME'], desc:'i lost it all on day 1', addr:null, links:{}},
  {name:'NADS', ticker:'$NADS', cat:'memes', emoji:'🧙', tags:['MEME','OG'], desc:'Community-driven Monad memecoin.', addr:null, links:{}},
  {name:'MONIGGA', ticker:'$MONIGGA', cat:'memes', emoji:'🎽', tags:['MEME'], desc:'The blackest nigga breathing.', addr:null, links:{}},
  
  // DEFI / INFRA
  {name:'NAD.FUN', ticker:'-', cat:'defi', emoji:'🚀', tags:['LAUNCHPAD','DEX'], desc:'The pump.fun of Monad. Token launch + bonding curve trading.', links:{site:'https://nad.fun'}},
  {name:'MONADEX', ticker:'-', cat:'defi', emoji:'🔄', tags:['DEX','SWAP'], desc:'Decentralized exchange built natively on Monad.', links:{}},
  
  // NFT
  {name:'MONSHI NFT', ticker:'278 supply', cat:'nft', emoji:'🎴', tags:['PFP','OG'], desc:'278 unique Monshi PFPs. Exclusive arcade perks.', links:{site:'https://opensea.io/collection/monshi-nft-collection-563194175'}},
  
  // GAMES
  {name:'MONSHI ARCADE', ticker:'27 games', cat:'games', emoji:'🎮', tags:['ARCADE','LIVE'], desc:'27 games, live dashboard, holder perks. You\\'re here.', links:{site:'/'}, monshi:true},
  {name:'TCG ARENA', ticker:'-', cat:'games', emoji:'🃏', tags:['CARDS','AI'], desc:'AI-powered trading card game on Monad.', links:{}},
];

var currentCat = 'all';

async function fetchPriceFor(addr){
  if(!addr) return null;
  try{
    var r = await fetch('https://api.dexscreener.com/latest/dex/tokens/'+addr);
    var d = await r.json();
    if(d.pairs && d.pairs.length){
      return d.pairs.sort(function(a,b){return (b.liquidity&&b.liquidity.usd||0)-(a.liquidity&&a.liquidity.usd||0);})[0];
    }
  }catch(e){}
  return null;
}

function fmtUsd(n){
  if(!n||n<0.0001)return '--';
  if(n<0.01)return '$'+n.toFixed(8);
  if(n<1)return '$'+n.toFixed(4);
  if(n<1e3)return '$'+n.toFixed(2);
  if(n<1e6)return '$'+(n/1e3).toFixed(1)+'K';
  if(n<1e9)return '$'+(n/1e6).toFixed(2)+'M';
  return '$'+(n/1e9).toFixed(2)+'B';
}

async function render(){
  var grid = document.getElementById('grid');
  grid.innerHTML = '';
  var totalMcap = 0, totalVol = 0, count = 0;
  
  var filtered = PROJECTS.filter(function(p){return currentCat==='all' || p.cat===currentCat;});
  
  for(var i=0;i<filtered.length;i++){
    var p = filtered[i];
    var data = await fetchPriceFor(p.addr);
    
    var price = data ? parseFloat(data.priceUsd) : null;
    var mcap = data ? parseFloat(data.marketCap||data.fdv||0) : null;
    var vol = data && data.volume ? parseFloat(data.volume.h24||0) : null;
    var change = data && data.priceChange ? parseFloat(data.priceChange.h24||0) : null;
    
    if(mcap) totalMcap += mcap;
    if(vol) totalVol += vol;
    count++;
    
    var card = document.createElement('a');
    card.className = 'card' + (p.monshi?' monshi':'');
    card.href = p.links.buy || p.links.site || '#';
    if(card.href !== '#' && card.href !== '/') card.target = '_blank';
    
    var changeColor = change===null ? '' : change>=0 ? 'up' : 'down';
    var changeStr = change===null ? '' : (change>=0?'+':'')+change.toFixed(2)+'%';
    
    card.innerHTML = 
      '<div class="cardHead">'+
        '<div class="cardImg">'+p.emoji+'</div>'+
        '<div><div class="cardName">'+p.name+'</div><div class="cardTicker">'+p.ticker+'</div></div>'+
      '</div>'+
      '<div class="cardDesc">'+p.desc+'</div>'+
      '<div class="cardStats">'+
        (price ? '<div class="cardStat"><b>'+fmtUsd(price)+'</b></div>' : '<div class="cardStat" style="opacity:.4;">no price data</div>')+
        (changeStr ? '<div class="cardStat '+changeColor+'"><b>'+changeStr+'</b></div>' : '<div></div>')+
      '</div>'+
      (mcap ? '<div class="cardStats" style="margin-top:6px;"><div class="cardStat">MCAP <b>'+fmtUsd(mcap)+'</b></div><div class="cardStat">VOL <b>'+fmtUsd(vol||0)+'</b></div></div>' : '')+
      '<div class="cardTags">'+p.tags.map(function(t){return '<span class="cardTag">'+t+'</span>';}).join('')+'</div>';
    
    grid.appendChild(card);
  }
  
  document.getElementById('totalProjects').textContent = count;
  document.getElementById('totalMcap').textContent = totalMcap ? fmtUsd(totalMcap) : '--';
  document.getElementById('totalVol').textContent = totalVol ? fmtUsd(totalVol) : '--';
}

document.querySelectorAll('.ctrl').forEach(function(c){
  c.onclick = function(){
    document.querySelectorAll('.ctrl').forEach(function(x){x.classList.remove('active');});
    c.classList.add('active');
    currentCat = c.dataset.cat;
    render();
  };
});

render();
setInterval(render, 60000);
</script>
</body>
</html>
