var AC=window.AudioContext||window.webkitAudioContext,actx=null,master=null;
function initAudio(){if(actx)return;try{actx=new AC();master=actx.createGain();master.gain.value=0.25;master.connect(actx.destination);}catch(e){}}
function tone(f,t,v,o,d){if(!actx)return;var st=actx.currentTime+(o||0);var os=actx.createOscillator();var g=actx.createGain();os.type=t||'square';os.frequency.setValueAtTime(f,st);g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(v,st+0.01);g.gain.exponentialRampToValueAtTime(0.001,st+d);os.connect(g);g.connect(master);os.start(st);os.stop(st+d+0.05);}
function sfxFlap(){tone(600,'square',0.1,0,0.06);tone(800,'square',0.07,0.04,0.05);}
function sfxPoint(){tone(880,'square',0.15,0,0.08);tone(1320,'square',0.12,0.05,0.1);}

function reset(){P.y=BH/2;P.vy=0;pipes=[];score=0;tick=0;state='playing';

}

function flap(){

}

// Background
var stars=[];for(var i=0;i<60;i++)stars.push({x:Math.random()*BW,y:Math.random()*BH,r:rnd(0.3,1.5),s:rnd(0.2,0.8)});

function drawBG(){
  var g=ctx.createLinearGradient(0,0,0,BH);
  g.addColorStop(0,'#02000a');g.addColorStop(1,'#1a0040');
  ctx.fillStyle=g;ctx.fillRect(0,0,BW,BH);
  stars.forEach(function(s){s.x-=s.s;if(s.x<0)s.x=BW;ctx.fillStyle='rgba(210,195,255,'+(0.3+0.5*Math.sin(tick*0.02+s.x))+')';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();});
  // Grid
  ctx.strokeStyle='rgba(120,50,200,.08)';for(var y=0;y<BH;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(BW,y);ctx.stroke();}
}

function drawPipe(p){
  ctx.save();ctx.shadowColor='#22C55E';ctx.shadowBlur=15;
  // Top pipe
  var grd=ctx.createLinearGradient(p.x,0,p.x+60,0);
  grd.addColorStop(0,'#14532D');grd.addColorStop(0.5,'#22C55E');grd.addColorStop(1,'#15803D');
  ctx.fillStyle=grd;
  ctx.fillRect(p.x,0,60,p.y);
  ctx.fillRect(p.x-5,p.y-25,70,25); // cap
  // Bottom pipe
  ctx.fillRect(p.x,p.y+GAP,60,BH-(p.y+GAP));
  ctx.fillRect(p.x-5,p.y+GAP,70,25); // cap
  ctx.shadowBlur=0;
  // Highlight
  ctx.fillStyle='rgba(255,255,255,.15)';
  ctx.fillRect(p.x+5,0,12,p.y);
  ctx.fillRect(p.x+5,p.y+GAP,12,BH-(p.y+GAP));
  ctx.restore();
}

function drawPlayer(){
  ctx.save();
  // Tilt based on velocity
  var ang=Math.max(-0.5,Math.min(1.2,P.vy*0.08));
  ctx.translate(P.x,P.y);ctx.rotate(ang);
  ctx.shadowColor='#8B5CF6';ctx.shadowBlur=15;
  if(face.complete){
    ctx.beginPath();ctx.arc(0,0,P.r,0,Math.PI*2);ctx.clip();
    ctx.drawImage(face,-P.r,-P.r,P.r*2,P.r*2);
  }
  ctx.restore();
  ctx.save();ctx.translate(P.x,P.y);ctx.rotate(ang);
  ctx.shadowColor='#8B5CF6';ctx.shadowBlur=10;
  ctx.strokeStyle='#8B5CF6';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(0,0,P.r,0,Math.PI*2);ctx.stroke();
  ctx.restore();
}

function drawHUD(){

    ctx.fillStyle='#fff';ctx.font='900 56px Orbitron,sans-serif';ctx.textAlign='center';
    ctx.fillText(score,BW/2,90);ctx.restore();
  }
  ctx.fillStyle='rgba(255,255,255,.16)';ctx.font='700 9px Space Mono,monospace';ctx.textAlign='right';
  ctx.fillText('a KING PETTY build',BW-12,BH-10);ctx.textAlign='left';
}

function drawStart(){
  ctx.fillStyle='rgba(0,0,8,.65)';ctx.fillRect(0,0,BW,BH);
  ctx.save();ctx.shadowColor='#8B5CF6';ctx.shadowBlur=30;
  ctx.fillStyle='#EDE9FF';ctx.font='900 48px Orbitron,sans-serif';ctx.textAlign='center';
  ctx.fillText('FLAPPY',BW/2,BH/2-80);ctx.restore();
  ctx.save();ctx.shadowColor='#22C55E';ctx.shadowBlur=20;
  ctx.fillStyle='#4ADE80';ctx.font='900 36px Orbitron,sans-serif';
  ctx.fillText('MONSHI',BW/2,BH/2-30);ctx.restore();
  ctx.fillStyle='rgba(196,181,253,.7)';ctx.font='700 14px Space Mono,monospace';
  ctx.fillText('Tap or Space to flap',BW/2,BH/2+30);
  ctx.fillText('Dodge the green candles',BW/2,BH/2+50);
  var pulse=0.5+0.5*Math.sin(tick*0.1);
  ctx.fillStyle='rgba(74,222,128,'+pulse+')';ctx.font='700 16px Orbitron,sans-serif';
  ctx.fillText('TAP TO PLAY',BW/2,BH/2+100);
  ctx.fillStyle='#FCD34D';ctx.font='700 12px Space Mono,monospace';
  ctx.fillText('BEST: '+best,BW/2,BH/2+140);
  ctx.textAlign='left';
}

function update(){
  tick++;
  P.vy+=GRAV;P.y+=P.vy;
  // Pipes
  pipes.forEach(function(p){p.x-=2.5;});
  pipes=pipes.filter(function(p){return p.x>-80;});
  while(pipes.length<3){
    var lastX=pipes.length?pipes[pipes.length-1].x:BW;
    pipes.push({x:lastX+220,y:rnd(80,BH-80-GAP),scored:false});
  }
  // Score / collision
  pipes.forEach(function(p){
    if(!p.scored&&p.x+60<P.x){p.scored=true;score++;sfxPoint();}
    // Collision
    if(P.x+P.r>p.x&&P.x-P.r<p.x+60){
      if(P.y-P.r<p.y||P.y+P.r>p.y+GAP){die();}
    }
  });
  if(P.y+P.r>BH||P.y-P.r<0)die();
}

function die(){
  if(state!=='playing')return;
  state='dead';sfxDie();lastScore=score;
  if(score>best){best=score;localStorage.setItem('flappy_best',best);}
  if(playerName)submitScore(score);else showDeathNoSubmit();
}

// Leaderboard (uses scores_flappy table)
function sbH(){return{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=representation'};}
function fetchLeaderboard(){fetch(SUPABASE_URL+'/rest/v1/scores_flappy?select=name,score&order=score.desc&limit=10',{headers:sbH()}).then(function(r){return r.json();}).then(function(d){if(Array.isArray(d))leaderboard=d;}).catch(function(){});}
function submitScore(sc){
  fetch(SUPABASE_URL+'/rest/v1/scores_flappy',{method:'POST',headers:sbH(),body:JSON.stringify({name:playerName,score:Math.floor(sc)})})
    .then(function(){return fetch(SUPABASE_URL+'/rest/v1/scores_flappy?select=name,score&order=score.desc&limit=10',{headers:sbH()});})
    .then(function(r){return r.json();}).then(function(d){if(Array.isArray(d)){leaderboard=d;playerRank=leaderboard.findIndex(function(s){return s.name===playerName&&s.score===Math.floor(sc);})+1;renderDeath(sc);}}).catch(function(){renderDeath(sc);});
}
function showDeathNoSubmit(){document.getElementById('nameSubmit').style.display='block';document.getElementById('dNameInput').value='';renderDeath(lastScore);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function renderDeath(sc){
  if(playerName)document.getElementById('nameSubmit').style.display='none';
  document.getElementById('dScore').textContent=sc;
  document.getElementById('dBest').textContent=best;
  document.getElementById('lvlTag').textContent=score>=50?'YOU'+'RE HIM':score>=20?'NICE FLAP':'SKILL ISSUE';
  document.getElementById('rankTag').textContent=playerRank>0?'YOU PLACED #'+playerRank+' GLOBALLY':'';
  var tbody=document.getElementById('lbBody');tbody.innerHTML='';
  leaderboard.slice(0,6).forEach(function(s,i){var tr=document.createElement('tr');var isMe=s.name===playerName&&s.score===Math.floor(sc);if(isMe)tr.className='me';var medal=['🥇','🥈','🥉'][i]||'#'+(i+1);tr.innerHTML='<td class="rank">'+medal+'</td><td>'+esc(s.name)+'</td><td class="sc">'+s.score+'</td>';tbody.appendChild(tr);});
  document.getElementById('deathPanel').classList.add('show');
}
document.getElementById('dSubmit').addEventListener('click',function(){var n=document.getElementById('dNameInput').value.trim();playerName=(n||'ANON').toUpperCase().slice(0,16);localStorage.setItem('monshi_name',playerName);document.getElementById('nameSubmit').style.display='none';submitScore(lastScore);});
document.getElementById('dNameInput').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('dSubmit').click();});
document.getElementById('btnShare').addEventListener('click',function(){var tweet='I scored '+lastScore+' on FLAPPY MONSHI! Can you beat me? '+('https://monshi-fafo.vercel.app/api/share?game=FLAPPY%20MONSHI&score='+lastScore+'&name='+encodeURIComponent(playerName||'ANON')+'&rank='+(typeof playerRank!=='undefined'?playerRank:'')+'&goto='+encodeURIComponent(GAME_URL))+' $MONSHI #Monad';window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(tweet),'_blank');});
document.getElementById('btnBuy').addEventListener('click',function(){window.open(BUY_URL,'_blank');});
document.getElementById('btnRetry').addEventListener('click',function(){document.getElementById('deathPanel').classList.remove('show');reset();});
fetchLeaderboard();

function loop(){requestAnimationFrame(loop);drawBG();pipes.forEach(drawPipe);drawPlayer();if(state==='playing')update();else tick++;drawHUD();if(state==='start')drawStart();}
loop();
