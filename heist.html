    document.getElementById('dS').textContent=Math.floor(sc);
    document.getElementById('lT').textContent=sub||'';
    document.getElementById('rTag').textContent=playerRank>0?'#'+playerRank+' GLOBALLY':'';
    var tb=document.getElementById('lB');tb.innerHTML='';
    leaderboard.slice(0,5).forEach(function(s,i){var tr=document.createElement('tr');var isMe=s.name===playerName&&s.score===Math.floor(sc);if(isMe)tr.className='me';var medal=['🥇','🥈','🥉'][i]||'#'+(i+1);var holderBadge=s.wallet?' <span style="color:#EC4899;font-size:9px;">🎴</span>':'';tr.innerHTML='<td>'+medal+'</td><td>'+esc(s.name)+holderBadge+'</td><td class="sc">'+s.score+'</td>';tb.appendChild(tr);});
    document.getElementById('dP').classList.add('show');
  }
  if(playerName){submitS(T,sc,render);}else{document.getElementById('nS').style.display='block';render();}
  document.getElementById('dSb').onclick=function(){var n=document.getElementById('dN').value.trim();playerName=(n||'ANON').toUpperCase().slice(0,16);localStorage.setItem('monshi_name',playerName);document.getElementById('nS').style.display='none';submitS(T,sc,render);};
  document.getElementById('dN').onkeydown=function(e){if(e.key==='Enter')document.getElementById('dSb').click();};
  document.getElementById('btnShare').onclick=function(){var shareUrl='https://monshi-fafo.vercel.app/api/share?game='+encodeURIComponent(GN)+'&score='+sc+'&name='+encodeURIComponent(playerName||'ANON')+'&rank='+(playerRank||0)+'&won='+(isWin?'1':'0');var tw='I scored '+sc+' on '+GN+' on @Monshi_Monpad ARCADE 🎴\\n\\nNFT HOLDERS ONLY - flex required\\n'+shareUrl+'\\n\\n$MONSHI #Monad';window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(tw),'_blank');};
  document.getElementById('btnBuy').onclick=function(){window.open(BUY_URL,'_blank');};
}

];

function render(){
  var c = document.getElementById('content');
  if(!window.MONSHI || !MONSHI.wallet){
    c.innerHTML = '<div class="locked"><div class="lockEmoji">🔒</div><div class="lockTitle">MONSHI HEIST</div><div class="lockSub">EXCLUSIVE TO NFT HOLDERS</div><div class="tierLine">🎴 MUST OWN 1+ MONSHI NFT</div><div style="font-size:11px;color:rgba(196,181,253,.6);margin-bottom:20px;line-height:1.6;">A speed trivia game using REAL Monshi NFT trait names. Connect your wallet to verify you hold one.</div><button class="connectBtn" onclick="MONSHI.connectWallet().then(function(){setTimeout(render,1200);});">🔌 CONNECT WALLET</button></div>';

    '<div class="hud">'+
      '<div class="st"><div class="n" id="sc">0</div><div class="l">SCORE</div></div>'+
      '<div class="st"><div class="n" id="rd">0/8</div><div class="l">ROUND</div></div>'+

    '</div>'+
  '</div>';

var QS=[],idx=0,sc=0,tm=10,iv;

function startGame(){
  // Shuffle and pick 8 traits
  QS = NFT_TRAITS.slice().sort(function(){return Math.random()-0.5;}).slice(0,8);
  idx=0;sc=0;
  showQ();
}

function showQ(){
  if(idx>=QS.length){return done();}
  var trait = QS[idx];
  document.getElementById('rd').textContent = (idx+1)+'/8';
  document.getElementById('q').innerHTML = '"<i style="color:#fff;">'+trait.desc+'</i>"<br><br>Which Monshi trait is this?';
  // Create 4 options: 1 correct + 3 random other traits
  var others = NFT_TRAITS.filter(function(t){return t.name !== trait.name;}).sort(function(){return Math.random()-0.5;}).slice(0,3);
  var opts = [trait].concat(others).sort(function(){return Math.random()-0.5;});
  var optsEl = document.getElementById('opts');
  optsEl.innerHTML = '';
  opts.forEach(function(o,i){
    var d = document.createElement('div');
    d.className = 'opt';
    d.textContent = String.fromCharCode(65+i)+'. '+o.name;
    d.onclick = function(){pick(o.name === trait.name, d, optsEl);};
    optsEl.appendChild(d);
  });
  tm = 10;
  document.getElementById('tm').textContent = tm;
  clearInterval(iv);
  iv = setInterval(function(){
    tm--;
    document.getElementById('tm').textContent = tm;
    if(tm<=0){clearInterval(iv);pick(false, null, optsEl);}
  }, 1000);
}

function pick(correct, el, optsEl){
  clearInterval(iv);
  if(correct){
    sc += 100 + tm*10;
    if(el) el.classList.add('right');
  } else {
    if(el) el.classList.add('wrong');
    // Highlight the right answer
    var rightName = QS[idx].name;
    Array.prototype.forEach.call(optsEl.children, function(c){
      if(c.textContent.indexOf(rightName) > 0) c.classList.add('right');
    });
  }
  document.getElementById('sc').textContent = sc;
  setTimeout(function(){idx++;showQ();}, 1400);
}

function done(){
  showDeath('MONSHI HEIST', 'https://monshi-fafo.vercel.app/heist.html', 'scores_heist', sc, '8 rounds done', sc>=600);
}

setTimeout(render, 600);
fetchLB('scores_heist');
