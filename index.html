const RF=6, JF=6, SW=140, SH=160;
const runImg=new Image(), jumpImg=new Image(), moonImg=new Image(), nftImg=new Image();
runImg.src=RB; jumpImg.src=JB; moonImg.src=MB; nftImg.src=NB;

const canvas=document.getElementById('c'), ctx=canvas.getContext('2d');
const BW=800, BH=420;
canvas.width=BW; canvas.height=BH;
function resize(){
  var s=Math.min(innerWidth/BW,innerHeight/BH);
  canvas.style.width=BW*s+'px'; canvas.style.height=BH*s+'px';

var rnd=function(a,b){return a+Math.random()*(b-a);};

// ── Levels ────────────────────────────────────────────────
var LEVELS=[
  {num:1, name:"THE TRENCHES",  sub:"Where every degen starts",   scoreEnd:100,     baseSpd:3.5,  sky:['#02000a','#0c0025','#180038'], gnd:'#130030', glowA:'#8B5CF6', glowB:'#7C3AED', maxC:1,  ivMin:108},
  {num:2, name:"BAG SECURED",   sub:"Stack or get stacked",        scoreEnd:260,     baseSpd:5.0,  sky:['#000515','#001040','#002060'], gnd:'#001535', glowA:'#60A5FA', glowB:'#2563EB', maxC:2,  ivMin:90},
  {num:3, name:"MONAD MAINNET", sub:"The chain is live. Run.",     scoreEnd:480,     baseSpd:6.8,  sky:['#001a05','#002a10','#003818'], gnd:'#001a08', glowA:'#22C55E', glowB:'#16A34A', maxC:2,  ivMin:76},
  {num:4, name:"APING IN",      sub:"No thoughts. Only bags.",     scoreEnd:760,     baseSpd:8.6,  sky:['#1a0500','#2d0800','#3d1000'], gnd:'#1a0800', glowA:'#F97316', glowB:'#EA580C', maxC:3,  ivMin:62},
  {num:5, name:"TO THE MOON",   sub:"Monshi is him.",              scoreEnd:Infinity,baseSpd:10.2, sky:['#000010','#000520','#000a30'], gnd:'#0a0a20', glowA:'#E0E7FF', glowB:'#A5B4FC', maxC:3,  ivMin:50}
];

var GY=295, GRV=0.58;
var state='start', score=0, best=0, spd=3.5, tick=0;
var obTimer=0, lvl=0;
var transState=0; // 0=none 1=fadein 2=hold 3=fadeout
var transAlpha=0, transHold=0, transData=null;

function L(){ return LEVELS[lvl]; }

// ── Player ────────────────────────────────────────────────
var P={
  x:90, y:GY, vy:0, jumps:0,
  rf:0, rt:0, jf:0, jt:0, air:false,
  jump:function(){
    if(this.jumps<2){
      this.vy=-13.5; this.jumps++;
      this.air=true; this.jf=0; this.jt=0;
      addPuff(this.x+SW/2, GY+SH);
    }
  },
  update:function(){
    this.vy+=GRV; this.y+=this.vy;
    if(this.y>=GY){this.y=GY;this.vy=0;this.jumps=0;this.air=false;}
    if(state!=='playing') return;
    if(!this.air){this.rt++;if(this.rt>=4){this.rt=0;this.rf=(this.rf+1)%RF;}}
    else{this.jt++;if(this.jt>=3){this.jt=0;if(this.jf<JF-1)this.jf++;}}
  },
  draw:function(){
    var img=this.air?jumpImg:runImg, f=this.air?this.jf:this.rf;
    var sh=Math.max(0.05, 1-(this.y-GY)/240);
    ctx.fillStyle='rgba(80,20,150,'+(0.2*sh)+')';
    ctx.beginPath(); ctx.ellipse(this.x+SW/2,GY+SH+6,30*sh,7*sh,0,0,Math.PI*2); ctx.fill();
    if(img.complete && img.naturalWidth){
      ctx.drawImage(img, f*SW,0,SW,SH, this.x,this.y,SW,SH);
    }
  },
  hb:function(){return{x:this.x+SW*0.26,y:this.y+SH*0.1,w:SW*0.44,h:SH*0.84};}
};

// ── Obstacles ─────────────────────────────────────────────
var obs=[];
function spawn(){
  var lv=L(), count=1;
  if(lv.maxC>1 && Math.random()<0.42) count=Math.min(lv.maxC,2);
  if(lv.maxC>2 && Math.random()<0.25) count=3;
  var ox=BW+10;
  for(var i=0;i<count;i++){
    var h=rnd(65,138), w=rnd(22,36);
    obs.push({x:ox, w:w, h:h, bh:h*rnd(0.5,0.72)});
    ox+=rnd(52,95);
  }
}

function drawCandle(o){
  var lv=L(), ga=lv.glowA, gy2=GY+SH, mx=o.x+o.w/2;
  var by=gy2-o.h+(o.h-o.bh)*0.4;
  ctx.save();
  ctx.shadowColor=ga; ctx.shadowBlur=14+5*Math.sin(tick*0.08+o.x*0.01);
  // top wick
  ctx.strokeStyle=ga; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.moveTo(mx,gy2-o.h); ctx.lineTo(mx,by); ctx.stroke();
  // body
  var g=ctx.createLinearGradient(o.x,0,o.x+o.w,0);
  if(lvl===3){g.addColorStop(0,'#7C2D12');g.addColorStop(0.5,'#F97316');g.addColorStop(1,'#9A3412');}
  else if(lvl===4){g.addColorStop(0,'#1e1e3a');g.addColorStop(0.5,'#a0a8e0');g.addColorStop(1,'#1e1e3a');}
  else{g.addColorStop(0,'#14532D');g.addColorStop(0.5,'#22C55E');g.addColorStop(1,'#15803D');}
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.roundRect(o.x,by,o.w,o.bh,3); ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle='rgba(255,255,255,0.16)';
  ctx.beginPath(); ctx.roundRect(o.x+3,by+5,o.w*0.28,o.bh-10,2); ctx.fill();
  // bottom wick
  ctx.strokeStyle=ga;
  ctx.beginPath(); ctx.moveTo(mx,by+o.bh); ctx.lineTo(mx,gy2); ctx.stroke();
  // floating $
  var fy=by-10-7*Math.abs(Math.sin(tick*0.05+o.x*0.02));
  var fa=0.5+0.4*Math.sin(tick*0.05+o.x*0.02);
  ctx.shadowBlur=8; ctx.shadowColor='#FCD34D';
  ctx.fillStyle='rgba(252,211,77,'+fa+')';
  ctx.font='bold 12px Orbitron,monospace'; ctx.textAlign='center';
  ctx.fillText('$',mx,fy); ctx.textAlign='left';
  ctx.restore();
}

// ── Particles ─────────────────────────────────────────────
var parts=[];
function addPuff(x,y){
  for(var i=0;i<8;i++) parts.push({x:x,y:y,vx:rnd(-3,3),vy:rnd(-4,-0.5),life:1,r:rnd(3,6)});
}

// ── Background ────────────────────────────────────────────
var STARS=[];
for(var si=0;si<120;si++) STARS.push({x:Math.random()*BW,y:Math.random()*(GY+SH),r:rnd(0.2,1.8),t:rnd(0,6.28),s:rnd(0.06,0.35)});
var BLDGS=[];
for(var bi=0;bi<16;bi++) BLDGS.push({x:bi*(BW/14)+rnd(0,25),w:rnd(25,55),h:rnd(30,115),s:rnd(0.25,0.7)});
var gridX=0;

function drawBG(){
  var lv=L(), gy2=GY+SH;

  if(lvl===4 && moonImg.complete && moonImg.naturalWidth){
    ctx.drawImage(moonImg,0,0,BW,BH);
    ctx.fillStyle='rgba(0,0,20,0.52)'; ctx.fillRect(0,0,BW,BH);
  } else {
    var sky=ctx.createLinearGradient(0,0,0,gy2);
    var sc=lv.sky;
    for(var si2=0;si2<sc.length;si2++) sky.addColorStop(si2/(sc.length-1),sc[si2]);
    ctx.fillStyle=sky; ctx.fillRect(0,0,BW,gy2);
    var neb=ctx.createRadialGradient(BW*0.65,gy2*0.3,5,BW*0.65,gy2*0.3,230);
    neb.addColorStop(0,lv.glowB+'33'); neb.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=neb; ctx.fillRect(0,0,BW,gy2);
  }

  // Stars
  for(var s=0;s<STARS.length;s++){
    var st=STARS[s]; st.x-=st.s*(lvl===4?2:1); if(st.x<0)st.x=BW;
    var sa=0.25+0.6*Math.sin(tick*0.02+st.t);
    ctx.fillStyle='rgba(210,195,255,'+sa+')';
    ctx.beginPath(); ctx.arc(st.x,st.y,st.r,0,Math.PI*2); ctx.fill();
  }

  // Buildings (not on moon level)
  if(lvl<4){
    for(var b=0;b<BLDGS.length;b++){
      var bl=BLDGS[b]; bl.x-=bl.s; if(bl.x+bl.w<0)bl.x=BW+rnd(0,50);
      ctx.fillStyle='rgba(10,0,30,0.9)'; ctx.fillRect(bl.x,gy2-bl.h,bl.w,bl.h);
      for(var wy=gy2-bl.h+8;wy<gy2-8;wy+=13){
        for(var wx=bl.x+5;wx<bl.x+bl.w-8;wx+=9){
          if(Math.sin(wx*9+wy*4)>0.2){
            var wa=0.1+0.2*Math.sin(tick*0.025+wx+wy);
            ctx.fillStyle='rgba(150,110,240,'+wa+')';
            ctx.fillRect(wx,wy,4,6);
          }
        }
      }
    }
  }

  // Ground
  var gnd=ctx.createLinearGradient(0,gy2,0,BH);
  gnd.addColorStop(0,lv.gnd); gnd.addColorStop(1,'#04000e');
  ctx.fillStyle=gnd; ctx.fillRect(0,gy2,BW,BH-gy2);

  // Glow line
  ctx.save(); ctx.shadowColor=lv.glowA; ctx.shadowBlur=20;
  ctx.strokeStyle=lv.glowA; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,gy2); ctx.lineTo(BW,gy2); ctx.stroke(); ctx.restore();

  // Perspective grid
  gridX=(gridX-spd*0.5+100)%100;
  ctx.strokeStyle='rgba(120,50,200,0.12)'; ctx.lineWidth=1;
  for(var gx2=gridX-100;gx2<BW+100;gx2+=100){
    ctx.beginPath(); ctx.moveTo(gx2,gy2); ctx.lineTo(gx2-55,BH); ctx.stroke();
  }
  for(var r=0;r<4;r++){
    var fy=gy2+r*(BH-gy2)/3.5;
    ctx.beginPath(); ctx.moveTo(0,fy); ctx.lineTo(BW,fy); ctx.stroke();
  }
}

// ── HUD ───────────────────────────────────────────────────
function drawHUD(){
  var lv=L();
  // Score box
  ctx.fillStyle='rgba(0,0,0,0.45)'; ctx.beginPath(); ctx.roundRect(12,12,152,48,8); ctx.fill();
  ctx.strokeStyle=lv.glowB+'55'; ctx.lineWidth=1; ctx.beginPath(); ctx.roundRect(12,12,152,48,8); ctx.stroke();
  ctx.save(); ctx.shadowColor=lv.glowA; ctx.shadowBlur=10;
  ctx.fillStyle='#ffffff'; ctx.font='900 22px Orbitron,sans-serif';
  ctx.fillText(String(Math.floor(score)).padStart(6,'0'),20,40); ctx.restore();
  ctx.fillStyle=lv.glowA+'aa'; ctx.font='700 9px Space Mono,monospace';
  ctx.fillText('SCORE',20,53);
  // Best box
  ctx.fillStyle='rgba(0,0,0,0.45)'; ctx.beginPath(); ctx.roundRect(BW-164,12,152,48,8); ctx.fill();
  ctx.strokeStyle='#4ADE8055'; ctx.lineWidth=1; ctx.beginPath(); ctx.roundRect(BW-164,12,152,48,8); ctx.stroke();
  ctx.fillStyle='#4ADE80'; ctx.font='900 22px Orbitron,sans-serif';
  ctx.fillText(String(Math.floor(best)).padStart(6,'0'),BW-156,40);
  ctx.fillStyle='#4ADE8077'; ctx.font='700 9px Space Mono,monospace';
  ctx.fillText('BEST',BW-156,53);
  // Level badge
  ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.beginPath(); ctx.roundRect(BW/2-72,10,144,24,6); ctx.fill();
  ctx.save(); ctx.shadowColor=lv.glowA; ctx.shadowBlur=8;
  ctx.fillStyle=lv.glowA; ctx.font='700 10px Orbitron,sans-serif'; ctx.textAlign='center';
  ctx.fillText('LVL '+lv.num+'  '+lv.name, BW/2, 26); ctx.restore(); ctx.textAlign='left';
  // Speed bar
  var bx=BW/2-55, by2=36;
  ctx.fillStyle='rgba(255,255,255,0.07)'; ctx.beginPath(); ctx.roundRect(bx,by2,110,4,2); ctx.fill();
  var pct=Math.min((spd-3.5)/11,1);
  var bg2=ctx.createLinearGradient(bx,0,bx+110,0);
  bg2.addColorStop(0,lv.glowB); bg2.addColorStop(1,'#22C55E');
  ctx.fillStyle=bg2; ctx.beginPath(); ctx.roundRect(bx,by2,110*pct,4,2); ctx.fill();
  ctx.fillStyle=lv.glowA+'66'; ctx.font='700 8px Space Mono,monospace'; ctx.textAlign='center';
  ctx.fillText(spd.toFixed(1)+'x', BW/2+65, by2+10); ctx.textAlign='left';
  // King Petty credit
  ctx.fillStyle='rgba(255,255,255,0.16)'; ctx.font='700 9px Space Mono,monospace';
  ctx.textAlign='right'; ctx.fillText('a KING PETTY build', BW-12, BH-10); ctx.textAlign='left';
}

// ── Transition ────────────────────────────────────────────
function triggerTransition(){
  var lv=L();
  transData={num:lv.num, name:lv.name, sub:lv.sub, glow:lv.glowA};
  transState=1; transAlpha=0; transHold=0;
}
function drawTransition(){
  if(transState===0) return;
  if(transState===1){transAlpha+=0.05; if(transAlpha>=1){transAlpha=1;transState=2;}}
  else if(transState===2){transHold++; if(transHold>60)transState=3;}
  else if(transState===3){transAlpha-=0.04; if(transAlpha<=0){transAlpha=0;transState=0;transData=null;return;}}
  var da=Math.min(transAlpha*1.6, 0.9);
  ctx.fillStyle='rgba(0,0,8,'+da+')'; ctx.fillRect(0,0,BW,BH);
  var ta=Math.min(transAlpha*2,1);
  if(ta<=0) return;
  ctx.textAlign='center';
  ctx.save(); ctx.shadowColor=transData.glow; ctx.shadowBlur=35;
  ctx.fillStyle='rgba(255,255,255,'+ta+')'; ctx.font='900 72px Orbitron,sans-serif';
  ctx.fillText('LEVEL '+transData.num, BW/2, BH/2-24); ctx.restore();
  ctx.save(); ctx.shadowColor=transData.glow; ctx.shadowBlur=18;
  ctx.fillStyle=transData.glow; ctx.font='700 20px Orbitron,sans-serif';
  ctx.fillText(transData.name, BW/2, BH/2+20); ctx.restore();
  ctx.fillStyle='rgba(200,190,255,'+ta*0.7+')'; ctx.font='700 11px Space Mono,monospace';
  ctx.fillText(transData.sub, BW/2, BH/2+48);
  ctx.textAlign='left';
}

// ── Start / Game Over overlay ─────────────────────────────
function drawOverlay(){
  ctx.fillStyle='rgba(0,0,8,0.88)'; ctx.fillRect(0,0,BW,BH);
  var cw=460, ch=265, cx=BW/2-cw/2, cy=BH/2-ch/2;
  var cg=ctx.createLinearGradient(cx,cy,cx,cy+ch);
  cg.addColorStop(0,'rgba(90,30,180,0.28)'); cg.addColorStop(1,'rgba(30,0,80,0.15)');
  ctx.fillStyle=cg; ctx.beginPath(); ctx.roundRect(cx,cy,cw,ch,18); ctx.fill();
  ctx.strokeStyle='rgba(150,120,255,0.4)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.roundRect(cx,cy,cw,ch,18); ctx.stroke();
  ctx.textAlign='center';
  if(state==='start'){
    if(nftImg.complete && nftImg.naturalWidth){
      ctx.save(); ctx.beginPath(); ctx.arc(BW/2,cy-32,44,0,Math.PI*2); ctx.clip();
      ctx.drawImage(nftImg,BW/2-44,cy-76,88,88); ctx.restore();
      ctx.save(); ctx.shadowColor='#8B5CF6'; ctx.shadowBlur=20;
      ctx.strokeStyle='rgba(139,92,246,0.7)'; ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.arc(BW/2,cy-32,44,0,Math.PI*2); ctx.stroke(); ctx.restore();
    }
    ctx.save(); ctx.shadowColor='#8B5CF6'; ctx.shadowBlur=28;
    ctx.fillStyle='#EDE9FF'; ctx.font='900 42px Orbitron,sans-serif';
    ctx.fillText('MONSHI', BW/2, cy+72); ctx.restore();
    ctx.fillStyle='#4ADE80'; ctx.font='700 17px Orbitron,sans-serif';
    ctx.fillText('RUNNER', BW/2, cy+97);
    ctx.fillStyle='rgba(196,181,253,0.5)'; ctx.font='700 10px Space Mono,monospace';
    ctx.fillText('5 LEVELS  ·  DOUBLE JUMP  ·  DODGE THE CANDLES', BW/2, cy+125);
    ctx.fillStyle='rgba(139,92,246,0.35)'; ctx.font='400 9px Space Mono,monospace';
    ctx.fillText('built by KING PETTY  ×  monshi.xyz', BW/2, cy+148);
  } else {
    var lv2=LEVELS[lvl];
    ctx.save(); ctx.shadowColor='#EF4444'; ctx.shadowBlur=24;
    ctx.fillStyle='#FCA5A5'; ctx.font='900 52px Orbitron,sans-serif';
    ctx.fillText('RUGGED', BW/2, cy+72); ctx.restore();
    ctx.fillStyle='rgba(167,139,250,0.55)'; ctx.font='700 9px Space Mono,monospace';
    ctx.fillText('MADE IT TO  LVL '+lv2.num+'  —  '+lv2.name, BW/2, cy+96);
    ctx.fillStyle='#EDE9FF'; ctx.font='700 20px Orbitron,sans-serif';
    ctx.fillText(String(Math.floor(score)).padStart(6,'0'), BW/2, cy+130);
    ctx.fillStyle='rgba(167,139,250,0.45)'; ctx.font='700 9px Space Mono,monospace';
    ctx.fillText('SCORE', BW/2, cy+144);
    ctx.fillStyle='#4ADE80'; ctx.font='700 15px Orbitron,sans-serif';
    ctx.fillText('BEST  '+String(Math.floor(best)).padStart(6,'0'), BW/2, cy+168);
  }
  var pulse=0.5+0.45*Math.sin(tick*0.07);
  ctx.fillStyle='rgba(196,181,253,'+pulse+')'; ctx.font='700 11px Space Mono,monospace';
  ctx.fillText(state==='start'?'[ TAP  OR  SPACE  TO  PLAY ]':'[ TAP  OR  SPACE  TO  RETRY ]', BW/2, cy+ch-20);
  ctx.textAlign='left';
}

// ── Collision ─────────────────────────────────────────────
function hit(a,b){return a.x<b.x+b.w && a.x+a.w>b.x && a.y<b.y+b.h && a.y+a.h>b.y;}

// ── Input ─────────────────────────────────────────────────
function action(){
  if(state==='start'){state='playing';}
  else if(state==='playing'){P.jump();}
  else{reset(); state='playing';}
}
document.addEventListener('keydown',function(e){if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();action();}});
canvas.addEventListener('click',action);
canvas.addEventListener('touchstart',function(e){e.preventDefault();action();},{passive:false});

// ── Level check ───────────────────────────────────────────
function checkLevel(){
  var lv=L();
  if(score>=lv.scoreEnd && lvl<LEVELS.length-1){
    lvl++;
    spd=LEVELS[lvl].baseSpd;
    obs=[];
    triggerTransition();
  }
}

// ── Reset ─────────────────────────────────────────────────
function reset(){
  P.y=GY; P.vy=0; P.jumps=0; P.air=false;
  P.rf=0; P.rt=0; P.jf=0; P.jt=0;
  obs=[]; parts=[]; obTimer=0;
  score=0; spd=3.5; tick=0; lvl=0;
  transState=0; transAlpha=0; transHold=0; transData=null;
}

// ── Loop ──────────────────────────────────────────────────
function loop(){
  requestAnimationFrame(loop);
  drawBG();

  if(state==='playing'){
    tick++;
    score+=spd*0.04;
    var lv=L();
    var lvBase=0;
    for(var li=0;li<lvl;li++) lvBase+=(LEVELS[li].scoreEnd===Infinity?0:LEVELS[li].scoreEnd);
    spd=lv.baseSpd+Math.max(0,score-lvBase)*0.006;
    var obInt=Math.max(lv.ivMin*0.45, lv.ivMin-(score-lvBase)*0.015);
    if(++obTimer>=obInt){spawn(); obTimer=0;}
    for(var oi=0;oi<obs.length;oi++) obs[oi].x-=spd;
    obs=obs.filter(function(o){return o.x>-120;});
    var hb=P.hb(), gy3=GY+SH;
    for(var ci=0;ci<obs.length;ci++){
      var o=obs[ci];
      if(hit(hb,{x:o.x+4,y:gy3-o.h,w:o.w-8,h:o.h})){
        state='dead'; if(score>best)best=score; break;
      }
    }
    P.update();
    checkLevel();
    for(var pi=0;pi<parts.length;pi++){
      var p=parts[pi]; p.x+=p.vx; p.y+=p.vy; p.vy+=0.14; p.life-=0.045;
    }
    parts=parts.filter(function(p){return p.life>0;});
    if(P.y>=GY-1 && tick%11===0) addPuff(P.x+rnd(20,SW-20), GY+SH+2);
  } else {
    tick++;
  }

  obs.forEach(function(o){drawCandle(o);});
  for(var pi2=0;pi2<parts.length;pi2++){
    var p2=parts[pi2];
    ctx.fillStyle='rgba(139,92,246,'+(p2.life*0.6)+')';
    ctx.beginPath(); ctx.arc(p2.x,p2.y,p2.r*p2.life,0,Math.PI*2); ctx.fill();
  }

  P.draw();
  drawHUD();
  if(transState>0) drawTransition();
  if(state!=='playing') drawOverlay();
}

reset();
loop();
</script>
