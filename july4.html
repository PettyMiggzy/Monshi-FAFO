<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
<link rel="shortcut icon" href="/favicon.ico?v=2">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0a0320">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MONSHI 4TH">
<meta property="og:title" content="Happy 4th of July from the Monshi Pack 🎆">
<meta property="og:description" content="Fireworks over Monad. Tap to launch. Then hit the arcade.">
<meta property="og:image" content="/public/monshi-run/keyart.jpg">
<title>MONSHI · HAPPY 4TH 🎆</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#04030f;font-family:'Space Mono',monospace;color:#fff;}
#sky{position:fixed;inset:0;display:block;touch-action:none;z-index:1;}
#wrap{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding:0 20px calc(env(safe-area-inset-bottom,0) + 26px);pointer-events:none;text-align:center;}
#hero{max-height:52vh;width:auto;object-fit:contain;filter:drop-shadow(0 10px 30px rgba(0,0,0,.6));margin-bottom:-6px;
  animation:bob 3s ease-in-out infinite;}
@keyframes bob{50%{transform:translateY(-10px)}}
.head{font-family:Orbitron;font-weight:900;font-size:clamp(30px,8vw,62px);line-height:.96;letter-spacing:1px;
  background:linear-gradient(90deg,#EF4444 0%,#ffffff 50%,#3B82F6 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 40px rgba(255,255,255,.25);}
.head .em{-webkit-text-fill-color:initial;color:#fff;}
.tag{color:#C4B5FD;font-size:clamp(11px,3vw,14px);letter-spacing:2px;margin-top:10px;text-shadow:0 2px 8px #000;}
.mono{color:#8B7BB5;font-size:11px;letter-spacing:1px;margin-top:2px;}
.btns{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap;justify-content:center;pointer-events:all;}
.btn{cursor:pointer;font-family:Orbitron;font-weight:700;font-size:15px;letter-spacing:1px;color:#fff;text-decoration:none;
  border-radius:13px;padding:13px 26px;transition:.12s;border:1px solid;}
.btn.purple{background:linear-gradient(180deg,#7C3AED,#6D28D9);border-color:#A855F7;box-shadow:0 0 24px rgba(124,58,237,.6);}
.btn.red{background:linear-gradient(180deg,#DC2626,#B91C1C);border-color:#F87171;box-shadow:0 0 24px rgba(220,38,38,.5);}
.btn.blue{background:linear-gradient(180deg,#2563EB,#1D4ED8);border-color:#60A5FA;box-shadow:0 0 24px rgba(37,99,235,.5);}
.btn:active{transform:scale(.95);}
.hintTop{position:fixed;top:calc(env(safe-area-inset-top,0) + 12px);left:50%;transform:translateX(-50%);z-index:3;
  color:rgba(196,181,253,.7);font-size:11px;letter-spacing:2px;pointer-events:none;animation:pulse 2.2s infinite;}
@keyframes pulse{50%{opacity:.35}}
a.hub{position:fixed;top:calc(env(safe-area-inset-top,0) + 10px);left:12px;z-index:4;color:#C4B5FD;text-decoration:none;font-size:13px;
  background:rgba(30,10,60,.5);border:1px solid rgba(168,85,247,.4);border-radius:20px;padding:6px 12px;pointer-events:all;}
</style></head>
<body>
<canvas id="sky"></canvas>
<a class="hub" href="/">← HUB</a>
<div class="hintTop">TAP THE SKY TO LAUNCH 🎆</div>
<div id="wrap">
  <img id="hero" src="/public/monshi-run/july-monshi.png" alt="Monshi 4th of July"
       onerror="this.src='/public/monshi-run/monshi-hero.jpg';this.style.maxHeight='42vh';"/>
  <div class="head">HAPPY <span class="em">4TH</span><br>FROM THE PACK</div>
  <div class="tag">FIREWORKS OVER MONAD · GM AMERICA 🇺🇸</div>
  <div class="mono">$MONSHI · powered by purple</div>
  <div class="btns">
    <a class="btn red" href="/monshi-run.html">🎮 PLAY MONSHI RUN</a>
    <a class="btn purple" href="/">🕹️ ARCADE</a>
    <a class="btn blue" href="/prize.html">🎁 PRIZES</a>
  </div>
</div>

<script>
(function(){
"use strict";
var cv=document.getElementById('sky'), ctx=cv.getContext('2d');
var W,H,DPR=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize); resize();

// palettes — red/white/blue + gold + a little Monad purple
var PALS=[
  ['#ff3b3b','#ff6b6b','#ffd0d0'], // red
  ['#3b82f6','#60a5fa','#bfdbfe'], // blue
  ['#ffffff','#e6e6ff','#cfe0ff'], // white/silver
  ['#ffd54a','#ffb300','#fff1b0'], // gold
  ['#a855f7','#c084fc','#e9d5ff']  // monad purple
];
function pick(a){return a[(Math.random()*a.length)|0];}

var rockets=[], sparks=[];
function launch(tx,ty){
  var sx=tx!=null?tx:(W*0.2+Math.random()*W*0.6);
  var startX=sx+(Math.random()-.5)*60;
  var targetY=ty!=null?ty:(H*0.15+Math.random()*H*0.35);
  var pal=PALS[(Math.random()*PALS.length)|0];
  rockets.push({x:startX,y:H+10,vx:(sx-startX)/40,vy:-(Math.sqrt((H-targetY))* (0.42+Math.random()*0.12)),
    ty:targetY,pal:pal,trail:[]});
}
function explode(x,y,pal){
  var type=Math.random();
  var n=60+((Math.random()*50)|0);
  var big=1+Math.random()*0.7;
  for(var i=0;i<n;i++){
    var ang=Math.PI*2*i/n + Math.random()*0.1;
    var spd;
    if(type<0.33){ spd=(2+Math.random()*3.2)*big; }          // classic burst
    else if(type<0.66){ spd=(2.6+Math.random()*0.5)*big; }   // ring
    else { spd=(0.6+Math.random()*3.6)*big; }                // willow/spread
    sparks.push({x:x,y:y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,
      life:1,decay:0.008+Math.random()*0.012,color:pick(pal),
      trail:type>0.66?1:0, size:1.2+Math.random()*1.3});
  }
  // bright flash core
  sparks.push({x:x,y:y,vx:0,vy:0,life:1,decay:0.06,color:'#ffffff',flash:1,size:8});
  // little crackle sparkles
  for(var c=0;c<14;c++){
    var a2=Math.random()*Math.PI*2,s2=Math.random()*1.2;
    sparks.push({x:x,y:y,vx:Math.cos(a2)*s2,vy:Math.sin(a2)*s2,life:1,decay:0.02,color:'#fff',size:0.9,crackle:1});
  }
}

var autoT=0;
function frame(){
  requestAnimationFrame(frame);
  // trail fade
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='rgba(4,3,15,0.20)';
  ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';

  // auto-launch
  autoT--; if(autoT<=0){launch(); if(Math.random()<0.4)launch(); autoT=26+Math.random()*40;}

  // rockets
  for(var i=rockets.length-1;i>=0;i--){var r=rockets[i];
    r.x+=r.vx; r.y+=r.vy; r.vy+=0.06; // gravity slows ascent
    ctx.fillStyle=r.pal[0];
    ctx.beginPath();ctx.arc(r.x,r.y,2,0,7);ctx.fill();
    // ember trail
    ctx.fillStyle='rgba(255,220,150,0.6)';
    ctx.beginPath();ctx.arc(r.x,r.y+3,1.4,0,7);ctx.fill();
    if(r.vy>=-0.6 || r.y<=r.ty){ explode(r.x,r.y,r.pal); rockets.splice(i,1); }
  }
  // sparks
  for(var j=sparks.length-1;j>=0;j--){var s=sparks[j];
    s.x+=s.vx; s.y+=s.vy;
    s.vx*=0.985; s.vy=s.vy*0.985 + (s.flash?0:0.028); // friction + gravity
    s.life-=s.decay;
    if(s.life<=0){sparks.splice(j,1);continue;}
    var a=Math.max(0,s.life);
    ctx.globalAlpha=s.flash?a*0.9:a;
    ctx.fillStyle=s.color;
    var sz=(s.flash?s.size*a:s.size)*(s.crackle?(Math.random()<.5?1.6:0.4):1);
    ctx.beginPath();ctx.arc(s.x,s.y,sz,0,7);ctx.fill();
    ctx.globalAlpha=1;
  }
}
frame();

// interaction: tap/click to launch a burst toward that point
function at(e){
  var t=e.touches?e.touches[0]:e; var x=t.clientX, y=t.clientY;
  // shoot a rocket that explodes near the tap
  rockets.push({x:x+(Math.random()-.5)*30,y:H+10,vx:0,vy:-Math.sqrt(H-y)*0.5,ty:y,pal:PALS[(Math.random()*PALS.length)|0],trail:[]});
}
cv.addEventListener('pointerdown',at);
// opening volley
for(var k=0;k<5;k++)setTimeout(launch,300+k*260);
})();
</script>
</body></html>
