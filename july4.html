<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
<link rel="shortcut icon" href="/favicon.ico?v=2">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#05010f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MONSHI 4TH">
<meta property="og:title" content="Happy 4th of July — Monshi 🎆">
<meta property="og:description" content="Fireworks over Monad. Tap the sky. Hold for the finale.">
<meta property="og:image" content="/public/monshi-run/keyart.jpg">
<title>MONSHI · 4TH OF JULY 🎆</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
html,body{width:100%;height:100%;overflow:hidden;background:#05010f;font-family:'Space Mono',monospace;color:#fff;}
#sky{position:fixed;inset:0;display:block;touch-action:none;z-index:1;}
/* character — from behind, looking up; darkened + rim-lit so it reads as a silhouette watching */
#hero{position:fixed;bottom:0;left:50%;transform:translateX(-50%);height:clamp(150px,30vh,320px);z-index:2;pointer-events:none;
  filter:brightness(.62) contrast(1.05) drop-shadow(0 0 18px rgba(168,85,247,.55)) drop-shadow(0 -3px 10px rgba(120,170,255,.35));
  animation:sway 6s ease-in-out infinite;}
@keyframes sway{50%{transform:translateX(-50%) translateY(-6px)}}
/* overlay UI */
#title{position:fixed;top:calc(env(safe-area-inset-top,0) + 26px);left:0;right:0;z-index:3;text-align:center;pointer-events:none;
  opacity:0;animation:fadein 1.4s .3s forwards;}
#title .h{font-family:Orbitron;font-weight:900;font-size:clamp(30px,8vw,66px);letter-spacing:2px;line-height:1;
  background:linear-gradient(90deg,#ff6b6b 0%,#ffffff 50%,#6aa8ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 18px rgba(255,255,255,.25));}
#title .s{margin-top:8px;font-size:clamp(10px,2.6vw,13px);letter-spacing:5px;color:#cbd5ff;text-shadow:0 2px 10px #000;}
@keyframes fadein{to{opacity:1}}
#cta{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0) + 22px);z-index:4;display:flex;gap:11px;justify-content:center;flex-wrap:wrap;
  opacity:0;animation:fadein 1.2s 1s forwards;}
.btn{pointer-events:all;cursor:pointer;font-family:Orbitron;font-weight:700;font-size:14px;letter-spacing:1px;color:#fff;text-decoration:none;
  border-radius:13px;padding:12px 22px;transition:transform .12s;border:1px solid;backdrop-filter:blur(4px);}
.btn.red{background:linear-gradient(180deg,rgba(220,38,38,.9),rgba(153,27,27,.9));border-color:#f87171;box-shadow:0 0 22px rgba(220,38,38,.45);}
.btn.blue{background:linear-gradient(180deg,rgba(37,99,235,.9),rgba(29,78,216,.9));border-color:#60a5fa;box-shadow:0 0 22px rgba(37,99,235,.45);}
.btn.purple{background:linear-gradient(180deg,rgba(124,58,237,.9),rgba(109,40,217,.9));border-color:#a855f7;box-shadow:0 0 22px rgba(124,58,237,.45);}
.btn:active{transform:scale(.94);}
a.hub{position:fixed;top:calc(env(safe-area-inset-top,0) + 12px);left:14px;z-index:5;color:#c4b5fd;text-decoration:none;font-size:13px;
  background:rgba(20,10,44,.5);border:1px solid rgba(168,85,247,.35);border-radius:20px;padding:6px 12px;pointer-events:all;}
#tapHint{position:fixed;top:50%;left:0;right:0;text-align:center;z-index:3;color:rgba(255,255,255,.5);font-size:12px;letter-spacing:3px;
  pointer-events:none;animation:pulse 2.4s infinite;}
@keyframes pulse{50%{opacity:.3}}
</style></head>
<body>
<canvas id="sky"></canvas>
<img id="hero" src="/public/monshi-run/july-monshi.png" alt="Monshi watching fireworks"
     onerror="this.style.display='none'"/>
<a class="hub" href="/">← HUB</a>
<div id="title"><div class="h">HAPPY 4TH</div><div class="s">FIREWORKS OVER MONAD</div></div>
<div id="tapHint">TAP THE SKY · HOLD FOR THE FINALE</div>
<div id="cta">
  <a class="btn red" href="/monshi-run.html">🎮 MONSHI RUN</a>
  <a class="btn purple" href="/">🕹️ ARCADE</a>
  <a class="btn blue" href="/prize.html">🎁 PRIZES</a>
</div>

<script>
(function(){
"use strict";
var view=document.getElementById('sky'), vctx=view.getContext('2d');
var fx=document.createElement('canvas'), fctx=fx.getContext('2d');
var W,H,DPR=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;
  view.width=W*DPR;view.height=H*DPR;view.style.width=W+'px';view.style.height=H+'px';vctx.setTransform(DPR,0,0,DPR,0,0);
  fx.width=W*DPR;fx.height=H*DPR;fctx.setTransform(DPR,0,0,DPR,0,0);
  buildCity(); buildStars();
}
addEventListener('resize',resize);

// ── rich palettes (white-hot core -> saturated color) ──
var PALS=[
  {name:'red',   core:'#fff2f2', mid:'#ff5a5a', edge:'#ff2d2d'},
  {name:'blue',  core:'#eef4ff', mid:'#5aa2ff', edge:'#2f6bff'},
  {name:'white', core:'#ffffff', mid:'#e7ecff', edge:'#bcd0ff'},
  {name:'gold',  core:'#fff6d5', mid:'#ffcf4a', edge:'#ff9e12'},
  {name:'purple',core:'#f3e8ff', mid:'#c084fc', edge:'#9333ea'},
  {name:'green', core:'#eafff2', mid:'#5ef2a0', edge:'#17c964'},
  {name:'pink',  core:'#ffe9f6', mid:'#ff7ad1', edge:'#ec4899'}
];
// precomputed glow sprites (radial) per palette edge color for cheap bloom
var glow={};
function makeGlow(hex){var s=48,c=document.createElement('canvas');c.width=c.height=s;var g=c.getContext('2d');
  var rad=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  rad.addColorStop(0,hex);rad.addColorStop(.35,hex+'cc');rad.addColorStop(.7,hex+'33');rad.addColorStop(1,hex+'00');
  g.fillStyle=rad;g.fillRect(0,0,s,s);return c;}
PALS.forEach(function(p){glow[p.edge]=makeGlow(p.edge);glow[p.mid]=makeGlow(p.mid);});
glow['#ffffff']=makeGlow('#ffffff');

// ── static background layers ──
var stars=[], city=[];
function buildStars(){stars=[];var n=(W*H)/9000;for(var i=0;i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*H*0.8,r:Math.random()*1.3+0.2,tw:Math.random()*6.28});}
function buildCity(){
  city=[]; var gy=H*0.82; var x=-10;
  while(x<W+10){var w=18+Math.random()*46, h=30+Math.random()*Math.min(H*0.34,200);
    city.push({x:x,w:w,h:h, lit:Math.random()<0.5, hue:Math.random()<0.22?'#7c3aed':'#0a0820'}); x+=w+2+Math.random()*8;}
}
function drawBackground(t){
  // sky gradient
  var g=vctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#05010f'); g.addColorStop(0.45,'#0b0524'); g.addColorStop(0.78,'#1a0b3a'); g.addColorStop(1,'#241046');
  vctx.fillStyle=g; vctx.fillRect(0,0,W,H);
  // moon
  var mx=W*0.82,my=H*0.2;
  var mg=vctx.createRadialGradient(mx,my,0,mx,my,60); mg.addColorStop(0,'rgba(255,255,240,0.9)');mg.addColorStop(.25,'rgba(255,255,235,0.5)');mg.addColorStop(1,'rgba(255,255,235,0)');
  vctx.fillStyle=mg; vctx.beginPath();vctx.arc(mx,my,60,0,7);vctx.fill();
  vctx.fillStyle='#fffef0';vctx.beginPath();vctx.arc(mx,my,16,0,7);vctx.fill();
  // stars (twinkle)
  for(var i=0;i<stars.length;i++){var s=stars[i];var a=0.35+0.5*Math.abs(Math.sin(t*1.4+s.tw));
    vctx.globalAlpha=a;vctx.fillStyle='#dfe6ff';vctx.beginPath();vctx.arc(s.x,s.y,s.r,0,7);vctx.fill();}
  vctx.globalAlpha=1;
  // skyline haze
  var gy=H*0.82;
  var hz=vctx.createLinearGradient(0,gy-120,0,gy); hz.addColorStop(0,'rgba(80,40,140,0)');hz.addColorStop(1,'rgba(90,50,150,0.35)');
  vctx.fillStyle=hz; vctx.fillRect(0,gy-120,W,120);
  // buildings
  for(var b=0;b<city.length;b++){var c=city[b];
    vctx.fillStyle=c.hue; vctx.fillRect(c.x,gy-c.h,c.w,c.h+ (H-gy));
    if(c.hue!=='#0a0820'){vctx.globalAlpha=.5;vctx.fillStyle='#a855f7';vctx.fillRect(c.x,gy-c.h,c.w,2);vctx.globalAlpha=1;}
    // window lights
    if(c.lit){vctx.fillStyle='rgba(255,220,150,0.55)';
      for(var wy=gy-c.h+6;wy<gy-4;wy+=9){for(var wx=c.x+4;wx<c.x+c.w-4;wx+=8){ if(Math.random()<0.5)vctx.fillRect(wx,wy,3,4);}}}
  }
  // ground/water base
  vctx.fillStyle='#0a0618'; vctx.fillRect(0,gy,W,H-gy);
}

// ── fireworks ──
var rockets=[], sparks=[], smokes=[], MAXSP=1400;
function spawnRocket(tx,ty){
  var sx=(tx!=null?tx:(W*0.14+Math.random()*W*0.72));
  var ty2=(ty!=null?ty:(H*0.14+Math.random()*H*0.32));
  var pal=PALS[(Math.random()*PALS.length)|0];
  rockets.push({x:sx,y:H*0.82,vx:(Math.random()-.5)*0.6,vy:-(6.4+Math.random()*2.6),ty:ty2,pal:pal,trail:[]});
}
function addSpark(x,y,vx,vy,pal,opt){opt=opt||{};
  if(sparks.length>MAXSP)return;
  sparks.push({x:x,y:y,vx:vx,vy:vy,pal:pal,life:1,
    decay:opt.decay||(0.006+Math.random()*0.01),grav:opt.grav==null?0.03:opt.grav,drag:opt.drag||0.985,
    size:opt.size||(1.6+Math.random()*1.2),tw:opt.tw||0, twp:Math.random()*6.28, willow:opt.willow||0});
}
function burst(x,y,pal){
  var type=Math.random(); var n=70+((Math.random()*60)|0);
  smokes.push({x:x,y:y,r:6,life:1});
  // white flash core
  addSpark(x,y,0,0,{core:'#fff',mid:'#fff',edge:'#ffffff'},{decay:0.06,grav:0,size:14,drag:0.9});
  if(type<0.30){ // peony
    for(var i=0;i<n;i++){var a=Math.PI*2*i/n+Math.random()*0.08,s=2.2+Math.random()*3.2;
      addSpark(x,y,Math.cos(a)*s,Math.sin(a)*s,pal,{tw:Math.random()<0.4?1:0});}
  } else if(type<0.55){ // ring
    for(var i2=0;i2<n;i2++){var a2=Math.PI*2*i2/n,s2=3.1+Math.random()*0.5;
      addSpark(x,y,Math.cos(a2)*s2,Math.sin(a2)*s2,pal,{decay:0.01});}
  } else if(type<0.78){ // willow / chrysanthemum (droop + trails)
    var wp=PALS[3]; // gold-ish for willow feel sometimes
    var pp=Math.random()<0.5?wp:pal;
    for(var i3=0;i3<n;i3++){var a3=Math.PI*2*i3/n+Math.random()*0.1,s3=1.4+Math.random()*2.6;
      addSpark(x,y,Math.cos(a3)*s3,Math.sin(a3)*s3,pp,{grav:0.06,decay:0.005,willow:1,size:1.8+Math.random()});}
  } else { // double burst — big + delayed secondaries
    for(var i4=0;i4<n;i4++){var a4=Math.PI*2*i4/n,s4=2.6+Math.random()*2.4;
      addSpark(x,y,Math.cos(a4)*s4,Math.sin(a4)*s4,pal,{});}
    for(var k=0;k<4;k++){(function(kk){setTimeout(function(){var ox=x+(Math.random()-.5)*90,oy=y+(Math.random()-.5)*70;
      var p2=PALS[(Math.random()*PALS.length)|0]; smokes.push({x:ox,y:oy,r:4,life:1});
      for(var m=0;m<26;m++){var am=Math.random()*6.28,sm=1.4+Math.random()*2.2;addSpark(ox,oy,Math.cos(am)*sm,Math.sin(am)*sm,p2,{});}},120+kk*90);})(k);}
  }
  // crackle glitter overlay
  for(var c2=0;c2<20;c2++){var ac=Math.random()*6.28,sc=Math.random()*1.5;
    addSpark(x,y,Math.cos(ac)*sc,Math.sin(ac)*sc,{core:'#fff',mid:'#fff5cc',edge:'#ffd54a'},{decay:0.03,size:0.9,tw:1});}
}

function drawGlow(sp,cx,cy){
  var img=glow[sp.pal.edge]||glow['#ffffff'];
  var sz=sp.size*3.2*sp.life;
  var a=sp.life*(sp.tw?(0.4+0.6*Math.abs(Math.sin(fctx.__t*20+sp.twp))):1);
  fctx.globalAlpha=Math.max(0,a);
  fctx.drawImage(img,cx-sz,cy-sz,sz*2,sz*2);
}

var lastT=performance.now(), holdN=0;
function frame(now){
  requestAnimationFrame(frame);
  var dt=Math.min((now-lastT)/1000,0.05); lastT=now; var t=now/1000;
  // 1) static background on the visible canvas
  drawBackground(t);

  // 2) fireworks FX layer (trail fade, additive)
  fctx.__t=t;
  fctx.globalCompositeOperation='source-over';
  fctx.fillStyle='rgba(0,0,0,0.16)'; fctx.fillRect(0,0,W,H);
  fctx.globalCompositeOperation='lighter';

  // auto show
  if(Math.random()< (0.03+holdN*0.15)) spawnRocket();
  if(holdN>0)holdN=Math.max(0,holdN-dt*1.5);

  // rockets
  for(var i=rockets.length-1;i>=0;i--){var r=rockets[i];
    r.x+=r.vx; r.y+=r.vy; r.vy+=0.05;
    // comet trail
    r.trail.push({x:r.x,y:r.y}); if(r.trail.length>7)r.trail.shift();
    for(var k=0;k<r.trail.length;k++){var tp=r.trail[k],a=k/r.trail.length;
      fctx.globalAlpha=a*0.7; var img=glow[r.pal.mid]; var s=3*a+1; fctx.drawImage(img,tp.x-s,tp.y-s,s*2,s*2);}
    fctx.globalAlpha=1; fctx.fillStyle=r.pal.core; fctx.beginPath();fctx.arc(r.x,r.y,2,0,7);fctx.fill();
    if(r.vy>=-1.2 || r.y<=r.ty){ burst(r.x,r.y,r.pal); rockets.splice(i,1); }
  }
  // sparks
  for(var j=sparks.length-1;j>=0;j--){var sp=sparks[j];
    sp.vx*=sp.drag; sp.vy=sp.vy*sp.drag+sp.grav; sp.x+=sp.vx; sp.y+=sp.vy; sp.life-=sp.decay;
    if(sp.life<=0){sparks.splice(j,1);continue;}
    drawGlow(sp,sp.x,sp.y);
    // bright core dot
    fctx.globalAlpha=Math.min(1,sp.life*1.4); fctx.fillStyle=sp.pal.core;
    fctx.beginPath();fctx.arc(sp.x,sp.y,Math.max(0.5,sp.size*sp.life*0.5),0,7);fctx.fill();
  }
  fctx.globalAlpha=1;

  // 3) composite FX onto view (sky) with bloom
  vctx.globalCompositeOperation='lighter';
  vctx.drawImage(fx,0,0,W,H);
  // 4) water reflection (flip FX into the water band, dim + soft)
  var gy=H*0.82;
  vctx.save(); vctx.globalAlpha=0.20; vctx.filter='blur(1.5px)';
  vctx.translate(0,gy*2); vctx.scale(1,-1); vctx.drawImage(fx,0,0,W,H); vctx.restore();
  vctx.filter='none'; vctx.globalCompositeOperation='source-over';
  // smoke puffs (subtle)
  for(var m=smokes.length-1;m>=0;m--){var sm=smokes[m]; sm.r+=18*dt; sm.life-=0.4*dt; if(sm.life<=0){smokes.splice(m,1);continue;}
    vctx.globalAlpha=sm.life*0.06; vctx.fillStyle='#b9a9d9'; vctx.beginPath();vctx.arc(sm.x,sm.y,sm.r,0,7);vctx.fill();}
  vctx.globalAlpha=1;
  // 5) vignette
  var vg=vctx.createRadialGradient(W/2,H*0.45,H*0.3,W/2,H*0.5,H*0.8);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.55)');
  vctx.fillStyle=vg; vctx.fillRect(0,0,W,H);
}
resize(); requestAnimationFrame(frame);
// opening volley
for(var o=0;o<6;o++)setTimeout(spawnRocket,300+o*240);

// interaction
function launchAt(e){var p=e.touches?e.touches[0]:e; spawnRocket(p.clientX, p.clientY); document.getElementById('tapHint').style.display='none';}
view.addEventListener('pointerdown',function(e){launchAt(e);});
// hold to intensify -> finale
var holdTimer=null;
view.addEventListener('pointerdown',function(){holdTimer=setInterval(function(){holdN=Math.min(3,holdN+0.5);},180);});
addEventListener('pointerup',function(){if(holdTimer){clearInterval(holdTimer);holdTimer=null;}});
})();
</script>
</body></html>
