</div></div><script>var SUPABASE_URL='https://cuqhqcmrgpdjlhyqztnc.supabase.co';
var SUPABASE_KEY='sb_publishable_nu-E2mvgdQ0l1DsSsOswWA_ma2RbV4z';
var BUY_URL='https://nad.fun/tokens/0xB744F5CDb792d8187640214C4A1c9aCE29af7777';
var playerName=localStorage.getItem('monshi_name')||'';
var leaderboard=[],playerRank=0;
function sbH(){return{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=representation'};}
function fetchLB(t){fetch(SUPABASE_URL+'/rest/v1/'+t+'?select=name,score&order=score.desc&limit=10',{headers:sbH()}).then(function(r){return r.json();}).then(function(d){if(Array.isArray(d))leaderboard=d;}).catch(function(){});}
function submitScore(t,sc,cb){if(!playerName)return cb&&cb();fetch(SUPABASE_URL+'/rest/v1/'+t,{method:'POST',headers:sbH(),body:JSON.stringify({name:playerName,score:Math.floor(sc)})}).then(function(){return fetch(SUPABASE_URL+'/rest/v1/'+t+'?select=name,score&order=score.desc&limit=10',{headers:sbH()});}).then(function(r){return r.json();}).then(function(d){if(Array.isArray(d)){leaderboard=d;playerRank=leaderboard.findIndex(function(s){return s.name===playerName&&s.score===Math.floor(sc);})+1;}if(cb)cb();}).catch(function(){if(cb)cb();});}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function showDeath(GAME,TABLE,URL,sc,subtitle,isWin){
  function render(){
    document.getElementById('ruggedTitle').textContent=isWin?'YOU WIN':'GAME OVER';
    document.getElementById('ruggedTitle').className='rugged'+(isWin?' win':'');
    document.getElementById('dScore').textContent=Math.floor(sc);
    document.getElementById('lvlTag').textContent=subtitle||'';
    document.getElementById('rankTag').textContent=playerRank>0?'#'+playerRank+' GLOBALLY':'';
    var tb=document.getElementById('lbBody');tb.innerHTML='';
    leaderboard.slice(0,5).forEach(function(s,i){var tr=document.createElement('tr');var isMe=s.name===playerName&&s.score===Math.floor(sc);if(isMe)tr.className='me';var medal=['🥇','🥈','🥉'][i]||'#'+(i+1);tr.innerHTML='<td>'+medal+'</td><td>'+esc(s.name)+'</td><td class="sc">'+s.score+'</td>';tb.appendChild(tr);});
    document.getElementById('deathPanel').classList.add('show');
  }
  if(playerName){submitScore(TABLE,sc,render);}else{document.getElementById('nameSubmit').style.display='block';render();}
  document.getElementById('dSubmit').onclick=function(){var n=document.getElementById('dNameInput').value.trim();playerName=(n||'ANON').toUpperCase().slice(0,16);localStorage.setItem('monshi_name',playerName);document.getElementById('nameSubmit').style.display='none';submitScore(TABLE,sc,render);};
  document.getElementById('dNameInput').onkeydown=function(e){if(e.key==='Enter')document.getElementById('dSubmit').click();};
  document.getElementById('btnShare').onclick=function(){var tw='I scored '+Math.floor(sc)+' on '+GAME+' on Monshi Arcade '+URL+' $MONSHI #Monad';window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(tw),'_blank');};
  document.getElementById('btnBuy').onclick=function(){window.open(BUY_URL,'_blank');};
}
var AC=window.AudioContext||window.webkitAudioContext,actx=null,master=null;
function initAudio(){if(actx)return;try{actx=new AC();master=actx.createGain();master.gain.value=0.25;master.connect(actx.destination);}catch(e){}}
function tone(f,t,v,o,d){if(!actx)return;var st=actx.currentTime+(o||0);var os=actx.createOscillator();var g=actx.createGain();os.type=t||'square';os.frequency.setValueAtTime(f,st);g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(v,st+0.01);g.gain.exponentialRampToValueAtTime(0.001,st+d);os.connect(g);g.connect(master);os.start(st);os.stop(st+d+0.05);}
function sfxWin(){[523,659,784,1046].forEach(function(f,i){tone(f,'square',0.18,i*0.06,0.12);});}
function sfxLose(){[440,330,220].forEach(function(f,i){tone(f,'sawtooth',0.25,i*0.12,0.18);});}
function sfxClick(){tone(800,'square',0.08,0,0.04);}
function sfxCoin(){tone(880,'square',0.12,0,0.05);tone(1320,'square',0.1,0.05,0.06);}

var GZ=4,grid=[],bd=document.getElementById('g2bd');
var sc=0,bs=parseInt(localStorage.getItem('m2048_best')||'0');
document.getElementById('g2bs').textContent=bs;
var COL={2:'#A855F7',4:'#9333EA',8:'#7C3AED',16:'#6D28D9',32:'#22C55E',64:'#16A34A',128:'#FCD34D',256:'#F97316',512:'#EF4444',1024:'#EC4899',2048:'#8B5CF6',4096:'#fff'};
function init(){grid=[];for(var i=0;i<GZ;i++){var r=[];for(var j=0;j<GZ;j++)r.push(0);grid.push(r);}addTile();addTile();render();}
function addTile(){var empty=[];for(var i=0;i<GZ;i++)for(var j=0;j<GZ;j++)if(!grid[i][j])empty.push([i,j]);if(!empty.length)return;var p=empty[Math.floor(Math.random()*empty.length)];grid[p[0]][p[1]]=Math.random()<0.9?2:4;}
function render(){bd.innerHTML='';for(var i=0;i<GZ;i++)for(var j=0;j<GZ;j++){var v=grid[i][j];var c=document.createElement('div');var col=COL[v]||'#fff';c.style.cssText='background:'+(v?col:'rgba(0,0,0,.3)')+';border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:Orbitron,sans-serif;font-weight:900;color:'+(v>=128?'#000':'#fff')+';font-size:'+(v>=1024?16:v>=128?20:24)+'px;box-shadow:'+(v?'0 0 12px '+col+'66':'none')+';transition:all .15s;';c.textContent=v||'';bd.appendChild(c);}document.getElementById('g2sc').textContent=sc;}
function move(dir){initAudio();var moved=false;var lines=[];for(var i=0;i<GZ;i++){var line=[];for(var j=0;j<GZ;j++){if(dir==='L')line.push(grid[i][j]);else if(dir==='R')line.unshift(grid[i][j]);else if(dir==='U')line.push(grid[j][i]);else line.unshift(grid[j][i]);}lines.push(line);}for(var i=0;i<GZ;i++){var l=lines[i].filter(function(v){return v;});for(var k=0;k<l.length-1;k++){if(l[k]===l[k+1]){l[k]*=2;sc+=l[k];l.splice(k+1,1);sfxCoin();}}while(l.length<GZ)l.push(0);lines[i]=l;}var newGrid=[];for(var i=0;i<GZ;i++){var r=[];for(var j=0;j<GZ;j++)r.push(0);newGrid.push(r);}for(var i=0;i<GZ;i++){for(var j=0;j<GZ;j++){var v;if(dir==='L')v=lines[i][j];else if(dir==='R')v=lines[i][GZ-1-j];else if(dir==='U')v=lines[j][i];else v=lines[j][GZ-1-i];if(grid[i][j]!==v)moved=true;newGrid[i][j]=v;}}grid=newGrid;if(moved){addTile();if(sc>bs){bs=sc;localStorage.setItem('m2048_best',bs);document.getElementById('g2bs').textContent=bs;}render();if(checkLose()){fetchLB('scores_2048');setTimeout(function(){showDeath('MONSHI 2048','scores_2048','https://monshi-fafo.vercel.app/m2048.html',sc,'',sc>=2048);},500);}}}
function checkLose(){for(var i=0;i<GZ;i++)for(var j=0;j<GZ;j++){if(!grid[i][j])return false;if(j<GZ-1&&grid[i][j]===grid[i][j+1])return false;if(i<GZ-1&&grid[i][j]===grid[i+1][j])return false;}return true;}
addEventListener('keydown',function(e){var k=e.key.toLowerCase();if(['arrowleft','a'].indexOf(k)>=0){move('L');e.preventDefault();}else if(['arrowright','d'].indexOf(k)>=0){move('R');e.preventDefault();}else if(['arrowup','w'].indexOf(k)>=0){move('U');e.preventDefault();}else if(['arrowdown','s'].indexOf(k)>=0){move('D');e.preventDefault();}});
var ts={x:0,y:0};addEventListener('touchstart',function(e){var t=e.touches[0];ts.x=t.clientX;ts.y=t.clientY;});addEventListener('touchend',function(e){var t=e.changedTouches[0];var dx=t.clientX-ts.x,dy=t.clientY-ts.y;if(Math.abs(dx)<30&&Math.abs(dy)<30)return;if(Math.abs(dx)>Math.abs(dy))move(dx>0?'R':'L');else move(dy>0?'D':'U');});
init();fetchLB('scores_2048');
