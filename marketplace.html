<script>
(function(){
"use strict";
if(!window.THREE){document.getElementById('loading').textContent='3D failed to load';return;}
var RC={Common:'#9ca3af',Uncommon:'#5aa2ff',Rare:'#ffcf4a',Epic:'#c084fc',Legendary:'#ec4899'};
var RANK={Common:0,Uncommon:1,Rare:2,Epic:3,Legendary:4};
var BRAND={purple:0x6b27de,indigo:0x7d69ed,teal:0x00a29e};
var $=function(i){return document.getElementById(i);};
var TREASURY='0xece5d15e567c801c835029a49b2e4067b0eb63aa';
var CONTRACT='0xdA42B6184d848a05be311fd696dECF412e13D0AE';
var SEL_BUY='0xd96a094a',SEL_SPIN='0xf0acd7d5';
var canvas=$('c');
var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));
var scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x0a0430,0.018);
var camera=new THREE.PerspectiveCamera(60,1,0.1,300);
scene.add(new THREE.AmbientLight(0x5a4b9e,1.0));
var key=new THREE.DirectionalLight(0x9d8cff,0.55);key.position.set(0,14,6);scene.add(key);
var teal=new THREE.PointLight(BRAND.teal,0.8,60);teal.position.set(0,10,-20);scene.add(teal);
function resize(){var w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

// ── skydome gradient (brand) ──
function skyTex(){var cv=document.createElement('canvas');cv.width=16;cv.height=256;var g=cv.getContext('2d');
  var grd=g.createLinearGradient(0,0,0,256);
  grd.addColorStop(0,'#05010f');grd.addColorStop(0.4,'#150a3a');grd.addColorStop(0.72,'#2a1466');grd.addColorStop(0.9,'#3a1f7a');grd.addColorStop(1,'#1e0f45');
  g.fillStyle=grd;g.fillRect(0,0,16,256);return new THREE.CanvasTexture(cv);}
var sky=new THREE.Mesh(new THREE.SphereGeometry(160,32,16),new THREE.MeshBasicMaterial({map:skyTex(),side:THREE.BackSide,fog:false}));
scene.add(sky);
// big soft glowing orb (Monad-ish moon)
function orbTex(c1,c2){var s=256,cv=document.createElement('canvas');cv.width=cv.height=s;var g=cv.getContext('2d');var r=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);r.addColorStop(0,c1);r.addColorStop(.5,c2);r.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=r;g.fillRect(0,0,s,s);return new THREE.CanvasTexture(cv);}
var orb=new THREE.Sprite(new THREE.SpriteMaterial({map:orbTex('#c9b8ff','#6b27de'),transparent:true,depthWrite:false,fog:false}));
orb.scale.set(60,60,1);orb.position.set(-40,34,-90);scene.add(orb);
var orb2=new THREE.Sprite(new THREE.SpriteMaterial({map:orbTex('#9ff5ee','#00a29e'),transparent:true,depthWrite:false,fog:false}));
orb2.scale.set(30,30,1);orb2.position.set(52,22,-80);scene.add(orb2);
// stars
var sg=new THREE.BufferGeometry(),sv=[];for(var i=0;i<500;i++){var R=90+Math.random()*60,a=Math.random()*6.28,b=Math.random()*1.2;sv.push(Math.sin(a)*Math.cos(b)*R,Math.abs(Math.sin(b))*R*0.6+2,Math.cos(a)*Math.cos(b)*R);}
sg.setAttribute('position',new THREE.Float32BufferAttribute(sv,3));scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xcfc4ff,size:.5,transparent:true,opacity:.75,fog:false})));
// photoreal night-city skyline backdrop (mirrored pano wrapped on a cylinder)
(function(){var tl=new THREE.TextureLoader();
tl.load('/public/fireworks-nft/city-pano.jpg',function(tx){
  tx.wrapS=THREE.MirroredRepeatWrapping;tx.repeat.set(3,1);tx.anisotropy=8;
  var cyl=new THREE.Mesh(new THREE.CylinderGeometry(72,72,34,64,1,true),
    new THREE.MeshBasicMaterial({map:tx,side:THREE.BackSide,fog:false}));
  cyl.position.y=14.5;scene.add(cyl);
  // soft haze blend where backdrop meets the floor
  var haze=new THREE.Mesh(new THREE.CylinderGeometry(71,71,9,64,1,true),
    new THREE.MeshBasicMaterial({color:0x0d0728,transparent:true,opacity:.85,side:THREE.BackSide,fog:false}));
  haze.position.y=1.5;scene.add(haze);
});})();
// reflective floor
var floorMat=new THREE.MeshStandardMaterial({color:0x0a0628,metalness:.85,roughness:.28});
var floor=new THREE.Mesh(new THREE.PlaneGeometry(300,300),floorMat);floor.rotation.x=-Math.PI/2;floor.position.y=0;scene.add(floor);
var grid=new THREE.GridHelper(300,90,BRAND.indigo,0x180f3a);grid.position.y=0.02;grid.material.transparent=true;grid.material.opacity=.5;scene.add(grid);
// glowing floor pool under the gallery
var pool=new THREE.Mesh(new THREE.CircleGeometry(24,48),new THREE.MeshBasicMaterial({map:orbTex('#3a1f7a','rgba(30,15,80,0)'),transparent:true,depthWrite:false}));
pool.rotation.x=-Math.PI/2;pool.position.y=0.03;scene.add(pool);

// ── gallery ──
function glowSprite(){var s=48,cv=document.createElement('canvas');cv.width=cv.height=s;var g=cv.getContext('2d');var r=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);r.addColorStop(0,'#ffffff');r.addColorStop(.4,'#ffffffaa');r.addColorStop(1,'#ffffff00');g.fillStyle=r;g.fillRect(0,0,s,s);return new THREE.CanvasTexture(cv);}
var GTEX=glowSprite();
function textTex(txt,col){var cv=document.createElement('canvas');cv.width=256;cv.height=48;var g=cv.getContext('2d');g.fillStyle='rgba(10,6,30,.85)';g.fillRect(0,0,256,48);g.strokeStyle=col;g.lineWidth=2.5;g.strokeRect(2,2,252,44);g.fillStyle=col;g.font='bold 20px Orbitron,sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(txt.slice(0,22),128,26);return new THREE.CanvasTexture(cv);}
var texLoader=new THREE.TextureLoader();
var panels=[], sparks=[], ITEMS=[];

// ── JULY 4TH DRESSING ─────────────────────────────────────────────
// Monshi & Toshi on a gold-ringed launch pad, firing real fireworks
var padX=-16, padZ=-13;
var pad=new THREE.Mesh(new THREE.CylinderGeometry(4.6,5.2,0.7,32),new THREE.MeshStandardMaterial({color:0x1c1044,metalness:.6,roughness:.4}));
pad.position.set(padX,0.35,padZ);scene.add(pad);
var padRing=new THREE.Mesh(new THREE.TorusGeometry(4.6,0.09,10,48),new THREE.MeshBasicMaterial({color:0xffd54a}));
padRing.rotation.x=Math.PI/2;padRing.position.set(padX,0.72,padZ);scene.add(padRing);
var padGlow=new THREE.PointLight(0xffd54a,1.1,14);padGlow.position.set(padX,2,padZ);scene.add(padGlow);
function standee(src,x,scale,aspect){var sp=new THREE.Sprite(new THREE.SpriteMaterial({map:texLoader.load(src),transparent:true}));
  sp.scale.set(scale*(aspect||0.78),scale,1);sp.position.set(padX+x,0.7+scale/2,padZ);scene.add(sp);return sp;}
var monshiS=standee('/public/fireworks-nft/monshi-celebrate.png',-1.9,4.0,0.67);
var toshiS=standee('/public/fireworks-nft/toshi-celebrate.png',1.9,3.8,0.71);
for(var mt=0;mt<3;mt++){var tube=new THREE.Mesh(new THREE.CylinderGeometry(0.18,0.24,1.2,10),
  new THREE.MeshStandardMaterial({color:[0x8a1f1f,0xdddddd,0x1f3a8a][mt]}));
  tube.position.set(padX-0.5+mt*0.5,1.25,padZ+1.7);tube.rotation.z=(mt-1)*0.12;scene.add(tube);}
// festoon lights (red-white-blue) hung around the gallery
for(var fl=0;fl<42;fl++){var fa=fl/42*Math.PI*2,fc=[0xff4d4d,0xffffff,0x4d7dff][fl%3];
  var bulb=new THREE.Sprite(new THREE.SpriteMaterial({map:GTEX,color:fc,transparent:true,opacity:.85,blending:THREE.AdditiveBlending,depthWrite:false}));
  bulb.scale.set(.55,.55,1);bulb.position.set(Math.sin(fa)*16.6,10.8+Math.sin(fa*5)*0.35,Math.cos(fa)*16.6);scene.add(bulb);}
// event banner above the wheel
var banner=new THREE.Mesh(new THREE.PlaneGeometry(9.5,1.15),
  new THREE.MeshBasicMaterial({map:textTex('★ 4TH OF JULY DROP ★','#ffffff'),transparent:true,side:THREE.DoubleSide}));
banner.position.set(0,10.6,0);scene.add(banner);
// live 3D fireworks show
var FWCOLS=[0xff4d4d,0xffffff,0x4d7dff,0xffd54a,0xc084fc,0x00d2c7];
var fwSparks=[],rocketsUp=[];
function skyBurst(x,y,z,col,big){var n=big?46:30;
  for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,b2=Math.random()*Math.PI,sp=(big?0.1:0.065)*(0.5+Math.random());
    var m=new THREE.Sprite(new THREE.SpriteMaterial({map:GTEX,color:col,transparent:true,opacity:1,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
    m.scale.set(big?1.7:1.1,big?1.7:1.1,1);m.position.set(x,y,z);
    m.userData={vx:Math.sin(b2)*Math.cos(a)*sp,vy:Math.cos(b2)*sp,vz:Math.sin(b2)*Math.sin(a)*sp,life:1,dec:0.008+Math.random()*0.006};
    scene.add(m);fwSparks.push(m);}}
function launchSky(fromX,fromZ){var col=FWCOLS[(Math.random()*FWCOLS.length)|0];
  var m=new THREE.Sprite(new THREE.SpriteMaterial({map:GTEX,color:col,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
  m.scale.set(.7,.7,1);m.position.set(fromX,2,fromZ);
  m.userData={vy:0.3+Math.random()*0.12,vx:(Math.random()-.5)*0.04,vz:(Math.random()-.5)*0.04,col:col,apex:18+Math.random()*16};
  scene.add(m);rocketsUp.push(m);}
function updateSkyShow(dt,t){
  if(Math.random()<0.028)launchSky((Math.random()-.5)*70,padZ-8-Math.random()*34);   // city show
  if(Math.random()<0.03)launchSky(padX+(Math.random()-.5)*2.4,padZ+1.7);            // the duo fires one
  monshiS.position.y=0.7+4.0/2+Math.sin(t*1.6)*0.09; toshiS.position.y=0.7+3.8/2+Math.sin(t*1.6+1.3)*0.09;
  for(var r2=rocketsUp.length-1;r2>=0;r2--){var rk=rocketsUp[r2];
    rk.position.y+=rk.userData.vy;rk.position.x+=rk.userData.vx;rk.position.z+=rk.userData.vz;rk.userData.vy-=0.0016;
    if(rk.position.y>=rk.userData.apex||rk.userData.vy<0.05){skyBurst(rk.position.x,rk.position.y,rk.position.z,rk.userData.col,Math.random()<0.3);scene.remove(rk);rocketsUp.splice(r2,1);}}
  for(var f2=fwSparks.length-1;f2>=0;f2--){var fs=fwSparks[f2];
    fs.position.x+=fs.userData.vx;fs.position.y+=fs.userData.vy;fs.position.z+=fs.userData.vz;
    fs.userData.vy-=0.0012;fs.userData.life-=fs.userData.dec;fs.material.opacity=Math.max(0,fs.userData.life);
    if(fs.userData.life<=0){scene.remove(fs);fwSparks.splice(f2,1);}}}
// ──────────────────────────────────────────────────────────────────
function buildGallery(items){
  // sort rarest-first so top pieces land front & center
  items=items.slice().sort(function(a,b){return (RANK[b.rarity]||0)-(RANK[a.rarity]||0);});
  ITEMS=items; var N=items.length;
  var cols=Math.min(N,10), rows=Math.ceil(N/cols);
  var Rr=Math.max(11, cols*1.5), rowH=3.0, baseRowY=2.4;
  // prominence-ordered slots: front & center, eye-level rows first (rows stack UP from the floor)
  var slots=[];
  for(var c=0;c<cols;c++)for(var r=0;r<rows;r++){var az=c/cols*Math.PI*2;var saz=az>Math.PI?az-2*Math.PI:az;
    slots.push({c:c,r:r,az:az,prom:Math.abs(saz)+(rows-1-r)*0.5});}
  slots.sort(function(a,b){return a.prom-b.prom;});
  items.forEach(function(it,idx){
    var sl=slots[idx]; var az=sl.az; var y=baseRowY+(rows-1-sl.r)*rowH;
    var rc=new THREE.Color(RC[it.rarity]||'#7d69ed'); var leg=it.rarity==='Legendary'; var sz=leg?3.0:(it.rarity==='Epic'?2.6:2.3);
    var grp=new THREE.Group(); grp.position.set(Math.sin(az)*Rr,y,Math.cos(az)*Rr); grp.rotation.y=az+Math.PI;
    var frame=new THREE.Mesh(new THREE.BoxGeometry(sz,sz,0.12),new THREE.MeshBasicMaterial({color:rc}));grp.add(frame);
    var ph=new THREE.MeshBasicMaterial({color:0x160f38,side:THREE.DoubleSide});
    var plane=new THREE.Mesh(new THREE.PlaneGeometry(sz-0.28,sz-0.28),ph);plane.position.z=0.07;grp.add(plane);
    texLoader.load('/public/fireworks-nft/collection/'+it.file+'.jpg',function(tx){tx.anisotropy=4;plane.material=new THREE.MeshBasicMaterial({map:tx,side:THREE.DoubleSide});},undefined,function(){});
    var halo=new THREE.Sprite(new THREE.SpriteMaterial({map:GTEX,color:rc,transparent:true,opacity:.5,blending:THREE.AdditiveBlending,depthWrite:false}));
    halo.scale.set(sz*1.7,sz*1.7,1);halo.position.z=-0.1;grp.add(halo);
    var np=new THREE.Mesh(new THREE.PlaneGeometry(sz*0.95,0.4),new THREE.MeshBasicMaterial({map:textTex(it.name,RC[it.rarity]),transparent:true}));np.position.set(0,-sz/2-0.35,0.1);grp.add(np);
    grp.userData={item:it,plane:plane,halo:halo,burstT:Math.random()*3,baseY:y};scene.add(grp);
    // floor reflection (dim, flipped)
    var refl=grp.clone(); refl.position.y=-y; refl.scale.y=-1; refl.traverse(function(o){if(o.material){o.material=o.material.clone();o.material.opacity=(o.material.opacity||1)*0.18;o.material.transparent=true;o.material.depthWrite=false;}}); scene.add(refl);
    panels.push({grp:grp,plane:plane,it:it});
  });
  var ph=phase();
  $('sub').textContent='FIREWORK NFTs · '+N+' PIECES · '+(ph==='closed'?'SEASON CLOSED':'🔴 MINT LIVE NOW — GONE JULY 5');
}
function spawnPanelSpark(grp){var rc=new THREE.Color(RC[grp.userData.item.rarity]||'#c084fc');
  for(var i=0;i<10;i++){var a=Math.random()*6.28,sp=0.6+Math.random()*1.3;
    var m=new THREE.Sprite(new THREE.SpriteMaterial({map:GTEX,color:rc,transparent:true,opacity:1,blending:THREE.AdditiveBlending,depthWrite:false}));m.scale.set(.35,.35,1);
    m.position.copy(grp.localToWorld(new THREE.Vector3(0,0.2,1.2)));
    m.userData={vx:Math.cos(a)*sp*0.04,vy:Math.sin(a)*sp*0.04+0.02,vz:(Math.random()-.5)*0.02,life:1};scene.add(m);sparks.push(m);}}
// ── Fortune Wheel (center) ──
var WHEEL_SEG=['Common','Uncommon','Common','Rare','Common','Uncommon','Common','Epic','Common','Uncommon','Common','Rare','Common','Uncommon','Common','Legendary'];
var wheel=new THREE.Group();wheel.position.set(0,4.7,0);scene.add(wheel);
var wglow=new THREE.Sprite(new THREE.SpriteMaterial({map:GTEX,color:0x7d69ed,transparent:true,opacity:.28,blending:THREE.AdditiveBlending,depthWrite:false}));
wglow.scale.set(15,15,1);wglow.position.z=-0.4;wheel.add(wglow);
var disc=new THREE.Group();wheel.add(disc);
var WN=WHEEL_SEG.length,WR=4.3,wstep=2*Math.PI/WN;
// dark luxury wheel face — one high-res canvas texture (angles match world space)
function wheelTex(){
  var S=1024,cv=document.createElement('canvas');cv.width=cv.height=S;var g=cv.getContext('2d');
  var c=S/2; g.translate(c,c); g.scale(1,-1);
  var base=g.createRadialGradient(0,0,0,0,0,c);
  base.addColorStop(0,'#1b1040');base.addColorStop(.55,'#140b30');base.addColorStop(1,'#0c0620');
  g.fillStyle=base;g.beginPath();g.arc(0,0,c-4,0,7);g.fill();
  var R=c-16;
  for(var i=0;i<WN;i++){
    var a0=i*wstep,a1=(i+1)*wstep,col=RC[WHEEL_SEG[i]];
    // whisper of tint on the wedge
    g.beginPath();g.moveTo(0,0);g.arc(0,0,R,a0,a1);g.closePath();g.fillStyle=col+'14';g.fill();
    // thin neon inlay arc at the edge
    g.beginPath();g.arc(0,0,R-10,a0+0.02,a1-0.02);
    g.strokeStyle=col;g.lineWidth=7;g.lineCap='round';g.shadowColor=col;g.shadowBlur=16;g.stroke();g.shadowBlur=0;
    // hairline separators
    g.beginPath();g.moveTo(Math.cos(a0)*R*0.24,Math.sin(a0)*R*0.24);g.lineTo(Math.cos(a0)*R,Math.sin(a0)*R);
    g.strokeStyle='rgba(125,105,237,0.22)';g.lineWidth=2;g.stroke();
    // small glowing rarity diamond
    var am=(a0+a1)/2,mx=Math.cos(am)*R*0.6,my=Math.sin(am)*R*0.6;
    g.save();g.translate(mx,my);g.rotate(am+Math.PI/4);
    g.fillStyle=col;g.shadowColor=col;g.shadowBlur=12;g.fillRect(-9,-9,18,18);g.restore();g.shadowBlur=0;
  }
  g.beginPath();g.arc(0,0,R*0.3,0,7);g.strokeStyle='rgba(216,180,90,0.45)';g.lineWidth=3;g.stroke();
  g.beginPath();g.arc(0,0,R+6,0,7);g.strokeStyle='rgba(216,180,90,0.6)';g.lineWidth=4;g.stroke();
  var t=new THREE.CanvasTexture(cv);t.anisotropy=8;return t;
}
var face=new THREE.Mesh(new THREE.CircleGeometry(WR,72),new THREE.MeshBasicMaterial({map:wheelTex(),side:THREE.DoubleSide}));
disc.add(face);
// gunmetal rim with a thin gold hairline
var rim=new THREE.Mesh(new THREE.TorusGeometry(WR+0.06,0.22,18,80),new THREE.MeshStandardMaterial({color:0x241a3e,metalness:.92,roughness:.22}));wheel.add(rim);
var rimLine=new THREE.Mesh(new THREE.TorusGeometry(WR+0.06,0.045,10,80),new THREE.MeshBasicMaterial({color:0xd8b45a}));rimLine.position.z=0.2;wheel.add(rimLine);
for(var wp=0;wp<WN;wp++){var peg=new THREE.Mesh(new THREE.SphereGeometry(0.065,8,8),new THREE.MeshBasicMaterial({color:0xd8b45a}));peg.position.set(Math.cos(wp*wstep)*(WR+0.06),Math.sin(wp*wstep)*(WR+0.06),0.16);wheel.add(peg);}
// hub: Monshi in a dark bezel with gold trim
var bez=new THREE.Mesh(new THREE.RingGeometry(1.18,1.55,48),new THREE.MeshStandardMaterial({color:0x241a3e,metalness:.9,roughness:.25}));bez.position.z=0.14;wheel.add(bez);
var bezLine=new THREE.Mesh(new THREE.RingGeometry(1.14,1.19,48),new THREE.MeshBasicMaterial({color:0xd8b45a}));bezLine.position.z=0.15;wheel.add(bezLine);
var hub=new THREE.Mesh(new THREE.CircleGeometry(1.14,40),new THREE.MeshBasicMaterial({color:0x160c32}));hub.position.z=0.15;wheel.add(hub);
texLoader.load('/public/monshi-face.jpg',function(tx){tx.anisotropy=4;hub.material=new THREE.MeshBasicMaterial({map:tx});});
// slim gold pointer
var ptr=new THREE.Mesh(new THREE.ConeGeometry(0.2,0.75,4),new THREE.MeshBasicMaterial({color:0xd8b45a}));ptr.position.set(0,WR+0.42,0.22);ptr.rotation.z=Math.PI;wheel.add(ptr);
var wlab=new THREE.Mesh(new THREE.PlaneGeometry(4.2,0.7),new THREE.MeshBasicMaterial({map:textTex('SPIN · 250 MON','#ffd54a'),transparent:true}));wlab.position.set(0,-WR-0.7,0.2);wheel.add(wlab);
// Weighted odds (per 1000): high tiers are genuinely rare. The draw decides
// the outcome FIRST, then the wheel animates to land on a matching segment.
var ODDS=[['Common',700],['Uncommon',200],['Rare',72],['Epic',23],['Legendary',5]];
function drawRarity(){var r=Math.random()*1000,acc=0;for(var i=0;i<ODDS.length;i++){acc+=ODDS[i][1];if(r<acc)return ODDS[i][0];}return 'Common';}
var spinning=false,spinFrom=0,spinTo=0,spinT=0,spinDur=5.2,spinRarity=null;
// July 4th drop window: preview before Jul 4, live Jul 4-5, closed after
function phase(){var n=new Date(),y=n.getFullYear(),close=new Date(y,6,6);
  return n>=close?'closed':'live';}
function gateToast(ph){toast(ph==='preview'?'🔒 PREVIEW — mint opens July 4':'🎆 Season closed — the 4th of July drop is gone');}
async function doSpin(){if(spinning)return;var btn=$('spin');
  var ph=phase(); if(ph!=='live'){gateToast(ph);return;}
  if(!WALLET){try{WALLET=await MONSHI.connectWallet();$('wallet').textContent=WALLET?WALLET.slice(0,6)+'…'+WALLET.slice(-4):'CONNECT';}catch(e){}}
  if(!WALLET){toast('Connect a wallet to spin');return;}
  var wei='0x'+(BigInt(250)*(BigInt(10)**BigInt(18))).toString(16);
  btn.disabled=true;btn.textContent='CONFIRM 250 MON…';
  try{await window.ethereum.request({method:'eth_sendTransaction',params:[{from:WALLET,to:CONTRACT,value:wei,data:SEL_SPIN,gas:'0x6DDD0'}]});}
  catch(e){toast('Spin cancelled');btn.disabled=false;btn.textContent='🎡 SPIN · 250 MON';return;}
  spinRarity=drawRarity();
  var opts=[];for(var si=0;si<WN;si++)if(WHEEL_SEG[si]===spinRarity)opts.push(si);
  var seg=opts[(Math.random()*opts.length)|0];
  var center=seg*wstep+wstep/2, want=Math.PI/2-center; // pointer sits at top (pi/2)
  spinFrom=disc.rotation.z;
  var delta=((want-spinFrom)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);
  spinTo=spinFrom+Math.PI*2*5+delta; spinT=0; spinning=true; btn.textContent='SPINNING…';}
function resolveSpin(){spinning=false;var btn=$('spin');btn.disabled=false;btn.textContent='🎡 SPIN · 250 MON';
  var rar=spinRarity||'Common';var pool=ITEMS.filter(function(it){return it.rarity===rar;});if(!pool.length)pool=ITEMS;
  var win=pool[(Math.random()*pool.length)|0];var p=panels.find(function(x){return x.it===win;});if(p){openCard(p);focus=p.grp;}
  if(rar==='Legendary'||rar==='Epic'){toast('👑 JACKPOT! '+win.name+' ('+rar+')!!');
    for(var k=0;k<8;k++)setTimeout(function(){launchSky(padX-2+Math.random()*4,padZ+1.6);},k*200);}
  else toast('🎉 You won '+win.name+' ('+rar+')!');}
function updateWheel(dt){wheel.rotation.y=Math.atan2(pos.x-wheel.position.x,pos.z-wheel.position.z);
  banner.rotation.y=wheel.rotation.y;
  if(spinning){spinT+=dt;var k=Math.min(1,spinT/spinDur);var e=1-Math.pow(1-k,3);
    disc.rotation.z=spinFrom+(spinTo-spinFrom)*e;if(k>=1)resolveSpin();}
  else disc.rotation.z+=dt*0.12;
  wglow.material.opacity=0.2+Math.sin(clock.elapsedTime*2)*0.07;}

// ── free-look controls ──
var yaw=Math.PI,pitch=0,pos=new THREE.Vector3(0,3.6,11),focus=null,drag=false,lx=0,ly=0,moved=0;
canvas.addEventListener('pointerdown',function(e){drag=true;lx=e.clientX;ly=e.clientY;moved=0;});
addEventListener('pointermove',function(e){if(!drag)return;var dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);yaw-=dx*0.004;pitch=Math.max(-0.9,Math.min(0.9,pitch-dy*0.004));focus=null;});
addEventListener('pointerup',function(e){drag=false;if(moved<6)pick(e);});
canvas.addEventListener('wheel',function(e){moveFwd(-e.deltaY*0.01);},{passive:true});
var pd=0;canvas.addEventListener('touchmove',function(e){if(e.touches.length===2){var a=e.touches[0],b=e.touches[1];var dd=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(pd)moveFwd((dd-pd)*0.02);pd=dd;}},{passive:true});
canvas.addEventListener('touchend',function(){pd=0;});
function dir(){return new THREE.Vector3(Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),Math.cos(yaw)*Math.cos(pitch));}
function moveFwd(a){var dv=dir().multiplyScalar(a*3);pos.add(dv);pos.y=Math.max(1.6,Math.min(13,pos.y));var R=Math.hypot(pos.x,pos.z);if(R<7.5){pos.x*=7.5/(R||1);pos.z*=7.5/(R||1);}if(R>17){pos.x*=17/R;pos.z*=17/R;}focus=null;}
addEventListener('keydown',function(e){var k=e.key.toLowerCase();if(k==='w'||e.key==='ArrowUp')moveFwd(1);else if(k==='s'||e.key==='ArrowDown')moveFwd(-1);else if(k==='a'||e.key==='ArrowLeft')yaw+=0.1;else if(k==='d'||e.key==='ArrowRight')yaw-=0.1;});
$('fwd').addEventListener('pointerdown',function(){this._i=setInterval(function(){moveFwd(0.5);},30);});
$('bwd').addEventListener('pointerdown',function(){this._i=setInterval(function(){moveFwd(-0.5);},30);});
['fwd','bwd'].forEach(function(id){$(id).addEventListener('pointerup',function(){clearInterval(this._i);});$(id).addEventListener('pointerleave',function(){clearInterval(this._i);});});
// ── pick / buy ──
var ray=new THREE.Raycaster(),m2=new THREE.Vector2();
function pick(e){m2.x=(e.clientX/innerWidth)*2-1;m2.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(m2,camera);var hit=ray.intersectObjects(panels.map(function(p){return p.plane;}));if(hit.length){var p=panels.find(function(x){return x.plane===hit[0].object;});if(p){openCard(p);focus=p.grp;}}}
function openCard(p){var it=p.it,rc=RC[it.rarity];document.documentElement.style.setProperty('--rc',rc);$('cName').textContent=it.name;var r=$('cRar');r.textContent=it.rarity;r.style.background=rc;$('cTr').textContent='Traits: '+it.traits;$('cPrice').textContent=it.price+' MON';var th=$('cThumb');th.src='/public/fireworks-nft/collection/'+it.file+'.jpg';th.style.setProperty('--rc',rc);var bb=$('buy');bb.textContent='BUY · '+it.price+' MON';bb.classList.remove('busy');bb._it=it;$('card').classList.add('show');}
$('close').onclick=function(){$('card').classList.remove('show');focus=null;};
function toast(t){var el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(function(){el.classList.remove('show');},3200);}
var WALLET=null;
$('wallet').onclick=async function(){try{if(window.MONSHI&&MONSHI.connectWallet){var w=await MONSHI.connectWallet();if(w){WALLET=w;this.textContent=w.slice(0,6)+'…'+w.slice(-4);toast('Wallet connected');return;}}}catch(e){}toast('No wallet found — install MetaMask/Rabby');};
$('buy').onclick=async function(){var it=this._it;if(!it)return;
  var ph=phase(); if(ph!=='live'){gateToast(ph);return;}
  if(!WALLET){try{WALLET=await MONSHI.connectWallet();$('wallet').textContent=WALLET?WALLET.slice(0,6)+'…'+WALLET.slice(-4):'CONNECT';}catch(e){}}if(!WALLET){toast('Connect a wallet first');return;}var wei='0x'+BigInt(Math.round(it.price*1e18)).toString(16);this.classList.add('busy');this.textContent='CONFIRM IN WALLET…';var btn=this;try{var data=SEL_BUY+BigInt(it.id).toString(16).padStart(64,'0');var tx=await window.ethereum.request({method:'eth_sendTransaction',params:[{from:WALLET,to:CONTRACT,value:wei,data:data,gas:'0x557B0'}]});toast('✅ MINTED '+it.name+' · tx '+tx.slice(0,10)+'… · tradeable on OpenSea');btn.textContent='✓ PURCHASED';}catch(e){toast('Purchase cancelled');btn.classList.remove('busy');btn.textContent='BUY · '+it.price+' MON';}};
// ── loop ──
var clock=new THREE.Clock(),ready=false;
function tick(){requestAnimationFrame(tick);var dt=Math.min(clock.getDelta(),0.05),t=clock.elapsedTime;
  if(!focus&&!drag)yaw+=dt*0.04;
  camera.position.copy(pos);
  if(focus){var fp=focus.getWorldPosition(new THREE.Vector3());var want=Math.atan2(fp.x-pos.x,fp.z-pos.z);yaw+=(want-yaw)*Math.min(1,dt*3);camera.lookAt(fp);}
  else camera.lookAt(pos.clone().add(dir()));
  orb.material.rotation+=dt*0.02; updateWheel(dt); updateSkyShow(dt,t);
  for(var i=0;i<panels.length;i++){var g=panels[i].grp;g.userData.burstT-=dt;g.userData.halo.material.opacity=0.4+Math.sin(t*2+i)*0.2;g.position.y=g.userData.baseY+Math.sin(t*1.2+i)*0.05;if(g.userData.burstT<=0){spawnPanelSpark(g);g.userData.burstT=2.5+Math.random()*3;}}
  for(var s=sparks.length-1;s>=0;s--){var sp=sparks[s];sp.position.x+=sp.userData.vx;sp.position.y+=sp.userData.vy;sp.position.z+=sp.userData.vz;sp.userData.vy-=0.0015;sp.userData.life-=0.02;sp.material.opacity=Math.max(0,sp.userData.life);if(sp.userData.life<=0){scene.remove(sp);sparks.splice(s,1);}}
  renderer.render(scene,camera);
  if(!ready){ready=true;$('loading').style.display='none';}
}
$('spin').onclick=doSpin;
fetch('/public/fireworks-nft/collection.json').then(function(r){return r.json();}).then(function(d){if(d.treasury)TREASURY=d.treasury;if(d.contract)CONTRACT=d.contract;buildGallery(d.items||[]);pos.set(0,3.6,11);tick();}).catch(function(){buildGallery([]);tick();toast('Could not load collection');});
})();
</script>
