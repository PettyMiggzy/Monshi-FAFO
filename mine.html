.gw{display:flex;flex-direction:column;align-items:center;gap:14px;}.tit{font-family:Orbitron,sans-serif;font-size:28px;font-weight:900;letter-spacing:2px;color:#EF4444;text-shadow:0 0 16px rgba(239,68,68,.6);}.hud{display:flex;gap:10px;}.st{padding:8px 14px;background:rgba(20,5,50,.6);border:1px solid rgba(139,92,246,.3);border-radius:8px;text-align:center;}.st .n{font-family:Orbitron,sans-serif;font-size:20px;color:#fff;}.st .l{font-size:8px;color:rgba(167,139,250,.6);letter-spacing:1.5px;}.bd{display:grid;grid-template-columns:repeat(10,32px);grid-gap:2px;padding:8px;background:rgba(20,5,50,.7);border-radius:8px;}.cl{width:32px;height:32px;background:rgba(139,92,246,.3);border:1px solid rgba(139,92,246,.5);border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:Orbitron,sans-serif;font-size:14px;font-weight:900;color:#fff;}.cl.open{background:rgba(0,0,0,.4);border-color:rgba(139,92,246,.2);cursor:default;}.cl.flag{background:rgba(252,211,77,.3);}.cl.bomb{background:#EF4444;}.n1{color:#3B82F6;}.n2{color:#22C55E;}.n3{color:#EF4444;}.n4{color:#A855F7;}.n5,.n6,.n7,.n8{color:#FCD34D;}</style><script src="/monshi-shared.js"></script>

<script>var SUPABASE_URL='https://cuqhqcmrgpdjlhyqztnc.supabase.co';
var SUPABASE_KEY='sb_publishable_nu-E2mvgdQ0l1DsSsOswWA_ma2RbV4z';
var BUY_URL='https://nad.fun/tokens/0xB744F5CDb792d8187640214C4A1c9aCE29af7777';
var playerName=localStorage.getItem('monshi_name')||'';
var leaderboard=[],playerRank=0,lastScore=0;
function sbH(){return{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=representation'};}
function fetchLB(t){fetch(SUPABASE_URL+'/rest/v1/'+t+'?select=name,score&order=score.desc&limit=10',{headers:sbH()}).then(function(r){return r.json();}).then(function(d){if(Array.isArray(d))leaderboard=d;}).catch(function(){});}
function submitS(t,sc,cb){if(!playerName)return cb&&cb();var mult=(window.MONSHI&&window.MONSHI.tier)?window.MONSHI.tier.mult:1;var boosted=Math.floor(sc*mult);var body={name:playerName,score:boosted};if(window.MONSHI&&window.MONSHI.wallet)body.wallet=window.MONSHI.wallet;fetch(SUPABASE_URL+'/rest/v1/'+t,{method:'POST',headers:sbH(),body:JSON.stringify(body)}).then(function(){return fetch(SUPABASE_URL+'/rest/v1/'+t+'?select=name,score,wallet&order=score.desc&limit=10',{headers:sbH()});}).then(function(r){return r.json();}).then(function(d){if(Array.isArray(d)){leaderboard=d;playerRank=leaderboard.findIndex(function(s){return s.name===playerName&&s.score===boosted;})+1;}lastScore=boosted;cb&&cb();}).catch(function(){cb&&cb();});}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function showDeath(GN,GU,T,sc,sub,isWin){
  lastScore=sc;
  function render(){
    document.getElementById('rT').textContent=isWin?'YOU WON':'RUGGED';
    document.getElementById('rT').className='rugged'+(isWin?' win':'');
    document.getElementById('dS').textContent=Math.floor(sc);
    document.getElementById('lT').textContent=sub||'';
    document.getElementById('rTag').textContent=playerRank>0?'#'+playerRank+' GLOBALLY':'';
    var tb=document.getElementById('lB');tb.innerHTML='';
    leaderboard.slice(0,5).forEach(function(s,i){var tr=document.createElement('tr');var isMe=s.name===playerName&&s.score===Math.floor(sc);if(isMe)tr.className='me';var medal=['🥇','🥈','🥉'][i]||'#'+(i+1);tr.innerHTML='<td>'+medal+'</td><td>'+esc(s.name)+'</td><td class="sc">'+s.score+'</td>';tb.appendChild(tr);});
    document.getElementById('dP').classList.add('show');
  }
  if(playerName){submitS(T,sc,render);}else{document.getElementById('nS').style.display='block';render();}
  document.getElementById('dSb').onclick=function(){var n=document.getElementById('dN').value.trim();playerName=(n||'ANON').toUpperCase().slice(0,16);localStorage.setItem('monshi_name',playerName);document.getElementById('nS').style.display='none';submitS(T,sc,render);};
  document.getElementById('dN').onkeydown=function(e){if(e.key==='Enter')document.getElementById('dSb').click();};
  document.getElementById('btnShare').onclick=function(){var shareUrl='https://monshi-fafo.vercel.app/api/share?game='+encodeURIComponent(GN)+'&score='+sc+'&name='+encodeURIComponent(playerName||'ANON')+'&rank='+playerRank+'&goto='+encodeURIComponent(GU);var tw='I scored '+sc+' on '+GN+' on the MONSHI ARCADE 🚀 Can you beat me? '+shareUrl+' $MONSHI #Monad';window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(tw),'_blank');};
  document.getElementById('btnBuy').onclick=function(){window.open(BUY_URL,'_blank');};
}
var AC=window.AudioContext||window.webkitAudioContext,actx=null,ma=null;
function initA(){if(actx)return;try{actx=new AC();ma=actx.createGain();ma.gain.value=0.2;ma.connect(actx.destination);}catch(e){}}
function tone(f,t,v,o,d){if(!actx)return;var st=actx.currentTime+(o||0);var os=actx.createOscillator();var g=actx.createGain();os.type=t||'square';os.frequency.setValueAtTime(f,st);g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(v,st+0.01);g.gain.exponentialRampToValueAtTime(0.001,st+d);os.connect(g);g.connect(ma);os.start(st);os.stop(st+d+0.05);}
function sfxWin(){[523,659,784,1046].forEach(function(f,i){tone(f,'square',0.18,i*0.06,0.12);});}
function sfxLose(){[440,330,220].forEach(function(f,i){tone(f,'sawtooth',0.25,i*0.12,0.18);});}
function sfxClick(){tone(800,'square',0.08,0,0.04);}
function sfxCoin(){tone(880,'square',0.12,0,0.05);tone(1320,'square',0.1,0.05,0.06);}
var W=10,H=10,M=10;var bd=[],open=[],flag=[],gameOver=false,won=false,tm=0,iv;
for(var i=0;i<H;i++){var r=[],or_=[],fr=[];for(var j=0;j<W;j++){r.push(0);or_.push(false);fr.push(false);}bd.push(r);open.push(or_);flag.push(fr);}
var mp=0;while(mp<M){var x=Math.floor(Math.random()*W),y=Math.floor(Math.random()*H);if(bd[y][x]===-1)continue;bd[y][x]=-1;mp++;}
for(var i=0;i<H;i++)for(var j=0;j<W;j++){if(bd[i][j]===-1)continue;var cnt=0;for(var di=-1;di<=1;di++)for(var dj=-1;dj<=1;dj++){var ni=i+di,nj=j+dj;if(ni>=0&&ni<H&&nj>=0&&nj<W&&bd[ni][nj]===-1)cnt++;}bd[i][j]=cnt;}
var grid=document.getElementById("bd");
function render(){grid.innerHTML="";for(var i=0;i<H;i++)for(var j=0;j<W;j++){var c=document.createElement("div");c.className="cl";if(open[i][j]){c.classList.add("open");if(bd[i][j]===-1){c.classList.add("bomb");c.textContent="🚩";}else if(bd[i][j]>0){c.classList.add("n"+bd[i][j]);c.textContent=bd[i][j];}}else if(flag[i][j]){c.classList.add("flag");c.textContent="🚩";}c.dataset.i=i;c.dataset.j=j;c.oncontextmenu=function(e){e.preventDefault();var i=+this.dataset.i,j=+this.dataset.j;if(open[i][j])return;flag[i][j]=!flag[i][j];render();updateFlags();};var pressTimer;c.onmousedown=function(e){if(e.button===0){var t=this;pressTimer=setTimeout(function(){var i=+t.dataset.i,j=+t.dataset.j;if(!open[i][j]){flag[i][j]=!flag[i][j];render();updateFlags();}},500);}};c.onmouseup=function(){clearTimeout(pressTimer);};c.ontouchstart=function(e){var t=this;pressTimer=setTimeout(function(){var i=+t.dataset.i,j=+t.dataset.j;if(!open[i][j]){flag[i][j]=!flag[i][j];render();updateFlags();}},500);};c.ontouchend=function(){clearTimeout(pressTimer);};c.onclick=function(e){clearTimeout(pressTimer);var i=+this.dataset.i,j=+this.dataset.j;if(open[i][j]||flag[i][j])return;reveal(i,j);};grid.appendChild(c);}}
function updateFlags(){var f=0;for(var i=0;i<H;i++)for(var j=0;j<W;j++)if(flag[i][j])f++;document.getElementById("rg").textContent=M-f;}
function reveal(i,j){if(gameOver||open[i][j]||flag[i][j])return;initA();open[i][j]=true;sfxClick();if(bd[i][j]===-1){gameOver=true;for(var ii=0;ii<H;ii++)for(var jj=0;jj<W;jj++)if(bd[ii][jj]===-1)open[ii][jj]=true;sfxLose();render();setTimeout(function(){showDeath("RUG SWEEPER","https://monshi-fafo.vercel.app/mine.html","scores_mine",0,"hit a rug",false);},700);return;}if(bd[i][j]===0){for(var di=-1;di<=1;di++)for(var dj=-1;dj<=1;dj++){var ni=i+di,nj=j+dj;if(ni>=0&&ni<H&&nj>=0&&nj<W&&!open[ni][nj])reveal(ni,nj);}}render();var openCnt=0;for(var ii=0;ii<H;ii++)for(var jj=0;jj<W;jj++)if(open[ii][jj])openCnt++;if(openCnt===W*H-M){gameOver=true;won=true;sfxWin();var sc=Math.max(0,1000-tm*5);setTimeout(function(){showDeath("RUG SWEEPER","https://monshi-fafo.vercel.app/mine.html","scores_mine",sc,tm+"s · clean sweep",true);},400);}}
render();iv=setInterval(function(){if(!gameOver){tm++;document.getElementById("tm").textContent=tm;}},1000);fetchLB("scores_mine");</script>
