<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Space+Mono:wght@700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:linear-gradient(135deg,#02000a,#180038,#0d0028);overflow:hidden;font-family:'Space Mono',monospace;color:#EDE9FF;display:flex;flex-direction:column;align-items:center;}
#back{position:fixed;top:10px;left:10px;z-index:10;color:rgba(139,92,246,.7);text-decoration:none;font-size:11px;background:rgba(0,0,0,.5);padding:6px 12px;border-radius:8px;border:1px solid rgba(139,92,246,.3);letter-spacing:1px;}
.wrap{max-width:560px;width:100%;padding:60px 20px 20px;display:flex;flex-direction:column;gap:18px;height:100vh;overflow-y:auto;}
.title{font-family:Orbitron,sans-serif;font-weight:900;font-size:28px;text-align:center;color:#EDE9FF;text-shadow:0 0 24px #8B5CF6;}
.title span{color:#4ADE80;text-shadow:0 0 14px #22C55E;}
.score{background:rgba(0,0,0,.5);border:1.5px solid rgba(139,92,246,.4);border-radius:14px;padding:18px;text-align:center;}
.score .big{font-family:Orbitron,sans-serif;font-weight:900;font-size:40px;color:#FCD34D;text-shadow:0 0 18px #F59E0B;letter-spacing:1px;}
.score .lbl{font-size:10px;color:rgba(196,181,253,.6);letter-spacing:2px;margin-top:4px;}
.score .rate{font-size:13px;color:#4ADE80;margin-top:6px;font-family:Orbitron,sans-serif;}
.miner{position:relative;display:flex;justify-content:center;}
.coin{width:160px;height:160px;border-radius:50%;background:rgba(139,92,246,.15);border:3px solid #8B5CF6;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .08s;box-shadow:0 0 30px rgba(139,92,246,.5);overflow:hidden;}
.coin:active{transform:scale(.92);}
.coin img{width:100%;height:100%;object-fit:cover;}
.float{position:absolute;color:#FCD34D;font-family:Orbitron,sans-serif;font-weight:900;font-size:18px;pointer-events:none;animation:floatUp 1s ease-out forwards;text-shadow:0 0 8px #F59E0B;}
@keyframes floatUp{0%{transform:translateY(0);opacity:1;}100%{transform:translateY(-80px);opacity:0;}}
.upgrades{display:flex;flex-direction:column;gap:8px;}
.upg{background:rgba(0,0,0,.45);border:1px solid rgba(139,92,246,.3);border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:all .2s;}
.upg:hover{border-color:#8B5CF6;background:rgba(139,92,246,.12);}
.upg.locked{opacity:.5;cursor:not-allowed;}
.upg.locked:hover{background:rgba(0,0,0,.45);}
.upg .name{font-family:Orbitron,sans-serif;font-weight:700;font-size:13px;color:#EDE9FF;}
.upg .desc{font-size:10px;color:rgba(196,181,253,.55);margin-top:2px;letter-spacing:.5px;}
.upg .cost{font-family:Orbitron,sans-serif;font-weight:900;color:#FCD34D;font-size:14px;}
.upg .lvl{font-size:10px;color:#4ADE80;margin-top:2px;text-align:right;}
.buy{display:block;text-align:center;background:linear-gradient(135deg,#22C55E,#15803D);color:#fff;text-decoration:none;font-family:Orbitron,sans-serif;font-weight:700;padding:12px;border-radius:10px;font-size:13px;letter-spacing:2px;margin-top:auto;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.5);}50%{box-shadow:0 0 0 12px rgba(34,197,94,0);}}
.credit{text-align:center;font-size:9px;color:rgba(139,92,246,.4);letter-spacing:1px;}
.disclaimer{background:rgba(252,211,77,.12);border:1px solid rgba(252,211,77,.4);color:#FCD34D;padding:8px 12px;border-radius:8px;text-align:center;font-size:9px;letter-spacing:1px;margin-bottom:8px;font-weight:700;line-height:1.4;}
</style></head><body>

<script>
var data=JSON.parse(localStorage.getItem('miner_data')||'null')||{score:0,clickPow:1,upgrades:[0,0,0,0,0]};
var last=Date.now();
var UPGRADES=[
  {name:'Stronger Tap',desc:'+1 per click',base:10,mult:1.6,effect:function(){data.clickPow=1+data.upgrades[0];}},
  {name:'Auto Bot',desc:'+1/sec',base:50,mult:1.7,effect:null},
  {name:'Trading Bot',desc:'+5/sec',base:300,mult:1.85,effect:null},
  {name:'Mining Rig',desc:'+25/sec',base:2000,mult:2,effect:null},
  {name:'Quantum Farm',desc:'+200/sec',base:25000,mult:2.2,effect:null}
];
function calcRate(){return data.upgrades[1]*1+data.upgrades[2]*5+data.upgrades[3]*25+data.upgrades[4]*200;}
function fmt(n){if(n<1000)return Math.floor(n);if(n<1e6)return(n/1000).toFixed(1)+'K';if(n<1e9)return(n/1e6).toFixed(2)+'M';if(n<1e12)return(n/1e9).toFixed(2)+'B';return(n/1e12).toFixed(2)+'T';}
function cost(i){return Math.floor(UPGRADES[i].base*Math.pow(UPGRADES[i].mult,data.upgrades[i]));}
function save(){localStorage.setItem('miner_data',JSON.stringify(data));}

var AC=window.AudioContext||window.webkitAudioContext,actx=null;
function ia(){if(actx)return;try{actx=new AC();}catch(e){}}
function tone(f,v,d){if(!actx)return;var s=actx.currentTime;var o=actx.createOscillator();var g=actx.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v,s+0.005);g.gain.exponentialRampToValueAtTime(0.001,s+d);o.connect(g);g.connect(actx.destination);o.start(s);o.stop(s+d+0.05);}

var coin=document.getElementById('coin');
coin.addEventListener('click',function(e){
  ia();data.score+=data.clickPow;tone(800+Math.random()*200,0.05,0.04);
  // Float text
  var f=document.createElement('div');f.className='float';f.textContent='+'+fmt(data.clickPow);
  var rect=coin.getBoundingClientRect();var p=coin.parentElement.getBoundingClientRect();
  f.style.left=(rect.left-p.left+rect.width/2-15)+'px';f.style.top=(rect.top-p.top+10)+'px';
  coin.parentElement.appendChild(f);setTimeout(function(){f.remove();},1000);
  render();
});

function render(){
  document.getElementById('score').textContent=fmt(data.score);
  document.getElementById('rate').textContent='+'+fmt(calcRate())+'/sec  ·  +'+fmt(data.clickPow)+'/click';
  var u=document.getElementById('upgrades');u.innerHTML='';
  UPGRADES.forEach(function(up,i){
    var c=cost(i);
    var d=document.createElement('div');d.className='upg'+(data.score<c?' locked':'');
    d.innerHTML='<div><div class="name">'+up.name+'</div><div class="desc">'+up.desc+'</div></div><div style="text-align:right;"><div class="cost">'+fmt(c)+'</div><div class="lvl">LVL '+data.upgrades[i]+'</div></div>';
    d.addEventListener('click',function(){
      ia();var c2=cost(i);if(data.score<c2)return;
      data.score-=c2;data.upgrades[i]++;
      if(UPGRADES[i].effect)UPGRADES[i].effect();
      tone(1200,0.08,0.1);save();render();
    });
    u.appendChild(d);
  });
}

UPGRADES[0].effect();
setInterval(function(){
  var now=Date.now();var dt=(now-last)/1000;last=now;
  data.score+=calcRate()*dt;render();
},250);
setInterval(save,3000);
render();
