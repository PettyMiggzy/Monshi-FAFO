<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Monshi City · Walk the Arcade</title>
<link rel="icon" type="image/png" href="/favicon.png?v=2">
<meta property="og:title" content="Monshi City — walk the 3D arcade">
<meta property="og:description" content="Free-roam a neon Monad city as your Monshi. Every building is a game. The sky runs on live on-chain buys.">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;background:#05030f;font-family:'Orbitron','Segoe UI',system-ui,sans-serif;color:#fff;touch-action:none;}
  #c{position:fixed;inset:0;display:block;}
  .hud{position:fixed;z-index:20;pointer-events:none;}
  /* top bar */
  #top{top:0;left:0;right:0;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(180deg,rgba(5,3,15,.75),rgba(5,3,15,0));}
  #logo{font-weight:900;letter-spacing:2px;font-size:15px;text-shadow:0 0 14px rgba(125,105,237,.9);}
  #logo b{color:#c4b5fd;}
  #logo i{color:#00e6d8;font-style:normal;}
  #ticker{pointer-events:none;overflow:hidden;flex:1;max-width:52%;height:26px;border:1px solid rgba(0,230,216,.35);border-radius:20px;background:rgba(0,20,26,.5);display:flex;align-items:center;}
  #tickerInner{white-space:nowrap;font-size:11px;letter-spacing:1px;color:#8ff6ee;padding-left:100%;animation:mv 26s linear infinite;}
  @keyframes mv{to{transform:translateX(-100%);}}
  /* prompt */
  #prompt{left:50%;bottom:132px;transform:translateX(-50%) scale(.9);opacity:0;transition:.18s;text-align:center;}
  #prompt.on{opacity:1;transform:translateX(-50%) scale(1);}
  #prompt .lbl{font-size:12px;letter-spacing:3px;color:#ffd54a;text-shadow:0 0 12px rgba(255,180,0,.7);}
  #prompt .go{margin-top:8px;pointer-events:auto;display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,#6b27de,#00a29e);border:1px solid #ffd54a;border-radius:26px;padding:11px 22px;font-weight:900;letter-spacing:2px;font-size:13px;cursor:pointer;box-shadow:0 0 26px rgba(125,105,237,.6);}
  /* controls */
  #stick{position:fixed;left:20px;bottom:24px;width:126px;height:126px;border-radius:50%;background:radial-gradient(circle,rgba(125,105,237,.12),rgba(125,105,237,.04));border:1.5px solid rgba(125,105,237,.4);z-index:25;touch-action:none;}
  #nub{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#a78bfa,#6b27de);border:1.5px solid rgba(255,255,255,.55);box-shadow:0 0 18px rgba(125,105,237,.7);}
  #btns{position:fixed;right:18px;bottom:26px;z-index:25;display:flex;flex-direction:column;gap:12px;align-items:center;}
  .rb{width:66px;height:66px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);font-weight:900;font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;color:#fff;}
  #jump{background:radial-gradient(circle at 35% 30%,rgba(0,230,216,.5),rgba(0,120,110,.55));box-shadow:0 0 16px rgba(0,230,216,.5);}
  #fire{background:radial-gradient(circle at 35% 30%,rgba(255,120,180,.6),rgba(180,30,90,.6));box-shadow:0 0 16px rgba(255,90,150,.55);font-size:26px;}
  #hint{position:fixed;bottom:6px;left:50%;transform:translateX(-50%);font-size:9px;letter-spacing:2px;color:rgba(196,181,253,.5);z-index:20;pointer-events:none;text-align:center;}
  #banner{position:fixed;top:96px;left:50%;transform:translateX(-50%) translateY(-8px);z-index:30;pointer-events:none;opacity:0;transition:.35s;background:linear-gradient(135deg,rgba(107,39,222,.9),rgba(0,162,158,.85));border:1px solid #ffd54a;border-radius:22px;padding:10px 20px;font-weight:900;letter-spacing:2px;font-size:12px;white-space:nowrap;box-shadow:0 0 26px rgba(255,180,0,.4);}
  #banner.on{opacity:1;transform:translateX(-50%) translateY(0);}
  /* connect */
  #conn{pointer-events:auto;display:inline-flex;align-items:center;gap:7px;background:linear-gradient(135deg,rgba(0,162,158,.25),rgba(107,39,222,.25));border:1px solid rgba(0,230,216,.5);border-radius:22px;padding:8px 14px;font-size:11px;font-weight:800;letter-spacing:1.5px;color:#eafffb;cursor:pointer;}
  /* map */
  #mini{position:fixed;right:14px;top:60px;width:118px;height:118px;z-index:20;border:1px solid rgba(125,105,237,.4);border-radius:12px;background:rgba(8,4,22,.6);pointer-events:none;}
  /* overlay */
  #ov{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;background:linear-gradient(rgba(5,3,15,.6) 0%,rgba(5,3,15,.2) 26%,rgba(5,3,15,.12) 52%,rgba(5,3,15,.55) 78%,rgba(5,3,15,.94) 100%),url('/public/monshi-city/hero_splash.jpg') center/cover no-repeat;padding:6vh 26px 6vh;}
  #ov .ovtop,#ov .ovbot{width:100%;display:flex;flex-direction:column;align-items:center;}
  #ov h1{font-size:min(15vw,60px);letter-spacing:6px;font-weight:900;background:linear-gradient(90deg,#c4b5fd,#00e6d8,#ffd54a);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 40px rgba(125,105,237,.4);line-height:1;}
  #ov .sub{margin-top:14px;color:#b9a9f0;letter-spacing:3px;font-size:13px;}
  #ov .rows{margin:22px 0 26px;color:rgba(196,181,253,.8);font-size:12px;letter-spacing:1px;line-height:2;}
  #ov .rows b{color:#00e6d8;}
  #enter{pointer-events:auto;background:linear-gradient(135deg,#6b27de,#00a29e);border:1.5px solid #ffd54a;border-radius:32px;padding:16px 44px;font-family:inherit;font-weight:900;letter-spacing:3px;font-size:16px;color:#fff;cursor:pointer;box-shadow:0 0 40px rgba(125,105,237,.6);}
  #ldbar{margin-top:20px;font-size:11px;letter-spacing:2px;color:#7d69ed;}
  .fadeout{opacity:0;pointer-events:none;transition:opacity .6s;}
  @media(min-width:820px){#stick,#btns{opacity:.55;}#hint{font-size:11px;}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud" id="top">
  <div id="logo"><b>MONSHI</b> <i>CITY</i></div>
  <div id="ticker"><div id="tickerInner">CONNECTING TO MONAD…</div></div>
  <div id="conn" onclick="doConnect()">🔌 CONNECT</div>
</div>
<canvas id="mini" width="118" height="118" class="hud"></canvas>

<div class="hud" id="prompt"><div class="lbl" id="promptLbl">ENTER</div><div class="go" id="promptGo">▶ ENTER</div></div>
<div id="banner"></div>

<div id="stick"><div id="nub"></div></div>
<div id="btns">
  <div class="rb" id="fire">🎆</div>
  <div class="rb" id="jump">⤴</div>
</div>
<div id="hint">DRAG SCREEN TO LOOK · WALK TO A BUILDING TO ENTER ITS GAME</div>

<div id="ov">
  <div class="ovtop">
    <h1>MONSHI CITY</h1>
    <div class="sub">WALK THE ARCADE</div>
  </div>
  <div class="ovbot">
    <div class="rows">
      🏙️ Every building is a <b>playable game</b> · 🎆 sky runs on <b>live buys</b> · 🐾 roam as your <b>Monshi</b>
    </div>
    <button id="enter">ENTER THE CITY</button>
    <div id="ldbar">loading world…</div>
  </div>
</div>

<script src="//unpkg.com/three@0.150.0/build/three.min.js"></script>
<script src="/monshi-shared.js"></script>
<script>
"use strict";
var $=function(id){return document.getElementById(id);};
var TAU=Math.PI*2;

/* ---------- renderer / scene ---------- */
var canvas=$('c');
var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
var scene=new THREE.Scene();
scene.background=new THREE.Color(0x0a0620);
scene.fog=new THREE.Fog(0x0a0620,42,225);
var camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,400);

/* ---------- lights ---------- */
scene.add(new THREE.HemisphereLight(0x5a4bd0,0x0a0618,0.55));
var moon=new THREE.DirectionalLight(0xbfd0ff,0.5);moon.position.set(-40,80,30);scene.add(moon);
var amb=new THREE.AmbientLight(0x40308a,0.5);scene.add(amb);
// roaming neon accent lights
var neonA=new THREE.PointLight(0x00e6d8,1.2,60);neonA.position.set(14,8,-10);scene.add(neonA);
var neonB=new THREE.PointLight(0xa855f7,1.2,60);neonB.position.set(-16,7,20);scene.add(neonB);

/* ---------- generated art textures ---------- */
var texLoader=new THREE.TextureLoader();
function loadTex(url,rx,ry){var t=texLoader.load(url);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=t.wrapT=THREE.RepeatWrapping;if(rx)t.repeat.set(rx,ry);return t;}
var streetTex=loadTex('/public/monshi-city/street.jpg',24,24);
var facadePurpleTex=loadTex('/public/monshi-city/facade_purple.jpg',1,2);
var facadeTealTex=loadTex('/public/monshi-city/facade_teal.jpg',1,2);
var SIGTEX={glass:loadTex('/public/monshi-city/facade_glass.jpg',1,2),fire:loadTex('/public/monshi-city/facade_fire.jpg',1,1),gold:loadTex('/public/monshi-city/facade_gold.jpg',1,2)};
// real character art — Monshi (18-frame sheets), real Toshi (blue + orange hoodie),
// and Chog (purple spiky). Sheet-animated where we have a run video, flip-animated single poses otherwise.
var charFrontTex=texLoader.load('/public/monshi-city/char_front.png');charFrontTex.colorSpace=THREE.SRGBColorSpace; // static pose for the statue
var N_RUN=18, RUN_AR=0.8086, FRUN_AR=0.75, FRONT_AR=339/677;
function loadRunSheet(url){var img=new Image();var t=new THREE.Texture(img);t.colorSpace=THREE.SRGBColorSpace;t.wrapS=THREE.RepeatWrapping;t.repeat.set(1/N_RUN,1);img.onload=function(){t.needsUpdate=true;};img.src=url;return t;}
function loadPose(url){var t=texLoader.load(url);t.colorSpace=THREE.SRGBColorSpace;return t;}
function dirD(tex,mode,ar){return {tex:tex,mode:mode,ar:ar};}
// Monshi (player + npc) — full sheets both ways
var playerBackTex=loadRunSheet('/public/monshi-city/char_run.png'), playerFrontTex=loadRunSheet('/public/monshi-city/char_frontrun.png');
var npcBackTex=loadRunSheet('/public/monshi-city/char_run.png'), npcFrontTex=loadRunSheet('/public/monshi-city/char_frontrun.png');
// Toshi — animated back sheet + single front pose;  Chog — single poses
var toshiBackTex=loadRunSheet('/public/monshi-city/char_run_toshi.png');
var toshiFrontPose=loadPose('/public/monshi-city/toshi_front_p.png');
var chogBackPose=loadPose('/public/monshi-city/chog_back_p.png'), chogFrontPose=loadPose('/public/monshi-city/chog_front_p.png');
function monshiChar(h){return makeChar(h,dirD(npcBackTex,'sheet',RUN_AR),dirD(npcFrontTex,'sheet',FRUN_AR));}
function toshiChar(h){return makeChar(h,dirD(toshiBackTex,'sheet',0.6836),dirD(toshiFrontPose,'pose',0.6271));}
function chogChar(h){return makeChar(h,dirD(chogBackPose,'pose',0.6486),dirD(chogFrontPose,'pose',0.6186));}
function makeChar(h,back,front){
  h=h||2.0;
  var mat=new THREE.SpriteMaterial({map:back.tex,transparent:true,alphaTest:0.3,depthWrite:true});
  var s=new THREE.Sprite(mat);s.center.set(0.5,0);s.scale.set(h*back.ar,h,1);
  var grp=new THREE.Group();grp.add(s);
  return {group:grp,sprite:s,mat:mat,back:back,front:front,h:h,dir:'back'};
}
// billboards face camera; sheets play a run cycle, single poses flip legs to fake a stride
function updateChar(c,face,moving,phase){
  var p=c.group.position;
  var vx=p.x-camera.position.x, vz=p.z-camera.position.z, vl=Math.hypot(vx,vz)||1;
  var dot=(Math.sin(face)*vx+Math.cos(face)*vz)/vl;
  var want=dot>=0?'back':'front';
  var cur=c[want];
  if(want!==c.dir){c.dir=want;c.mat.map=cur.tex;c.mat.needsUpdate=true;}
  if(cur.mode==='sheet'){
    cur.tex.offset.x=(moving?(Math.floor(phase*1.3)%N_RUN):0)/N_RUN;
    c.sprite.scale.x=c.h*cur.ar;
  } else {
    var flip=(moving && Math.sin(phase*1.4)<0)?-1:1;
    c.sprite.scale.x=c.h*cur.ar*flip;
  }
  c.sprite.position.y=moving?Math.abs(Math.sin(phase*2))*0.05:0;
}
// distant skyline backdrop (wraps the horizon behind the fog)
(function(){
  var sky=texLoader.load('/public/monshi-city/city_sky.jpg');sky.colorSpace=THREE.SRGBColorSpace;
  sky.wrapS=THREE.RepeatWrapping;sky.repeat.set(5,1);
  var cyl=new THREE.Mesh(new THREE.CylinderGeometry(250,250,190,48,1,true),
    new THREE.MeshBasicMaterial({map:sky,side:THREE.BackSide,fog:false,depthWrite:false}));
  cyl.position.y=64;scene.add(cyl);
  // upper night gradient dome cap
  var dome=new THREE.Mesh(new THREE.SphereGeometry(258,24,12,0,TAU,0,Math.PI/2),
    new THREE.MeshBasicMaterial({color:0x0a0620,side:THREE.BackSide,fog:false}));
  scene.add(dome);
})();

/* ---------- shared glow sprite ---------- */
function glowTex(col){
  var c=document.createElement('canvas');c.width=c.height=128;var g=c.getContext('2d');
  var gr=g.createRadialGradient(64,64,2,64,64,64);
  gr.addColorStop(0,col);gr.addColorStop(.35,col.replace('rgb','rgba').replace(')',',.6)'));gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr;g.fillRect(0,0,128,128);
  var t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
var glowWhite=glowTex('rgb(255,255,255)');
function makeGlow(hex,size){
  var s=new THREE.Sprite(new THREE.SpriteMaterial({map:glowWhite,color:hex,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
  s.scale.set(size,size,1);return s;
}

/* ---------- ground / streets (detailed) ---------- */
var ROADHALF=10;
(function(){
  var groundMat=new THREE.MeshStandardMaterial({map:streetTex,color:0x8a8aa0,roughness:0.42,metalness:0.5});
  var g=new THREE.Mesh(new THREE.PlaneGeometry(700,700),groundMat);
  g.rotation.x=-Math.PI/2;scene.add(g);
  var LEN=340;
  // raised sidewalks both sides (concrete slab look) with neon curb
  var swMat=new THREE.MeshStandardMaterial({color:0x2a2740,roughness:0.92,metalness:0.08});
  [-1,1].forEach(function(s){
    var sw=new THREE.Mesh(new THREE.BoxGeometry(7,0.32,LEN),swMat);
    sw.position.set(s*(ROADHALF+3.5),0.16,0);scene.add(sw);
    var curb=new THREE.Mesh(new THREE.BoxGeometry(0.22,0.44,LEN),new THREE.MeshBasicMaterial({color:s<0?0x7d69ed:0x00e6d8,transparent:true,opacity:0.75,blending:THREE.AdditiveBlending}));
    curb.position.set(s*ROADHALF,0.3,0);scene.add(curb);
  });
  // centre dashes (teal glow)
  var laneMat=new THREE.MeshBasicMaterial({color:0x00e6d8,transparent:true,opacity:0.6,blending:THREE.AdditiveBlending});
  for(var z=-LEN/2;z<=LEN/2;z+=9){var m=new THREE.Mesh(new THREE.PlaneGeometry(0.5,4),laneMat);m.rotation.x=-Math.PI/2;m.position.set(0,0.05,z);scene.add(m);}
  // white lane edge lines
  var wMat=new THREE.MeshBasicMaterial({color:0xcfd6f0,transparent:true,opacity:0.45});
  [-6,6].forEach(function(x){var m=new THREE.Mesh(new THREE.PlaneGeometry(0.22,LEN),wMat);m.rotation.x=-Math.PI/2;m.position.set(x,0.04,0);scene.add(m);});
  // crosswalks (zebra) at intersections
  var cwMat=new THREE.MeshBasicMaterial({color:0xe4e9ff,transparent:true,opacity:0.5});
  [-96,-40,18,74].forEach(function(cz){for(var i=-8.4;i<=8.4;i+=2.1){var bar=new THREE.Mesh(new THREE.PlaneGeometry(1.15,4.2),cwMat);bar.rotation.x=-Math.PI/2;bar.position.set(i,0.055,cz);scene.add(bar);}});
  // manhole covers
  var mhMat=new THREE.MeshStandardMaterial({color:0x15121f,roughness:0.6,metalness:0.7});
  [[-3,22],[4,-32],[-5,-64],[2,58],[6,-6],[-6,80]].forEach(function(p){var mh=new THREE.Mesh(new THREE.CircleGeometry(0.95,22),mhMat);mh.rotation.x=-Math.PI/2;mh.position.set(p[0],0.05,p[1]);scene.add(mh);});
  // street lamps along the sidewalks
  for(var lz=-140;lz<=140;lz+=26){[-1,1].forEach(function(s){
    var pole=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.12,6,6),new THREE.MeshStandardMaterial({color:0x14121e,metalness:0.6,roughness:0.5}));
    pole.position.set(s*(ROADHALF+1.4),3,lz);scene.add(pole);
    var lamp=makeGlow(s<0?'#c9b6ff':'#8ff6ee',3.4);lamp.position.set(s*(ROADHALF+1.0),6.1,lz);scene.add(lamp);
  });}
})();

/* ---------- building facade texture ---------- */
function facadeTex(base,win){
  var c=document.createElement('canvas');c.width=128;c.height=256;var g=c.getContext('2d');
  g.fillStyle=base;g.fillRect(0,0,128,256);
  for(var y=14;y<250;y+=20){for(var x=12;x<120;x+=22){
    var lit=Math.random();
    g.fillStyle= lit>0.55 ? win : 'rgba(10,8,22,0.9)';
    g.fillRect(x,y,14,12);
  }}
  var t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;
}

/* ---------- billboard (live ticker) canvas ---------- */
var bbCanvas=document.createElement('canvas');bbCanvas.width=512;bbCanvas.height=256;
var bbTex=new THREE.CanvasTexture(bbCanvas);bbTex.colorSpace=THREE.SRGBColorSpace;
var bbScroll=0,bbLines=['$MONSHI','LIVE ON MONAD','WALK · PLAY · MOON'];
function drawBillboard(){
  var g=bbCanvas.getContext('2d');
  g.fillStyle='#0a0424';g.fillRect(0,0,512,256);
  g.strokeStyle='#00e6d8';g.lineWidth=6;g.strokeRect(6,6,500,244);
  g.fillStyle='#c4b5fd';g.font='900 46px Orbitron,sans-serif';g.textAlign='center';
  g.fillText('$MONSHI',256,64);
  g.fillStyle='#ffd54a';g.font='700 20px Orbitron,sans-serif';
  g.fillText('LIVE BUYS · MONAD',256,96);
  g.font='700 22px Orbitron,sans-serif';g.textAlign='left';
  var y=138;
  bbLines.slice(0,4).forEach(function(l){
    g.fillStyle='#8ff6ee';g.fillText(l,24,y);y+=30;
  });
  bbTex.needsUpdate=true;
}
drawBillboard();

/* ---------- city buildings ---------- */
var BUILD=[]; // {mesh,box,door,url,name,accent}
function coolAccent(hex){var n=parseInt(hex.replace('#',''),16);var r=(n>>16)&255,g=(n>>8)&255;return g>r*1.1;}
function addBuilding(o){
  var h=o.h, w=o.w, d=o.d;
  var fTex=o.sig?SIGTEX[o.sig]:((o.facade==='teal'||(o.facade!=='purple'&&coolAccent(o.accent)))?facadeTealTex:facadePurpleTex);
  var eInt=o.sig==='fire'?0.9:(o.sig==='gold'?0.7:0.55);
  var mat=new THREE.MeshStandardMaterial({map:fTex,emissiveMap:fTex,color:0xdcdcea,roughness:0.75,metalness:0.25,emissive:new THREE.Color(o.accent),emissiveIntensity:eInt});
  var b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  b.position.set(o.x,h/2,o.z);scene.add(b);
  // rooftop glow
  var top=makeGlow(o.accent,w*1.4);top.position.set(o.x,h+1,o.z);scene.add(top);
  // neon sign band near top
  var band=new THREE.Mesh(new THREE.BoxGeometry(w*1.02,0.6,d*1.02),new THREE.MeshBasicMaterial({color:o.accent}));
  band.position.set(o.x,h-1.2,o.z);scene.add(band);
  var rec={box:{x:o.x,z:o.z,w:w,d:d},name:o.name,accent:o.accent};
  if(o.url){
    rec.url=o.url;
    // door faces the avenue (toward x=0): door on the inner face
    var side=o.x<0?1:-1; // door on +x side if building is left of avenue
    var doorX=o.x + side*(w/2+0.05);
    rec.door=new THREE.Vector3(doorX,0,o.z);
    // glowing doorway
    var dr=new THREE.Mesh(new THREE.PlaneGeometry(2.4,3.4),new THREE.MeshBasicMaterial({color:o.accent,transparent:true,opacity:0.85,side:THREE.DoubleSide}));
    dr.position.set(doorX,1.7,o.z);dr.rotation.y=Math.PI/2;scene.add(dr);
    var dg=makeGlow(o.accent,5);dg.position.set(doorX+side*0.3,2,o.z);scene.add(dg);
    // sign mounted flat on the facade, facing the avenue
    rec.marker=new THREE.Vector3(doorX,4.4,o.z);
    var sign=makeSignPlane(o.name,o.accent);
    sign.position.set(doorX+side*0.05,4.9,o.z);
    sign.rotation.y=side>0?Math.PI/2:-Math.PI/2;
    scene.add(sign);
    rec.beam=makeGlow(o.accent,3);rec.beam.position.set(doorX,0.3,o.z);scene.add(rec.beam);
  }
  BUILD.push(rec);
  return rec;
}
function makeSign(text,accent){
  var c=document.createElement('canvas');c.width=256;c.height=64;var g=c.getContext('2d');
  g.fillStyle='rgba(6,3,20,.85)';g.fillRect(0,0,256,64);
  g.strokeStyle=accent;g.lineWidth=4;g.strokeRect(3,3,250,58);
  g.fillStyle='#fff';g.font='900 26px Orbitron,sans-serif';g.textAlign='center';g.textBaseline='middle';

  // DexScreener allows CORS — hit it directly; fall back to the serverless proxy
  fetch('https://api.dexscreener.com/latest/dex/tokens/'+MONSHI_TOKEN).then(function(r){return r.json();}).then(function(j){
    var pairs=(j&&j.pairs)?j.pairs.slice():[];
    pairs.sort(function(a,b){return((b.liquidity&&b.liquidity.usd)||0)-((a.liquidity&&a.liquidity.usd)||0);});
    var p=pairs[0];if(!p)throw new Error('no pair');
    applyDex({price:p.priceUsd,change24:(p.priceChange&&p.priceChange.h24)||0,url:p.url});
  }).catch(function(){
    fetch('/api/dex').then(function(r){return r.json();}).then(applyDex).catch(function(){});
  });
}

  if(m.arms&&m.arms[0]){m.arms[0].rotation.x=-sw*0.4;m.arms[1].rotation.x=sw*0.4;}
  if(m.tail)m.tail.rotation.z=Math.sin(phase*0.6)*0.22;
  if(m.body)m.body.position.y=(m.bodyBaseY||1.02)+Math.abs(Math.sin(phase))*0.05*(moving?1:0.3);

  var m=(kind6===0)?monshiChar(h6):(kind6===1)?toshiChar(h6):chogChar(h6);
  var sx=(Math.random()<0.5?-1:1)*(3+Math.random()*5);
  m.group.position.set(sx,0,-50+Math.random()*100);
  scene.add(m.group);
  var sh=new THREE.Mesh(new THREE.CircleGeometry(0.55,16),new THREE.MeshBasicMaterial({color:0,transparent:true,opacity:0.28}));
  sh.rotation.x=-Math.PI/2;sh.position.y=0.02;scene.add(sh);
  NPCS.push({m:m,shadow:sh,tgt:newTarget(),ph:Math.random()*6,wait:0,face:0});
}

/* ---------- VIP holder pad ---------- */
var vipPad=new THREE.Mesh(new THREE.CircleGeometry(3.2,40),new THREE.MeshBasicMaterial({color:0xec4899,transparent:true,opacity:0.18,side:THREE.DoubleSide,blending:THREE.AdditiveBlending}));
vipPad.rotation.x=-Math.PI/2;vipPad.position.set(0,0.03,-30);scene.add(vipPad);
var vipRing=new THREE.Mesh(new THREE.RingGeometry(3.0,3.3,40),new THREE.MeshBasicMaterial({color:0xffd54a,transparent:true,opacity:0.7,side:THREE.DoubleSide}));
vipRing.rotation.x=-Math.PI/2;vipRing.position.set(0,0.04,-30);scene.add(vipRing);
var vipSign=makeSign('VIP · HOLDERS',0xffd54a);vipSign.position.set(0,3.4,-30);vipSign.scale.set(7,1.75,1);scene.add(vipSign);
var vipLight=new THREE.PointLight(0xec4899,0.8,16);vipLight.position.set(0,3,-30);scene.add(vipLight);
var vipActive=false,vipShow=0;

/* ---------- fireworks ---------- */
var fw={rockets:[],parts:[],pool:[]};
var sparkTex=glowWhite;
function spawnParticle(pos,vel,col,life){
  var p=fw.pool.pop();
  if(!p){var m=new THREE.Sprite(new THREE.SpriteMaterial({map:sparkTex,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));m.scale.set(0.5,0.5,1);scene.add(m);p={s:m};}
  p.s.visible=true;p.s.material.color.set(col);p.s.position.copy(pos);
  p.vel=vel;p.life=life;p.max=life;fw.parts.push(p);
}
function burst(pos,col){
  var n=44+Math.floor(Math.random()*30);
  var c=col||new THREE.Color().setHSL(Math.random(),0.9,0.6);
  for(var i=0;i<n;i++){
    var a=Math.random()*TAU,b=Math.acos(2*Math.random()-1),sp=3.5+Math.random()*3.5;
    var v=new THREE.Vector3(Math.sin(b)*Math.cos(a),Math.cos(b),Math.sin(b)*Math.sin(a)).multiplyScalar(sp);
    spawnParticle(pos.clone(),v,c,1+Math.random()*0.8);
  }
  // flash
  var fl=makeGlow('#ffffff',9);fl.position.copy(pos);fl.material.color.set(c);scene.add(fl);
  var t0=1;(function fade(){t0-=0.08;fl.material.opacity=Math.max(0,t0);fl.scale.setScalar(9+(1-t0)*6);if(t0>0)requestAnimationFrame(fade);else scene.remove(fl);})();
}
function launchRocket(from,col){
  var m=makeGlow(col?('#'+col.getHexString()):'#ffffff',1.4);
  m.position.copy(from);scene.add(m);
  var target=8+Math.random()*10;
  fw.rockets.push({s:m,pos:from.clone(),vel:new THREE.Vector3((Math.random()-0.5)*1.2,7+Math.random()*2,(Math.random()-0.5)*1.2),target:target,col:col||new THREE.Color().setHSL(Math.random(),0.9,0.6)});
}
function updateFW(dt){
  for(var i=fw.rockets.length-1;i>=0;i--){
    var r=fw.rockets[i];r.vel.y-=6*dt;r.pos.addScaledVector(r.vel,dt);r.s.position.copy(r.pos);
    if(r.vel.y<=0 || r.pos.y>=r.target){burst(r.pos,r.col);scene.remove(r.s);fw.rockets.splice(i,1);}
  }
  for(var j=fw.parts.length-1;j>=0;j--){
    var p=fw.parts[j];p.life-=dt;
    if(p.life<=0){p.s.visible=false;fw.parts.splice(j,1);fw.pool.push(p);continue;}
    p.vel.y-=4*dt;p.vel.multiplyScalar(0.985);p.s.position.addScaledVector(p.vel,dt);
    var k=p.life/p.max;p.s.material.opacity=k;p.s.scale.setScalar(0.28+k*0.35);
  }
}
var autoTimer=0;
// transient HUD banner
var bannerT=0;
function banner(txt){var el=$('banner');el.textContent=txt;el.classList.add('on');bannerT=3.2;}
// big multi-shell sky finale (whale buys / celebrations)
function finale(col){
  var base=new THREE.Vector3((Math.random()-0.5)*40,1,-40+Math.random()*30);
  for(var i=0;i<8;i++){(function(k){setTimeout(function(){
    var f=base.clone();f.x+=(Math.random()-0.5)*60;launchRocket(f,col||new THREE.Color().setHSL(Math.random(),0.9,0.6));
  },k*160);})(i);}
}

/* ---------- input ---------- */
var move={x:0,y:0}, keyMove={x:0,y:0};
var camYaw=0, camPitch=0.30, camDist=9.6;
var velY=0,onGround=true;
var keys={};
addEventListener('keydown',function(e){keys[e.code]=true;if(e.code==='Space'){jump();}if(e.code==='KeyE'){tryEnter();}});
addEventListener('keyup',function(e){keys[e.code]=false;});
function readKeys(){
  keyMove.x=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
  keyMove.y=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);
}
// joystick
(function(){
  var stick=$('stick'),nub=$('nub'),active=false,cx=0,cy=0,R=48;
  function start(x,y){active=true;var r=stick.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;moveNub(x,y);}
  function moveNub(x,y){var dx=x-cx,dy=y-cy,d=Math.hypot(dx,dy);if(d>R){dx=dx/d*R;dy=dy/d*R;}nub.style.transform='translate('+dx+'px,'+dy+'px)';move.x=dx/R;move.y=dy/R;}
  function end(){active=false;nub.style.transform='translate(0,0)';move.x=0;move.y=0;}
  stick.addEventListener('touchstart',function(e){e.preventDefault();start(e.touches[0].clientX,e.touches[0].clientY);},{passive:false});
  stick.addEventListener('touchmove',function(e){e.preventDefault();if(active)moveNub(e.touches[0].clientX,e.touches[0].clientY);},{passive:false});
  stick.addEventListener('touchend',function(e){e.preventDefault();end();},{passive:false});
  stick.addEventListener('mousedown',function(e){start(e.clientX,e.clientY);});
  addEventListener('mousemove',function(e){if(active)moveNub(e.clientX,e.clientY);});
  addEventListener('mouseup',function(){if(active)end();});
})();
// look drag + tap-to-open ad billboards
(function(){
  var dragId=null,lx=0,ly=0,moved=0;
  var ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
  function tapAt(cx,cy){
    ndc.x=(cx/innerWidth)*2-1;ndc.y=-(cy/innerHeight)*2+1;
    ray.setFromCamera(ndc,camera);
    var hits=ray.intersectObjects(ADS.map(function(a){return a.mesh;}));
    if(hits.length){
      var ud=hits[0].object.userData, k=ud.kind;
      var url=k==='monshi'?BUY_URL:(k==='chart'?DEX_URL:AD_TG);
      banner(k==='monshi'?'BUY $MONSHI ▲':(k==='chart'?'OPENING DEXSCREENER ▸':'📨 RENT AD SLOT #'+ud.slot+' · DM @kingpetty317'));
      window.open(url,'_blank');
    }
  }
  canvas.addEventListener('touchstart',function(e){var t=e.changedTouches[0];lx=t.clientX;ly=t.clientY;moved=0;dragId=t.identifier;},{passive:true});
  canvas.addEventListener('touchmove',function(e){for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];if(t.identifier===dragId){moved+=Math.abs(t.clientX-lx)+Math.abs(t.clientY-ly);camYaw-=(t.clientX-lx)*0.005;camPitch=Math.max(-0.1,Math.min(0.7,camPitch+(t.clientY-ly)*0.004));lx=t.clientX;ly=t.clientY;}}},{passive:true});
  canvas.addEventListener('touchend',function(e){var t=e.changedTouches[0];if(moved<12&&started)tapAt(t.clientX,t.clientY);dragId=null;});
  var md=false;
  canvas.addEventListener('mousedown',function(e){md=true;lx=e.clientX;ly=e.clientY;moved=0;});
  addEventListener('mousemove',function(e){if(md){moved+=Math.abs(e.clientX-lx)+Math.abs(e.clientY-ly);camYaw-=(e.clientX-lx)*0.004;camPitch=Math.max(-0.1,Math.min(0.7,camPitch+(e.clientY-ly)*0.003));lx=e.clientX;ly=e.clientY;}});
  addEventListener('mouseup',function(e){if(md&&moved<8&&started)tapAt(e.clientX,e.clientY);md=false;});
})();
// buttons
function jump(){if(onGround){velY=7.2;onGround=false;}}
function emote(){var pc=MONSHI&&MONSHI.getFirework&&MONSHI.getFirework();var col=pc?new THREE.Color(pc.color):new THREE.Color(0xff7ab5);var from=player.group.position.clone();from.y=1.4;launchRocket(from,col);}
$('jump').addEventListener('click',jump);
$('fire').addEventListener('click',emote);
$('promptGo').addEventListener('click',tryEnter);

/* ---------- portals ---------- */
var nearPortal=null;
function updatePortals(){
  var pp=player.group.position,best=null,bd=6.2;
  for(var i=0;i<BUILD.length;i++){var b=BUILD[i];if(!b.url)continue;var d=Math.hypot(pp.x-b.door.x,pp.z-b.door.z);if(d<bd){bd=d;best=b;}}
  nearPortal=best;
  var el=$('prompt');
  if(best){el.classList.add('on');$('promptLbl').textContent='ENTER · '+best.name;$('promptGo').textContent='▶ ENTER '+best.name;$('promptGo').style.borderColor=best.accent;}
  else el.classList.remove('on');
}
var entering=false;
function tryEnter(){if(nearPortal&&!entering){entering=true;var ov=$('ov');ov.style.transition='opacity .45s';ov.classList.remove('fadeout');ov.style.display='flex';ov.style.opacity='0';requestAnimationFrame(function(){ov.style.opacity='1';});setTimeout(function(){location.href=nearPortal.url;},420);}}

/* ---------- collision ---------- */
function blocked(x,z){
  for(var i=0;i<BUILD.length;i++){var b=BUILD[i].box;var hw=b.w/2+0.7,hd=b.d/2+0.7;
    if(x>b.x-hw&&x<b.x+hw&&z>b.z-hd&&z<b.z+hd)return true;}
  return false;
}

/* ---------- minimap ---------- */
var mm=$('mini').getContext('2d');
function drawMap(){
  mm.clearRect(0,0,118,118);mm.fillStyle='rgba(8,4,22,.7)';mm.fillRect(0,0,118,118);
  var sc=0.42,cx=59,cy=59;
  BUILD.forEach(function(b){
    mm.fillStyle=b.url?b.accent:'rgba(120,100,200,.35)';
    var w=Math.max(3,b.box.w*sc*0.4);
    mm.fillRect(cx+b.box.x*sc-w/2,cy+b.box.z*sc-w/2,w,w);
  });
  var p=player.group.position;
  mm.fillStyle='#fff';mm.beginPath();mm.arc(cx+p.x*sc,cy+p.z*sc,3.2,0,TAU);mm.fill();
  mm.strokeStyle='rgba(0,230,216,.6)';mm.lineWidth=1;mm.beginPath();
  mm.moveTo(cx+p.x*sc,cy+p.z*sc);mm.lineTo(cx+p.x*sc-Math.sin(faceAngle)*8,cy+p.z*sc-Math.cos(faceAngle)*8);mm.stroke();
}

/* ---------- animation state ---------- */
var walkPhase=0,faceAngle=Math.PI,started=false,clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  var dt=Math.min(clock.getDelta(),0.05);
  if(started){
    readKeys();
    var mx=move.x+keyMove.x, my=move.y+keyMove.y;
    var mag=Math.hypot(mx,my);
    var pos=player.group.position;
    if(mag>0.08){
      if(mag>1){mx/=mag;my/=mag;mag=1;}
      // movement relative to camera yaw
      var fwd=camYaw, ang=Math.atan2(mx,my); // screen->world
      var world=fwd+ang;
      var speed=6.6*dt*Math.min(1,mag);
      var nx=pos.x+Math.sin(world)*speed, nz=pos.z+Math.cos(world)*speed;
      if(!blocked(nx,pos.z))pos.x=nx;
      if(!blocked(pos.x,nz))pos.z=nz;
      pos.x=Math.max(-120,Math.min(120,pos.x));pos.z=Math.max(-120,Math.min(120,pos.z));
      faceAngle=world;
      walkPhase+=speed*3.4;
    } else { walkPhase+=dt*2.2; }
    // face
    var cur=player.group.rotation.y, tgt=faceAngle;
    var diff=((tgt-cur+Math.PI)%TAU)-Math.PI;player.group.rotation.y=cur+diff*Math.min(1,dt*10);
    // jump / gravity
    velY-=22*dt;pos.y+=velY*dt;if(pos.y<=0){pos.y=0;velY=0;onGround=true;}
    // character billboard (real Monshi art)
    updateChar(player,faceAngle,mag>0.1,walkPhase);
    // blob + aura follow
    blob.position.set(pos.x,0.02,pos.z);blob.scale.setScalar(1-Math.min(0.5,pos.y*0.3));
    aura.position.set(pos.x,0.06,pos.z);aura.rotation.z+=dt;auraLight.position.set(pos.x,1.2,pos.z);
    // trail (holders)
    if(trailOn && mag>0.2){var tp=pos.clone();tp.y=1.2;if(!trailPts.length||tp.distanceTo(trailPts[trailPts.length-1].p)>0.6){var s=makeGlow(trailColor,1);s.position.copy(tp);scene.add(s);trailPts.push({s:s,p:tp,life:0.8});}}
    for(var ti=trailPts.length-1;ti>=0;ti--){var t=trailPts[ti];t.life-=dt;t.s.material.opacity=Math.max(0,t.life);t.s.scale.setScalar(t.life*1.4);if(t.life<=0){scene.remove(t.s);trailPts.splice(ti,1);}}
    // NPC Monshis wander
    for(var ni=0;ni<NPCS.length;ni++){var npc=NPCS[ni],g=npc.m.group;
      if(npc.wait>0){npc.wait-=dt;npc.ph+=dt*2;}
      else{var to=npc.tgt.clone().sub(g.position);var dd=to.length();
        if(dd<1.2){npc.tgt=newTarget();npc.wait=0.5+Math.random()*2;}
        else{to.normalize();var ns=2.6*dt;var nx=g.position.x+to.x*ns,nz=g.position.z+to.z*ns;
          if(!blocked(nx,g.position.z))g.position.x=nx;if(!blocked(g.position.x,nz))g.position.z=nz;
          npc.face=Math.atan2(to.x,to.z);
          npc.ph+=ns*3.4;}
      }
      updateChar(npc.m,npc.face,npc.wait<=0,npc.ph);
      npc.shadow.position.set(g.position.x,0.02,g.position.z);
    }
    // burn temple flames flicker
    for(var bi=0;bi<burnFires.length;bi++){var bf=burnFires[bi];bf.ph+=dt*4;bf.s.position.y=bf.base+Math.sin(bf.ph)*1.4;bf.s.material.opacity=0.5+Math.sin(bf.ph*1.3)*0.35;bf.s.scale.setScalar(1.4+Math.sin(bf.ph)*0.5);}
    // VIP pad — holders get a personal show when standing on it
    vipRing.rotation.z+=dt*0.6;vipPad.material.opacity=0.14+Math.sin(clock.elapsedTime*2)*0.06;
    var onPad=Math.hypot(pos.x-0,pos.z-(-30))<3.2;
    var isHolder=window.MONSHI&&((MONSHI.hasNFT&&MONSHI.hasNFT())||(MONSHI.getFirework&&MONSHI.getFirework()));
    if(onPad&&isHolder){vipShow-=dt;if(vipShow<=0){vipShow=0.35;var pc=MONSHI.getFirework&&MONSHI.getFirework();var vc=pc?new THREE.Color(pc.color):new THREE.Color(0xec4899);launchRocket(new THREE.Vector3(pos.x+(Math.random()-0.5)*4,1,pos.z+(Math.random()-0.5)*4),vc);}
      if(!vipActive){vipActive=true;banner('👑 VIP LOUNGE · ENJOY THE SHOW');}}
    else if(onPad&&!isHolder){if(!vipActive){vipActive=true;banner('🔒 VIP PAD · HOLDERS ONLY — CONNECT A FIREWORKS NFT');}}
    else vipActive=false;
    // camera follow
    var camTarget=new THREE.Vector3(pos.x,pos.y+1.6,pos.z);
    var offset=new THREE.Vector3(Math.sin(camYaw)*camDist*Math.cos(camPitch),camDist*Math.sin(camPitch)+2.2,Math.cos(camYaw)*camDist*Math.cos(camPitch));
    var desired=camTarget.clone().add(offset);
    camera.position.lerp(desired,Math.min(1,dt*6));
    camera.lookAt(camTarget);
    // portals + fireworks
    updatePortals();
    autoTimer-=dt;if(autoTimer<=0){autoTimer=1.4+Math.random()*2.2;var fx=(Math.random()-0.5)*120,fz=-90+Math.random()*40;launchRocket(new THREE.Vector3(fx,1,fz));}
    updateFW(dt);
    // neon flicker
    neonA.intensity=1.0+Math.sin(clock.elapsedTime*3)*0.3;neonB.intensity=1.0+Math.cos(clock.elapsedTime*2.4)*0.3;
    if(bannerT>0){bannerT-=dt;if(bannerT<=0)$('banner').classList.remove('on');}
    drawMap();
  }
  renderer.render(scene,camera);
}
animate();

addEventListener('resize',function(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

/* ---------- wallet / live data ---------- */

// live buys ticker — the sky reacts to real on-chain buys
var lastTopTotal=null,tickerFirst=true;
function loadTicker(){

    var b=(d&&d.buyers)||[];

    $('tickerInner').textContent='LIVE BUYS · '+parts.join('   ·   ')+'   ·   ';

    // whale finale: when the top buyer's total grows, light the whole sky

  }).catch(function(){$('tickerInner').textContent='$MONSHI · LIVE ON MONAD · WELCOME TO MONSHI CITY';});

loadTicker();setInterval(loadTicker,60000);
// ambient big finale over the skyline every ~50s
setInterval(function(){if(started)finale();},50000);

  var ov=$('ov');ov.classList.add('fadeout');setTimeout(function(){ov.style.display='none';},600);
  started=true;camera.position.set(player.group.position.x,4,player.group.position.z+camDist);
});
