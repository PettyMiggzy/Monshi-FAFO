var AC=window.AudioContext||window.webkitAudioContext,actx=null,ma=null;

var c=document.getElementById("cv"),x=c.getContext("2d"),W=c.width,H=c.height;var plStart=window.MONSHI?Math.floor(window.MONSHI.getMultiplier()*100):100;var bal=parseInt(localStorage.getItem("plk_bal")||String(plStart)),bst=parseInt(localStorage.getItem("plk_bst")||"0");var pegs=[],ROWS=10;for(var r=0;r<ROWS;r++){var n=r+3,sp=W/(n+1);for(var i=0;i<n;i++)pegs.push({x:sp*(i+1),y:60+r*36,r:4});}var slots=[],SN=11;var sw=W/SN;var py=[10,5,2,1,0.5,0.2,0.5,1,2,5,10];for(var i=0;i<SN;i++)slots.push({x:i*sw,y:H-40,w:sw,h:40,m:py[i],c:py[i]>=5?"#FCD34D":py[i]>=2?"#22C55E":py[i]>=1?"#A855F7":"#EF4444"});var ball=null,parts=[];function up(){document.getElementById("bal").textContent=bal;document.getElementById("bst").textContent=bst;localStorage.setItem("plk_bal",bal);localStorage.setItem("plk_bst",bst);}up();fetchLB("scores_plinko");document.getElementById("bDrop").onclick=function(){if(bal<10||ball)return;initA();bal-=10;up();ball={x:W/2+(Math.random()-0.5)*10,y:20,vx:0,vy:0,r:7};};function step(){if(!ball)return;ball.vy+=0.3;ball.vx*=0.99;ball.x+=ball.vx;ball.y+=ball.vy;pegs.forEach(function(p){var dx=ball.x-p.x,dy=ball.y-p.y;var d=Math.sqrt(dx*dx+dy*dy);if(d<ball.r+p.r){var ang=Math.atan2(dy,dx);ball.x=p.x+Math.cos(ang)*(ball.r+p.r);ball.y=p.y+Math.sin(ang)*(ball.r+p.r);ball.vx=Math.cos(ang)*Math.abs(ball.vy)*0.7+(Math.random()-0.5)*1.5;ball.vy=Math.abs(Math.sin(ang)*Math.abs(ball.vy)*0.5);tone(600+Math.random()*200,"square",0.05,0,0.04);}});if(ball.x<5){ball.x=5;ball.vx*=-0.5;}if(ball.x>W-5){ball.x=W-5;ball.vx*=-0.5;}if(ball.y>=H-50){var s=Math.floor(ball.x/sw);if(s<0)s=0;if(s>=SN)s=SN-1;var win=Math.floor(10*slots[s].m);bal+=win;if(win>bst)bst=win;up();if(win>=20)sfxWin();else if(win>0)sfxCoin();else sfxLose();ball=null;if(bal<10){setTimeout(function(){showDeath("PLINKO","https://monshi-fafo.vercel.app/plinko.html","scores_plinko",bst,"empty bag",false);bal=100;up();},800);}}}function draw(){x.fillStyle="#0a0015";x.fillRect(0,0,W,H);slots.forEach(function(s,i){x.fillStyle=s.c+"33";x.fillRect(s.x,s.y,s.w,s.h);x.strokeStyle=s.c;x.strokeRect(s.x,s.y,s.w,s.h);x.fillStyle=s.c;x.font="bold 11px Orbitron";x.textAlign="center";x.fillText(s.m+"x",s.x+s.w/2,s.y+25);x.textAlign="left";});pegs.forEach(function(p){x.fillStyle="#A855F7";x.shadowColor="#A855F7";x.shadowBlur=5;x.beginPath();x.arc(p.x,p.y,p.r,0,Math.PI*2);x.fill();x.shadowBlur=0;});if(ball){x.fillStyle="#FCD34D";x.shadowColor="#FCD34D";x.shadowBlur=15;x.beginPath();x.arc(ball.x,ball.y,ball.r,0,Math.PI*2);x.fill();x.shadowBlur=0;}}function loop(){step();draw();requestAnimationFrame(loop);}loop();</script>
