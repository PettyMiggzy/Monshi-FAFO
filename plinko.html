<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>PLINKO</title><style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#02000a;overflow:hidden;font-family:'Space Mono',monospace;color:#EDE9FF;display:flex;align-items:center;justify-content:center;}
#hubBtn{position:fixed;top:8px;left:8px;z-index:7;color:rgba(139,92,246,.7);text-decoration:none;font-size:11px;letter-spacing:1px;background:rgba(0,0,0,.5);padding:6px 12px;border-radius:8px;border:1px solid rgba(139,92,246,.2);}
.btn{padding:10px 14px;border:none;border-radius:8px;font-family:Orbitron,sans-serif;font-size:11px;font-weight:700;cursor:pointer;letter-spacing:1px;}
.btn:hover{opacity:.85;}
#btnRetry{background:linear-gradient(135deg,#7C3AED,#5B21B6);color:#fff;}
#btnShare{background:linear-gradient(135deg,#1DA1F2,#0d7abf);color:#fff;}
#btnBuy{background:linear-gradient(135deg,#22C55E,#15803D);color:#fff;animation:pls 2s infinite;}
@keyframes pls{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.5);}50%{box-shadow:0 0 0 8px rgba(34,197,94,0);}}
.death{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,8,.92);z-index:8;}
.death.show{display:flex;}
.deathCard{background:rgba(90,30,180,.18);border:1.5px solid rgba(150,120,255,.4);border-radius:18px;padding:22px 28px;width:min(420px,90vw);text-align:center;}
.rugged{font-family:Orbitron,sans-serif;font-size:36px;font-weight:900;color:#FCA5A5;text-shadow:0 0 24px #EF4444;margin-bottom:6px;}
.rugged.win{color:#4ADE80;text-shadow:0 0 24px #22C55E;}
.scoreNum{font-family:Orbitron,sans-serif;font-size:24px;color:#EDE9FF;margin:10px 0;}
.lbl{font-size:10px;color:rgba(167,139,250,.6);letter-spacing:1px;margin-bottom:14px;}
#nameSubmit{margin-bottom:14px;display:none;}
#nameSubmit input{background:rgba(0,0,0,.5);border:1.5px solid rgba(139,92,246,.5);border-radius:8px;padding:8px 12px;color:#fff;font-family:'Space Mono',monospace;font-size:13px;outline:none;text-align:center;letter-spacing:2px;width:160px;}
#nameSubmit button{padding:8px 16px;background:linear-gradient(135deg,#7C3AED,#4ADE80);border:none;border-radius:8px;color:#fff;font-family:Orbitron,sans-serif;font-size:11px;font-weight:700;cursor:pointer;}
#btnRow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px;}
.lbT{width:100%;border-collapse:collapse;margin-bottom:12px;font-size:11px;}
.lbT th{color:rgba(139,92,246,.6);text-align:left;padding:3px 6px;border-bottom:1px solid rgba(139,92,246,.2);font-size:9px;letter-spacing:1px;}
.lbT td{padding:4px 6px;color:rgba(220,210,255,.8);}
.lbT tr.me td{color:#4ADE80;background:rgba(74,222,128,.08);}
.lbT .sc{text-align:right;font-family:Orbitron,sans-serif;}
</style></head><body><a href="/" id="hubBtn">← ALL GAMES</a><div style="display:flex;flex-direction:column;align-items:center;gap:14px;width:min(420px,92vw);">
<div style="font-family:Orbitron,sans-serif;font-size:28px;font-weight:900;letter-spacing:3px;color:#A855F7;text-shadow:0 0 20px rgba(168,85,247,.5);">PLINKO</div>
<div style="display:flex;gap:12px;font-family:Orbitron,sans-serif;">
<div style="padding:8px 14px;background:rgba(20,5,50,.6);border:1px solid rgba(139,92,246,.3);border-radius:8px;text-align:center;"><div style="font-size:20px;color:#fff;" id="psc">100</div><div style="font-size:8px;color:rgba(167,139,250,.6);letter-spacing:1.5px;">CHIPS</div></div>
<div style="padding:8px 14px;background:rgba(20,5,50,.6);border:1px solid rgba(74,222,128,.3);border-radius:8px;text-align:center;"><div style="font-size:20px;color:#4ADE80;" id="pbest">100</div><div style="font-size:8px;color:rgba(74,222,128,.5);letter-spacing:1.5px;">PEAK</div></div>
</div>
<canvas id="pk" width="380" height="500" style="width:100%;background:rgba(0,0,0,.4);border:1.5px solid rgba(139,92,246,.3);border-radius:12px;"></canvas>
<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;">
<button class="btn" data-pbet="5" style="background:rgba(139,92,246,.3);color:#fff;">DROP 5</button>
<button class="btn" data-pbet="10" style="background:rgba(139,92,246,.3);color:#fff;">DROP 10</button>
<button class="btn" data-pbet="25" style="background:rgba(139,92,246,.3);color:#fff;">DROP 25</button>
<button class="btn" data-pbet="50" style="background:linear-gradient(135deg,#FCD34D,#92400E);color:#000;">DROP 50</button>
</div>
</div><div class="death" id="deathPanel"><div class="deathCard">
<div class="rugged" id="ruggedTitle">RUGGED</div>
<div class="scoreNum" id="dScore">0</div>
<div class="lbl" id="lvlTag"></div>
<div class="lbl" id="rankTag" style="color:#4ADE80;"></div>
<div id="nameSubmit"><p style="color:rgba(196,181,253,.7);font-size:10px;letter-spacing:1.5px;margin-bottom:8px;">SUBMIT TO LEADERBOARD</p>
<div style="display:flex;gap:6px;justify-content:center;"><input id="dNameInput" type="text" maxlength="16" placeholder="YOUR NAME"><button id="dSubmit">SUBMIT</button></div></div>
<table class="lbT"><thead><tr><th>#</th><th>PLAYER</th><th class="sc">SCORE</th></tr></thead><tbody id="lbBody"></tbody></table>
<div id="btnRow"><button class="btn" id="btnShare">SHARE 𝕏</button><button class="btn" id="btnBuy">BUY $MONSHI</button><button class="btn" id="btnRetry" onclick="location.reload()">RETRY</button></div>
</div></div><script>var SUPABASE_URL='https://cuqhqcmrgpdjlhyqztnc.supabase.co';
var SUPABASE_KEY='sb_publishable_nu-E2mvgdQ0l1DsSsOswWA_ma2RbV4z';
var BUY_URL='https://nad.fun/tokens/0xB744F5CDb792d8187640214C4A1c9aCE29af7777';
var playerName=localStorage.getItem('monshi_name')||'';
var leaderboard=[],playerRank=0;
function sbH(){return{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=representation'};}
function fetchLB(t){fetch(SUPABASE_URL+'/rest/v1/'+t+'?select=name,score&order=score.desc&limit=10',{headers:sbH()}).then(function(r){return r.json();}).then(function(d){if(Array.isArray(d))leaderboard=d;}).catch(function(){});}
function submitScore(t,sc,cb){if(!playerName)return cb&&cb();fetch(SUPABASE_URL+'/rest/v1/'+t,{method:'POST',headers:sbH(),body:JSON.stringify({name:playerName,score:Math.floor(sc)})}).then(function(){return fetch(SUPABASE_URL+'/rest/v1/'+t+'?select=name,score&order=score.desc&limit=10',{headers:sbH()});}).then(function(r){return r.json();}).then(function(d){if(Array.isArray(d)){leaderboard=d;playerRank=leaderboard.findIndex(function(s){return s.name===playerName&&s.score===Math.floor(sc);})+1;}if(cb)cb();}).catch(function(){if(cb)cb();});}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function showDeath(GAME,TABLE,URL,sc,subtitle,isWin){
  function render(){
    document.getElementById('ruggedTitle').textContent=isWin?'YOU WIN':'GAME OVER';
    document.getElementById('ruggedTitle').className='rugged'+(isWin?' win':'');
    document.getElementById('dScore').textContent=Math.floor(sc);
    document.getElementById('lvlTag').textContent=subtitle||'';
    document.getElementById('rankTag').textContent=playerRank>0?'#'+playerRank+' GLOBALLY':'';
    var tb=document.getElementById('lbBody');tb.innerHTML='';
    leaderboard.slice(0,5).forEach(function(s,i){var tr=document.createElement('tr');var isMe=s.name===playerName&&s.score===Math.floor(sc);if(isMe)tr.className='me';var medal=['🥇','🥈','🥉'][i]||'#'+(i+1);tr.innerHTML='<td>'+medal+'</td><td>'+esc(s.name)+'</td><td class="sc">'+s.score+'</td>';tb.appendChild(tr);});
    document.getElementById('deathPanel').classList.add('show');
  }
  if(playerName){submitScore(TABLE,sc,render);}else{document.getElementById('nameSubmit').style.display='block';render();}
  document.getElementById('dSubmit').onclick=function(){var n=document.getElementById('dNameInput').value.trim();playerName=(n||'ANON').toUpperCase().slice(0,16);localStorage.setItem('monshi_name',playerName);document.getElementById('nameSubmit').style.display='none';submitScore(TABLE,sc,render);};
  document.getElementById('dNameInput').onkeydown=function(e){if(e.key==='Enter')document.getElementById('dSubmit').click();};
  document.getElementById('btnShare').onclick=function(){var tw='I scored '+Math.floor(sc)+' on '+GAME+' on Monshi Arcade '+URL+' $MONSHI #Monad';window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(tw),'_blank');};
  document.getElementById('btnBuy').onclick=function(){window.open(BUY_URL,'_blank');};
}
var AC=window.AudioContext||window.webkitAudioContext,actx=null,master=null;
function initAudio(){if(actx)return;try{actx=new AC();master=actx.createGain();master.gain.value=0.25;master.connect(actx.destination);}catch(e){}}
function tone(f,t,v,o,d){if(!actx)return;var st=actx.currentTime+(o||0);var os=actx.createOscillator();var g=actx.createGain();os.type=t||'square';os.frequency.setValueAtTime(f,st);g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(v,st+0.01);g.gain.exponentialRampToValueAtTime(0.001,st+d);os.connect(g);g.connect(master);os.start(st);os.stop(st+d+0.05);}
function sfxWin(){[523,659,784,1046].forEach(function(f,i){tone(f,'square',0.18,i*0.06,0.12);});}
function sfxLose(){[440,330,220].forEach(function(f,i){tone(f,'sawtooth',0.25,i*0.12,0.18);});}
function sfxClick(){tone(800,'square',0.08,0,0.04);}
function sfxCoin(){tone(880,'square',0.12,0,0.05);tone(1320,'square',0.1,0.05,0.06);}

var c=document.getElementById('pk'),x=c.getContext('2d');var W=380,H=500;
var ROWS=10,pegs=[],balls=[],BUCKETS=[10,3,1,0.5,0.3,0.2,0.3,0.5,1,3,10];
var BC=BUCKETS.length;
for(var r=0;r<ROWS;r++){var pegCount=r+3;var spacing=W/(pegCount+1);for(var i=0;i<pegCount;i++){pegs.push({x:spacing*(i+1),y:60+r*36,r:4});}}
var sc=100,best=parseInt(localStorage.getItem('plinko_best')||'100');
document.getElementById('pbest').textContent=best;
function drop(bet){
  initAudio();
  if(sc<bet){return;}
  sc-=bet;document.getElementById('psc').textContent=sc;
  balls.push({x:W/2+(Math.random()-0.5)*20,y:20,vx:0,vy:0,bet:bet,settled:false});
}
function loop(){requestAnimationFrame(loop);
  x.clearRect(0,0,W,H);
  // Pegs
  pegs.forEach(function(p){x.fillStyle='#A855F7';x.shadowColor='#A855F7';x.shadowBlur=6;x.beginPath();x.arc(p.x,p.y,p.r,0,Math.PI*2);x.fill();});
  x.shadowBlur=0;
  // Buckets
  var bw=W/BC;
  for(var i=0;i<BC;i++){var m=BUCKETS[i];var col=m>=10?'#FCD34D':m>=3?'#22C55E':m>=1?'#A855F7':'#EF4444';x.fillStyle=col+'33';x.fillRect(i*bw,H-50,bw-2,50);x.fillStyle=col;x.font='bold 12px Orbitron';x.textAlign='center';x.fillText(m+'x',i*bw+bw/2,H-25);}
  x.textAlign='left';
  // Balls
  balls.forEach(function(b,bi){
    if(b.settled)return;
    b.vy+=0.3;b.vx*=0.99;b.x+=b.vx;b.y+=b.vy;
    pegs.forEach(function(p){var dx=b.x-p.x,dy=b.y-p.y,d=Math.sqrt(dx*dx+dy*dy);if(d<8){var a=Math.atan2(dy,dx);b.x=p.x+Math.cos(a)*8;b.y=p.y+Math.sin(a)*8;b.vx=Math.cos(a)*3+(Math.random()-0.5)*1.5;b.vy=Math.abs(Math.sin(a))*3;sfxClick();}});
    if(b.x<5){b.x=5;b.vx*=-0.6;}if(b.x>W-5){b.x=W-5;b.vx*=-0.6;}
    if(b.y>H-50){b.settled=true;var idx=Math.floor(b.x/bw);idx=Math.max(0,Math.min(BC-1,idx));var win=Math.floor(b.bet*BUCKETS[idx]);sc+=win;if(sc>best){best=sc;localStorage.setItem('plinko_best',best);document.getElementById('pbest').textContent=best;}document.getElementById('psc').textContent=sc;if(BUCKETS[idx]>=3)sfxWin();else if(BUCKETS[idx]>=1)sfxCoin();else sfxLose();setTimeout(function(){balls.splice(balls.indexOf(b),1);},400);}
    x.fillStyle='#FCD34D';x.shadowColor='#FCD34D';x.shadowBlur=10;x.beginPath();x.arc(b.x,b.y,7,0,Math.PI*2);x.fill();x.shadowBlur=0;
  });
  if(sc<5&&balls.length===0){fetchLB('scores_plinko');setTimeout(function(){showDeath('PLINKO','scores_plinko','https://monshi-fafo.vercel.app/plinko.html',best,'PEAK CHIPS',best>=500);},500);return;}
}
document.querySelectorAll('[data-pbet]').forEach(function(b){b.onclick=function(){drop(parseInt(b.dataset.pbet));};});
fetchLB('scores_plinko');loop();
</script></body></html>
