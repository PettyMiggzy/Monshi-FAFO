<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#A855F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" href="/favicon.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>WHAT MONSHI ARE YOU?</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#02000a;font-family:'Space Mono',monospace;color:#fff;padding:30px 20px;display:flex;align-items:center;justify-content:center;}
.wrap{max-width:560px;margin:0 auto;width:100%;}
.bk{position:fixed;top:8px;left:8px;color:rgba(139,92,246,.7);text-decoration:none;font-size:11px;letter-spacing:1.5px;background:rgba(0,0,0,.5);padding:6px 12px;border-radius:8px;border:1px solid rgba(139,92,246,.2);}
h1{font-family:Orbitron,sans-serif;font-size:clamp(28px,6vw,52px);font-weight:900;background:linear-gradient(135deg,#EC4899,#A855F7,#FCD34D);background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:4px;text-align:center;margin-bottom:8px;line-height:1.05;}
.subt{text-align:center;color:rgba(196,181,253,.65);letter-spacing:3px;margin-bottom:30px;font-size:11px;}

/* Intro */
.intro{padding:32px;background:linear-gradient(135deg,rgba(168,85,247,.15),rgba(20,5,50,.7));border:2px solid rgba(168,85,247,.4);border-radius:18px;text-align:center;}
.intro p{color:rgba(220,210,255,.85);font-size:13px;line-height:1.7;letter-spacing:1px;margin-bottom:18px;}
.startBtn{padding:16px 40px;background:linear-gradient(135deg,#EC4899,#7C3AED);color:#fff;border:none;border-radius:12px;font-family:Orbitron,sans-serif;font-size:14px;font-weight:900;letter-spacing:3px;cursor:pointer;animation:pulse 2.5s infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(236,72,153,.5);}50%{box-shadow:0 0 0 12px rgba(236,72,153,0);}}

/* Question */
.qBox{padding:24px;background:rgba(20,5,50,.7);border:1.5px solid rgba(168,85,247,.4);border-radius:18px;}
.qHeader{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.qNum{font-family:Orbitron,sans-serif;font-size:11px;color:#A855F7;letter-spacing:3px;font-weight:900;}
.progress{flex:1;height:6px;background:rgba(0,0,0,.4);border-radius:3px;margin-left:14px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,#A855F7,#EC4899);transition:width .4s ease;}
.qText{font-family:Orbitron,sans-serif;font-size:18px;color:#fff;line-height:1.5;letter-spacing:1px;margin-bottom:20px;text-align:center;}
.opts{display:flex;flex-direction:column;gap:10px;}
.opt{padding:16px 18px;background:rgba(0,0,0,.3);border:1.5px solid rgba(139,92,246,.3);border-radius:10px;cursor:pointer;font-family:'Space Mono',monospace;font-size:13px;color:rgba(220,210,255,.85);transition:all .2s;text-align:left;letter-spacing:.5px;line-height:1.5;}
.opt:hover{border-color:#EC4899;background:rgba(236,72,153,.1);color:#fff;transform:translateX(4px);}

/* Result */
.result{padding:30px 24px;background:linear-gradient(135deg,rgba(236,72,153,.18),rgba(20,5,50,.85));border:2px solid #EC4899;border-radius:20px;text-align:center;box-shadow:0 0 40px rgba(236,72,153,.3);}
.rEyebrow{font-family:Orbitron,sans-serif;font-size:10px;color:rgba(196,181,253,.6);letter-spacing:4px;margin-bottom:8px;}
.rTraitName{font-family:Orbitron,sans-serif;font-size:clamp(28px,6vw,46px);font-weight:900;color:#EC4899;letter-spacing:3px;margin-bottom:6px;text-shadow:0 0 20px rgba(236,72,153,.6);line-height:1.05;}
.rTagline{color:#FCD34D;font-size:12px;letter-spacing:2px;margin-bottom:18px;}
.rDesc{padding:18px;background:rgba(0,0,0,.3);border-radius:12px;font-size:13px;color:rgba(220,210,255,.85);line-height:1.7;margin-bottom:18px;letter-spacing:.5px;}
.rStats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px;}
.rStat{padding:10px;background:rgba(0,0,0,.25);border-radius:8px;border:1px solid rgba(168,85,247,.2);}
.rStat .v{font-family:Orbitron,sans-serif;font-size:18px;font-weight:900;color:#fff;}
.rStat .l{font-size:8px;color:rgba(167,139,250,.6);letter-spacing:1.5px;margin-top:3px;}
.rActions{display:flex;flex-direction:column;gap:8px;}
.rBtn{padding:14px;border:none;border-radius:10px;font-family:Orbitron,sans-serif;font-size:12px;font-weight:900;letter-spacing:2px;cursor:pointer;color:#fff;text-decoration:none;text-align:center;transition:transform .15s;}
.rBtn:active{transform:scale(.98);}
.rBtnX{background:linear-gradient(135deg,#1DA1F2,#0d7abf);}
.rBtnNFT{background:linear-gradient(135deg,#EC4899,#7C3AED);}
.rBtnRetry{background:rgba(0,0,0,.4);border:1px solid rgba(139,92,246,.3);}
.kingP{position:fixed;bottom:6px;right:10px;font-size:9px;color:rgba(255,255,255,.18);letter-spacing:1.5px;}
</style>
</head>
<body>
<a class="bk" href="/">← ARCADE</a>
<div class="wrap">
<h1>WHAT MONSHI ARE YOU?</h1>
<div class="subt">10 QUESTIONS · ONE TRAIT · NO TAKE-BACKS</div>
<div id="content"></div>
</div>

<script src="/monshi-shared.js"></script>
<script src="/referral-track.js" defer></script>
<script src="/prize-banner.js" defer></script>
<script src="/pwa-install.js" defer></script>
<div class="kingP">a KING PETTY build</div>

<script>
// 10 questions, each scoring traits 0-3 across multiple dimensions
// Dimensions: greed, cope, chaos, brain, hope
var QUESTIONS = [
  {q:"It's 3am. Chart just dumped 40%. You:",
    a:[
      {t:"Buy more, cope harder", s:{greed:3,cope:2,chaos:0,brain:0,hope:2}},
      {t:"Sell, cry, refresh chart 200x", s:{greed:0,cope:3,chaos:1,brain:0,hope:0}},
      {t:"Close laptop, sleep, deal tomorrow", s:{greed:0,cope:0,chaos:0,brain:3,hope:1}},
      {t:"Tweet about how you saw it coming", s:{greed:0,cope:3,chaos:2,brain:1,hope:0}}
    ]},
  {q:"Your trading strategy in one word:",
    a:[
      {t:"Vibes", s:{greed:1,cope:1,chaos:3,brain:0,hope:2}},
      {t:"Spreadsheets", s:{greed:0,cope:0,chaos:0,brain:3,hope:1}},
      {t:"Hopium", s:{greed:2,cope:1,chaos:1,brain:0,hope:3}},
      {t:"Revenge", s:{greed:2,cope:3,chaos:2,brain:0,hope:0}}
    ]},
  {q:"Friend asks how your portfolio is doing:",
    a:[
      {t:"Crushing it 💎", s:{greed:1,cope:3,chaos:0,brain:0,hope:2}},
      {t:"Down bad but it's fine", s:{greed:0,cope:3,chaos:0,brain:1,hope:1}},
      {t:"Up 4.2%, full disclosure", s:{greed:0,cope:0,chaos:0,brain:3,hope:1}},
      {t:"Don't ask", s:{greed:0,cope:2,chaos:2,brain:0,hope:0}}
    ]},
  {q:"You see a new memecoin trending. You:",
    a:[
      {t:"Ape immediately, ask later", s:{greed:3,cope:0,chaos:3,brain:0,hope:2}},
      {t:"Read the contract, check holders", s:{greed:0,cope:0,chaos:0,brain:3,hope:0}},
      {t:"Wait for the dip", s:{greed:1,cope:0,chaos:0,brain:2,hope:1}},
      {t:"Tell yourself you'll buy it later (you won't)", s:{greed:0,cope:2,chaos:0,brain:1,hope:0}}
    ]},
  {q:"Your crypto Twitter persona is:",
    a:[
      {t:"Permabull, every coin is undervalued", s:{greed:2,cope:1,chaos:1,brain:0,hope:3}},
      {t:"Doomer, calls every top", s:{greed:0,cope:3,chaos:1,brain:1,hope:0}},
      {t:"Ghost, just lurking", s:{greed:0,cope:1,chaos:0,brain:2,hope:0}},
      {t:"Memer, posting cope all day", s:{greed:0,cope:3,chaos:3,brain:0,hope:1}}
    ]},
  {q:"You finally make a 10x. First move:",
    a:[
      {t:"Hold, looking for 100x", s:{greed:3,cope:0,chaos:2,brain:0,hope:3}},
      {t:"Sell half, take initial out", s:{greed:1,cope:0,chaos:0,brain:3,hope:1}},
      {t:"Sell 100%, screenshot bag", s:{greed:0,cope:2,chaos:0,brain:2,hope:0}},
      {t:"Buy more cause we're going to 50x", s:{greed:3,cope:1,chaos:3,brain:0,hope:3}}
    ]},
  {q:"Your security setup:",
    a:[
      {t:"Hardware wallet, multisig, paranoid", s:{greed:0,cope:0,chaos:0,brain:3,hope:0}},
      {t:"MetaMask, password is 'password'", s:{greed:1,cope:1,chaos:3,brain:0,hope:0}},
      {t:"Seed phrase in Notes app", s:{greed:0,cope:1,chaos:3,brain:0,hope:1}},
      {t:"Wrote it on a napkin somewhere", s:{greed:0,cope:2,chaos:3,brain:0,hope:1}}
    ]},
  {q:"How long do you hold the average bag?",
    a:[
      {t:"Until I die", s:{greed:2,cope:1,chaos:0,brain:0,hope:3}},
      {t:"Until first 2x", s:{greed:0,cope:1,chaos:0,brain:2,hope:0}},
      {t:"Until I panic", s:{greed:0,cope:3,chaos:2,brain:0,hope:0}},
      {t:"Until something shinier appears", s:{greed:1,cope:0,chaos:3,brain:0,hope:1}}
    ]},
  {q:"Best trade of your life was:",
    a:[
      {t:"Researched for weeks, hit perfect", s:{greed:0,cope:0,chaos:0,brain:3,hope:1}},
      {t:"Random degen play that mooned", s:{greed:2,cope:0,chaos:3,brain:0,hope:2}},
      {t:"Pure luck, total accident", s:{greed:0,cope:1,chaos:3,brain:0,hope:1}},
      {t:"What best trade?", s:{greed:0,cope:3,chaos:1,brain:0,hope:0}}
    ]},
  {q:"What does success look like?",
    a:[
      {t:"Generational wealth, family set", s:{greed:1,cope:0,chaos:0,brain:2,hope:3}},
      {t:"Lambo on Instagram", s:{greed:3,cope:1,chaos:1,brain:0,hope:2}},
      {t:"Just breaking even tbh", s:{greed:0,cope:3,chaos:0,brain:1,hope:1}},
      {t:"Beat my friends scores", s:{greed:1,cope:1,chaos:1,brain:0,hope:1}}
    ]}
];

// Real Monshi NFT trait results - mapped to dominant dimensions
var TRAITS = [
  {name:"WHALE TRADER", emoji:"🐋", tagline:"FROM THE TRENCHES TO THE TOP", desc:"You hold through everything. Conviction over comfort. While others paper-handed at -50%, you doubled down. The chart is just noise to you. Generational wealth or generational learning experience — there's no middle option.", match:{greed:3,brain:2,hope:3}},
  {name:"PAPERHANDS", emoji:"📃", tagline:"SOLD THE BOTTOM AGAIN", desc:"You see red and panic. You sell at -10%, watch it 10x without you, then rage tweet. Every. Single. Time. But hey — at least you preserved capital. Sort of. The pattern continues.", match:{cope:3,greed:1,hope:0}},
  {name:"CAFFEINE RAGE", emoji:"☕", tagline:"4 ESPRESSOS DEEP", desc:"Up at 3am refreshing the chart. Everything is a buy signal. Everything is a sell signal. Your portfolio looks like a heart monitor. You're either going to make millions or have a stroke. Possibly both.", match:{chaos:3,cope:2,hope:1}},
  {name:"PROTOCOL NERD", emoji:"🤓", tagline:"READS WHITEPAPERS FOR FUN", desc:"You actually read the docs. You can name 12 different consensus mechanisms. Your trades are based on tokenomics, not vibes. People mock you until your boring picks 50x while their memes go to zero.", match:{brain:3,greed:0,hope:1}},
  {name:"WAGMI SIGNAL", emoji:"🚀", tagline:"PERMABULL ENERGY", desc:"It's always going up next week. The chart bottomed. Sentiment is shifting. Bull market starts Tuesday. You've been right exactly twice in 4 years but the vibes are immaculate. Never selling.", match:{hope:3,greed:1,cope:1}},
  {name:"MOON KNIGHT", emoji:"🌙", tagline:"DARK SIDE OF THE TRADE", desc:"You move in shadows. No tweets. No flexing. Just quiet accumulation while everyone else is panic-posting. When the bag finally hits, only your wallet knows. Mysterious. Effective. Probably ngmi anyway.", match:{brain:2,greed:1,hope:1}},
  {name:"FUNNY PAIN", emoji:"😂", tagline:"LAUGHS TO KEEP FROM CRYING", desc:"Your portfolio is a joke and you tell it best. Memes about your losses go viral. You've made more in retweets than trades. The community loves you. Your wallet does not. Worth it.", match:{cope:3,chaos:2,hope:0}},
  {name:"DEGEN", emoji:"🎰", tagline:"NO THOUGHTS, ONLY APE", desc:"You bought the contract address before reading the name. 'Research' means checking the Telegram for 30 seconds. You're early on everything and rugged on most. But that one 1000x makes it all worth it. Right? Right.", match:{chaos:3,greed:3,brain:0}},
  {name:"DOGE MAXIMALIST", emoji:"🐕", tagline:"MUCH WOW. MANY BAG.", desc:"Memecoins are the only real coin. Bitcoin is for boomers. Ethereum is for nerds. You judge a project by how funny the meme is. So far your strategy has worked. Or you're delusional. Who can say.", match:{hope:3,chaos:2,greed:2}},
  {name:"GOLD BRAIN", emoji:"🧠", tagline:"BUILT DIFFERENT", desc:"You see things others don't. While others chase pumps, you find inefficiencies. While others tweet, you build. While others lose, you compound. People don't understand your strategy and that's exactly the point.", match:{brain:3,greed:1,hope:2}},
  {name:"PANIC SMILE", emoji:"😬", tagline:"INTERNALLY SCREAMING", desc:"On the outside: 'wagmi everything is fine.' On the inside: existential crisis. You smile through dumps, smile through rugs, smile through margin calls. The mask never slips. The anxiety never stops.", match:{cope:3,hope:2,brain:0}},
  {name:"WHALE TRADER (LITE)", emoji:"🦐", tagline:"SHRIMP DREAMS", desc:"You play the same game as the whales but with $50. Every 10x feels like generational wealth. Every -20% feels like rent. The dream stays alive. Someday you'll graduate. Until then, you grind.", match:{hope:2,brain:1,greed:1}}
];

var idx=0, scores={greed:0,cope:0,chaos:0,brain:0,hope:0};

function showIntro(){
  document.getElementById('content').innerHTML = '<div class="intro">'+
    '<p>10 brutally honest questions. Find out which Monshi NFT trait actually represents you.<br><br>Share your result. Match it with a real NFT.</p>'+
    '<button class="startBtn" onclick="startQuiz()">START QUIZ →</button>'+
    '</div>';
}

function startQuiz(){
  idx=0;
  scores={greed:0,cope:0,chaos:0,brain:0,hope:0};
  showQ();
}

function showQ(){
  if(idx>=QUESTIONS.length){return showResult();}
  var q = QUESTIONS[idx];
  var pct = ((idx+1)/QUESTIONS.length)*100;
  var html = '<div class="qBox">'+
    '<div class="qHeader"><div class="qNum">QUESTION '+(idx+1)+'/'+QUESTIONS.length+'</div><div class="progress"><div class="progress-fill" style="width:'+pct+'%;"></div></div></div>'+
    '<div class="qText">'+q.q+'</div>'+
    '<div class="opts" id="opts"></div>'+
    '</div>';
  document.getElementById('content').innerHTML = html;
  var optsEl = document.getElementById('opts');
  q.a.forEach(function(opt){
    var o = document.createElement('div');
    o.className = 'opt';
    o.textContent = opt.t;
    o.onclick = function(){
      Object.keys(opt.s).forEach(function(k){scores[k] += opt.s[k];});
      idx++;
      showQ();
    };
    optsEl.appendChild(o);
  });
}

function showResult(){
  // Find best matching trait
  var best=null, bestScore=-1;
  TRAITS.forEach(function(t){
    var s=0;
    Object.keys(t.match).forEach(function(k){s += Math.min(scores[k]||0, t.match[k]) * 2;});
    if(s>bestScore){bestScore=s;best=t;}
  });
  
  var topDim = Object.keys(scores).sort(function(a,b){return scores[b]-scores[a];})[0];
  
  var html = '<div class="result">'+
    '<div class="rEyebrow">YOUR MONSHI TRAIT IS</div>'+
    '<div style="font-size:64px;margin-bottom:8px;">'+best.emoji+'</div>'+
    '<div class="rTraitName">'+best.name+'</div>'+
    '<div class="rTagline">'+best.tagline+'</div>'+
    '<div class="rDesc">'+best.desc+'</div>'+
    '<div class="rStats">'+
      '<div class="rStat"><div class="v">'+(scores.greed+scores.cope)+'</div><div class="l">DEGEN</div></div>'+
      '<div class="rStat"><div class="v">'+(scores.brain)+'</div><div class="l">GALAXY BRAIN</div></div>'+
      '<div class="rStat"><div class="v">'+(scores.hope+scores.chaos)+'</div><div class="l">CHAOS</div></div>'+
    '</div>'+
    '<div class="rActions">'+
      '<a class="rBtn rBtnX" id="shareBtn" target="_blank">SHARE ON 𝕏</a>'+
      '<a class="rBtn rBtnNFT" href="https://opensea.io/collection/monshi-nft-collection-563194175" target="_blank">FIND THIS NFT 🎴</a>'+
      '<button class="rBtn rBtnRetry" onclick="startQuiz()">TAKE AGAIN</button>'+
    '</div>'+
  '</div>';
  document.getElementById('content').innerHTML = html;
  
  // Wire up share
  var tweet = "I'm a "+best.emoji+" "+best.name+" on @Monshi_Monpad ARCADE\n\n\""+best.tagline+"\"\n\nWhat trait are you? https://monshi.xyz/quiz.html\n\n$MONSHI #Monad";
  document.getElementById('shareBtn').href = 'https://twitter.com/intent/tweet?text='+encodeURIComponent(tweet);
}

showIntro();
</script>
</body>
</html>
