var AC=window.AudioContext||window.webkitAudioContext,actx=null,master=null,musicTimer=null,musicOn=true,beat=0;
function initAudio(){if(actx)return;try{actx=new AC();master=actx.createGain();master.gain.value=0.22;master.connect(actx.destination);}catch(e){}}
function tone(f,t,v,o,d){if(!actx)return;var st=actx.currentTime+(o||0);var os=actx.createOscillator();var g=actx.createGain();os.type=t||'square';os.frequency.setValueAtTime(f,st);g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(v,st+0.01);g.gain.exponentialRampToValueAtTime(0.001,st+d);os.connect(g);g.connect(master);os.start(st);os.stop(st+d+0.05);}

// Input
addEventListener('keydown',function(e){
  if(state==='start'&&e.code==='Space'){reset();initAudio();if(musicOn)startMusic();return;}
  if(state!=='playing')return;
  var k=e.key.toLowerCase();
  if((k==='a'||k==='arrowleft')&&P.lane>0){P.lane--;P.tx=LANES[P.lane];sfxLane();e.preventDefault();}
  else if((k==='d'||k==='arrowright')&&P.lane<2){P.lane++;P.tx=LANES[P.lane];sfxLane();e.preventDefault();}

  initAudio();

  var rect=canvas.getBoundingClientRect();

  else if(x>=BW/2&&P.lane<2){P.lane++;P.tx=LANES[P.lane];sfxLane();}
});

  e.preventDefault();initAudio();

  if(state!=='playing')return;
  var t=e.touches[0];var rect=canvas.getBoundingClientRect();
  var x=(t.clientX-rect.left)/(rect.width/BW);
  if(x<BW/2&&P.lane>0){P.lane--;P.tx=LANES[P.lane];sfxLane();}

  var t='coin';
  if(type<0.06)t='shield';
  else if(type<0.12)t='boost';
  coins.push({lane:lane,x:LANES[lane],y:-30,r:14,type:t});
}

// Drawing
function drawRoad(){
  // Asphalt
  ctx.fillStyle='#0a0015';ctx.fillRect(0,0,BW,BH);
  // Road sides (purple grass/glow)
  var sg=ctx.createLinearGradient(0,0,40,0);
  sg.addColorStop(0,'#1a0040');sg.addColorStop(1,'#0a0015');
  ctx.fillStyle=sg;ctx.fillRect(0,0,40,BH);
  var sg2=ctx.createLinearGradient(BW-40,0,BW,0);
  sg2.addColorStop(0,'#0a0015');sg2.addColorStop(1,'#1a0040');
  ctx.fillStyle=sg2;ctx.fillRect(BW-40,0,40,BH);
  // Lane dividers - dashed white
  roadOff=(roadOff+spd)%50;
  ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=3;ctx.setLineDash([24,26]);
  ctx.beginPath();ctx.moveTo(BW*0.34,-roadOff);ctx.lineTo(BW*0.34,BH);ctx.stroke();
  ctx.beginPath();ctx.moveTo(BW*0.66,-roadOff);ctx.lineTo(BW*0.66,BH);ctx.stroke();
  ctx.setLineDash([]);
  // Edge lines
  ctx.shadowColor='#8B5CF6';ctx.shadowBlur=10;
  ctx.strokeStyle='#8B5CF6';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(40,0);ctx.lineTo(40,BH);ctx.stroke();
  ctx.beginPath();ctx.moveTo(BW-40,0);ctx.lineTo(BW-40,BH);ctx.stroke();
  ctx.shadowBlur=0;
}

function drawCar(c){
  var x=c.x-c.w/2,y=c.y-c.h/2;
  ctx.save();
  // Shadow
  ctx.fillStyle='rgba(0,0,0,.5)';
  ctx.beginPath();ctx.ellipse(c.x,c.y+c.h/2+4,c.w/2,6,0,0,Math.PI*2);ctx.fill();
  // Body gradient
  var g=ctx.createLinearGradient(x,y,x+c.w,y);
  g.addColorStop(0,c.c);g.addColorStop(0.5,c.c);g.addColorStop(1,c.c);
  ctx.fillStyle=c.c;
  ctx.beginPath();ctx.roundRect(x+3,y,c.w-6,c.h,8);ctx.fill();
  // Windshield
  ctx.fillStyle='rgba(0,0,0,.6)';
  ctx.beginPath();ctx.roundRect(x+8,y+10,c.w-16,18,4);ctx.fill();
  // Wheels
  ctx.fillStyle='#000';
  ctx.fillRect(x-2,y+10,5,15);ctx.fillRect(x+c.w-3,y+10,5,15);
  ctx.fillRect(x-2,y+c.h-25,5,15);ctx.fillRect(x+c.w-3,y+c.h-25,5,15);
  // Headlights (top)
  ctx.fillStyle='rgba(255,255,200,.8)';
  ctx.fillRect(x+8,y+2,8,3);ctx.fillRect(x+c.w-16,y+2,8,3);
  // Tail lights (bottom)
  ctx.fillStyle='rgba(255,80,80,.9)';
  ctx.fillRect(x+8,y+c.h-5,8,3);ctx.fillRect(x+c.w-16,y+c.h-5,8,3);
  ctx.restore();
}

function drawPlayerCar(){
  var x=P.x-P.w/2,y=P.y-P.h/2;
  // Boost trail
  if(P.boostT>0){
    for(var i=0;i<5;i++){
      ctx.fillStyle='rgba(74,222,128,'+(0.3-i*0.05)+')';
      ctx.beginPath();ctx.roundRect(x+8+i,y+P.h+i*3,P.w-16-i*2,8,4);ctx.fill();
    }
  }
  // Shield ring
  if(P.shieldT>0){
    ctx.save();ctx.strokeStyle='rgba(96,165,250,'+(0.5+0.4*Math.sin(tick*0.2))+')';ctx.lineWidth=3;
    ctx.shadowColor='#60A5FA';ctx.shadowBlur=15;
    ctx.beginPath();ctx.ellipse(P.x,P.y,P.w/2+8,P.h/2+8,0,0,Math.PI*2);ctx.stroke();ctx.restore();
  }
  ctx.save();
  if(P.flash>0&&Math.floor(tick/3)%2===0){ctx.globalAlpha=0.4;}
  // Shadow
  ctx.fillStyle='rgba(0,0,0,.5)';
  ctx.beginPath();ctx.ellipse(P.x,P.y+P.h/2+4,P.w/2,6,0,0,Math.PI*2);ctx.fill();
  // Purple body
  ctx.shadowColor='#8B5CF6';ctx.shadowBlur=15;
  var g=ctx.createLinearGradient(x,y,x+P.w,y);
  g.addColorStop(0,'#6D28D9');g.addColorStop(0.5,'#A855F7');g.addColorStop(1,'#6D28D9');
  ctx.fillStyle=g;
  ctx.beginPath();ctx.roundRect(x+3,y,P.w-6,P.h,8);ctx.fill();
  ctx.shadowBlur=0;
  // Windshield - Monshi face peeks through
  ctx.fillStyle='rgba(0,0,0,.7)';
  ctx.beginPath();ctx.roundRect(x+8,y+10,P.w-16,22,4);ctx.fill();
  if(face.complete){
    ctx.save();
    ctx.beginPath();ctx.roundRect(x+10,y+11,P.w-20,20,3);ctx.clip();
    ctx.drawImage(face,x+8,y+5,P.w-16,30);
    ctx.restore();
  }
  // Wheels
  ctx.fillStyle='#000';
  ctx.fillRect(x-2,y+10,5,15);ctx.fillRect(x+P.w-3,y+10,5,15);
  ctx.fillRect(x-2,y+P.h-25,5,15);ctx.fillRect(x+P.w-3,y+P.h-25,5,15);
  // Headlights
  ctx.shadowColor='#fff';ctx.shadowBlur=10;
  ctx.fillStyle='rgba(255,255,200,.95)';
  ctx.fillRect(x+8,y+2,8,4);ctx.fillRect(x+P.w-16,y+2,8,4);
  // Tail
  ctx.shadowColor='#EF4444';ctx.shadowBlur=8;
  ctx.fillStyle='#FCA5A5';
  ctx.fillRect(x+8,y+P.h-5,8,3);ctx.fillRect(x+P.w-16,y+P.h-5,8,3);
  ctx.restore();
}

function drawCoin(c){
  var bob=Math.sin(tick*0.1+c.x*0.01)*3;
  ctx.save();
  if(c.type==='coin'){
    ctx.shadowColor='#FCD34D';ctx.shadowBlur=12;
    ctx.fillStyle='#FCD34D';
    ctx.beginPath();ctx.arc(c.x,c.y+bob,c.r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#92400E';ctx.font='bold 16px Orbitron';ctx.textAlign='center';
    ctx.fillText('$',c.x,c.y+bob+5);ctx.textAlign='left';
  }else if(c.type==='shield'){
    ctx.shadowColor='#60A5FA';ctx.shadowBlur=15;
    ctx.fillStyle='#60A5FA';
    ctx.beginPath();ctx.arc(c.x,c.y+bob,c.r+2,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 13px Orbitron';ctx.textAlign='center';
    ctx.fillText('🛡',c.x,c.y+bob+5);ctx.textAlign='left';
  }else if(c.type==='boost'){
    ctx.shadowColor='#22C55E';ctx.shadowBlur=15;
    ctx.fillStyle='#22C55E';
    ctx.beginPath();ctx.arc(c.x,c.y+bob,c.r+2,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='bold 13px Orbitron';ctx.textAlign='center';
    ctx.fillText('⚡',c.x,c.y+bob+5);ctx.textAlign='left';
  }
  ctx.restore();
}

function explode(x,y,col){
  for(var i=0;i<14;i++){
    var a=Math.random()*Math.PI*2,s=rnd(2,6);
    particles.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,r:rnd(2,5),c:col});
  }
}

function update(){
  tick++;
  // Smooth lane move
  P.x+=(P.tx-P.x)*0.25;
  // Speed scales with distance, capped
  spd=Math.min(4+distance*0.0008+(P.boostT>0?5:0),16);
  distance+=spd*0.8;
  score=Math.floor(distance/10);
  // Spawn rates
  if(tick%Math.max(20,40-Math.floor(distance/300))===0)spawnTraffic();
  if(tick%70===0)spawnCoin();
  // Move traffic
  for(var i=traffic.length-1;i>=0;i--){
    var t=traffic[i];t.y+=t.vy+spd*0.4;
    if(t.y>BH+100){traffic.splice(i,1);score+=2;continue;}
    // Collision
    if(P.flash<=0&&Math.abs(t.y-P.y)<(t.h/2+P.h/2-10)&&Math.abs(t.x-P.x)<(t.w/2+P.w/2-8)){
      if(P.shieldT>0){
        P.shieldT=0;explode(t.x,t.y,'#60A5FA');
        traffic.splice(i,1);P.flash=20;sfxBoost();continue;
      }
      die();return;
    }
  }
  // Coins
  for(var i=coins.length-1;i>=0;i--){
    var c=coins[i];c.y+=spd*0.9;
    if(c.y>BH+30){coins.splice(i,1);continue;}
    var d=Math.sqrt((c.x-P.x)*(c.x-P.x)+(c.y-P.y)*(c.y-P.y));
    if(d<P.w/2+c.r){
      if(c.type==='coin'){score+=50;explode(c.x,c.y,'#FCD34D');}
      else if(c.type==='shield'){P.shieldT=300;explode(c.x,c.y,'#60A5FA');}
      else if(c.type==='boost'){P.boostT=120;explode(c.x,c.y,'#22C55E');}
      sfxCoin();coins.splice(i,1);
    }
  }
  // Particles
  for(var i=particles.length-1;i>=0;i--){
    var p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vx*=0.94;p.vy*=0.94;p.life-=0.04;
    if(p.life<=0)particles.splice(i,1);
  }
  if(P.shieldT>0)P.shieldT--;
  if(P.boostT>0)P.boostT--;
  if(P.flash>0)P.flash--;
}

function die(){
  state='dead';sfxCrash();stopMusic();lastScore=score;lastDist=Math.floor(distance);
  if(score>best){best=score;localStorage.setItem('racer_best',best);}
  explode(P.x,P.y,'#EF4444');for(var i=0;i<25;i++){var a=Math.random()*Math.PI*2,s=rnd(3,8);particles.push({x:P.x,y:P.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1.5,r:rnd(3,6),c:'#EF4444'});}
  if(playerName)submitScore(score);else showDeathNoSubmit();
}

function drawHUD(){
  ctx.fillStyle='rgba(0,0,0,.55)';ctx.beginPath();ctx.roundRect(12,12,150,46,8);ctx.fill();
  ctx.strokeStyle='rgba(139,92,246,.4)';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(12,12,150,46,8);ctx.stroke();
  ctx.save();ctx.shadowColor='#8B5CF6';ctx.shadowBlur=10;
  ctx.fillStyle='#fff';ctx.font='900 22px Orbitron,sans-serif';ctx.fillText(score,20,40);ctx.restore();
  ctx.fillStyle='rgba(167,139,250,.6)';ctx.font='700 9px Space Mono,monospace';ctx.fillText('SCORE',20,53);

  ctx.fillStyle='rgba(0,0,0,.55)';ctx.beginPath();ctx.roundRect(BW-118,12,106,46,8);ctx.fill();
  ctx.strokeStyle='rgba(74,222,128,.4)';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(BW-118,12,106,46,8);ctx.stroke();
  ctx.fillStyle='#4ADE80';ctx.font='900 18px Orbitron,sans-serif';ctx.fillText(spd.toFixed(1)+'x',BW-110,40);
  ctx.fillStyle='rgba(74,222,128,.5)';ctx.font='700 9px Space Mono,monospace';ctx.fillText('SPEED',BW-110,53);

  // Power-up indicators
  if(P.shieldT>0){ctx.fillStyle='rgba(96,165,250,.8)';ctx.font='700 11px Orbitron';ctx.fillText('🛡 '+Math.ceil(P.shieldT/60)+'s',BW/2-30,40);}
  if(P.boostT>0){ctx.fillStyle='rgba(74,222,128,.9)';ctx.font='700 11px Orbitron';ctx.fillText('⚡ BOOST',BW/2-30,55);}

  ctx.fillStyle='rgba(255,255,255,.16)';ctx.font='700 9px Space Mono,monospace';ctx.textAlign='right';ctx.fillText('a KING PETTY build',BW-12,BH-10);ctx.textAlign='left';
}

function drawStart(){
  ctx.fillStyle='rgba(0,0,8,.7)';ctx.fillRect(0,0,BW,BH);
  ctx.save();ctx.shadowColor='#8B5CF6';ctx.shadowBlur=30;
  ctx.fillStyle='#EDE9FF';ctx.font='900 50px Orbitron,sans-serif';ctx.textAlign='center';
  ctx.fillText('MONSHI',BW/2,BH/2-50);ctx.restore();
  ctx.save();ctx.shadowColor='#22C55E';ctx.shadowBlur=20;
  ctx.fillStyle='#4ADE80';ctx.font='900 36px Orbitron,sans-serif';
  ctx.fillText('HIGHWAY',BW/2,BH/2-10);ctx.restore();
  ctx.fillStyle='rgba(196,181,253,.7)';ctx.font='700 13px Space Mono,monospace';
  ctx.fillText('Switch lanes — dodge cars',BW/2,BH/2+30);
  ctx.fillText('A/D • ARROWS • TAP SIDES',BW/2,BH/2+50);
  var pulse=0.5+0.5*Math.sin(tick*0.1);
  ctx.fillStyle='rgba(74,222,128,'+pulse+')';ctx.font='700 16px Orbitron,sans-serif';
  ctx.fillText('TAP / SPACE TO PLAY',BW/2,BH/2+90);
  ctx.fillStyle='#FCD34D';ctx.font='700 12px Space Mono,monospace';
  ctx.fillText('BEST: '+best,BW/2,BH/2+125);
  ctx.textAlign='left';
}

function sbH(){return{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=representation'};}
function fetchLeaderboard(){fetch(SUPABASE_URL+'/rest/v1/scores_racer?select=name,score&order=score.desc&limit=10',{headers:sbH()}).then(function(r){return r.json();}).then(function(d){if(Array.isArray(d))leaderboard=d;}).catch(function(){});}
function submitScore(sc){fetch(SUPABASE_URL+'/rest/v1/scores_racer',{method:'POST',headers:sbH(),body:JSON.stringify({name:playerName,score:Math.floor(sc)})}).then(function(){return fetch(SUPABASE_URL+'/rest/v1/scores_racer?select=name,score&order=score.desc&limit=10',{headers:sbH()});}).then(function(r){return r.json();}).then(function(d){if(Array.isArray(d)){leaderboard=d;playerRank=leaderboard.findIndex(function(s){return s.name===playerName&&s.score===Math.floor(sc);})+1;renderDeath(sc);}}).catch(function(){renderDeath(sc);});}
function showDeathNoSubmit(){document.getElementById('nameSubmit').style.display='block';document.getElementById('dNameInput').value='';renderDeath(lastScore);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function renderDeath(sc){
  if(playerName)document.getElementById('nameSubmit').style.display='none';
  document.getElementById('dScore').textContent=sc;
  document.getElementById('dBest').textContent=best;
  document.getElementById('lvlTag').textContent='DROVE '+lastDist+'M';
  document.getElementById('rankTag').textContent=playerRank>0?'YOU PLACED #'+playerRank+' GLOBALLY':'';
  var tbody=document.getElementById('lbBody');tbody.innerHTML='';
  leaderboard.slice(0,6).forEach(function(s,i){var tr=document.createElement('tr');var isMe=s.name===playerName&&s.score===Math.floor(sc);if(isMe)tr.className='me';var medal=['🥇','🥈','🥉'][i]||'#'+(i+1);tr.innerHTML='<td class="rank">'+medal+'</td><td>'+esc(s.name)+'</td><td class="sc">'+s.score+'</td>';tbody.appendChild(tr);});
  document.getElementById('deathPanel').classList.add('show');
}
document.getElementById('dSubmit').addEventListener('click',function(){var n=document.getElementById('dNameInput').value.trim();playerName=(n||'ANON').toUpperCase().slice(0,16);localStorage.setItem('monshi_name',playerName);document.getElementById('nameSubmit').style.display='none';submitScore(lastScore);});
document.getElementById('dNameInput').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('dSubmit').click();});
document.getElementById('btnShare').addEventListener('click',function(){var tweet='I scored '+lastScore+' driving '+lastDist+'m on MONSHI HIGHWAY 🏎️ '+('https://monshi.xyz/api/share?game=MONSHI%20HIGHWAY&score='+lastScore+'&name='+encodeURIComponent(playerName||'ANON')+'&rank='+(typeof playerRank!=='undefined'?playerRank:'')+'&goto='+encodeURIComponent(GAME_URL))+' $MONSHI #Monad';window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(tweet),'_blank');});
document.getElementById('btnBuy').addEventListener('click',function(){window.open(BUY_URL,'_blank');});
document.getElementById('btnRetry').addEventListener('click',function(){document.getElementById('deathPanel').classList.remove('show');reset();initAudio();if(musicOn)startMusic();});
fetchLeaderboard();

function loop(){
  requestAnimationFrame(loop);
  drawRoad();
  if(state==='playing')update();
  else tick++;
  coins.forEach(drawCoin);
  traffic.forEach(drawCar);
  drawPlayerCar();
  particles.forEach(function(p){var rgba=p.c==='#FCD34D'?'252,211,77':p.c==='#22C55E'?'34,197,94':p.c==='#60A5FA'?'96,165,250':'239,68,68';ctx.fillStyle='rgba('+rgba+','+p.life+')';ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);ctx.fill();});
  drawHUD();
  if(state==='start')drawStart();
}
loop();
</script></body></html>
