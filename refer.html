<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#A855F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" href="/favicon.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>REFERRALS — MONSHI ARCADE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:wght@400;700&family=JetBrains+Mono&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#02000a;font-family:'Space Mono',monospace;color:#fff;padding:30px 20px;}
.wrap{max-width:840px;margin:0 auto;}
.bk{display:inline-block;color:rgba(139,92,246,.7);text-decoration:none;font-size:11px;letter-spacing:1.5px;background:rgba(0,0,0,.5);padding:6px 12px;border-radius:8px;border:1px solid rgba(139,92,246,.2);margin-bottom:24px;}
h1{font-family:Orbitron,sans-serif;font-size:clamp(36px,7vw,64px);font-weight:900;background:linear-gradient(135deg,#22C55E,#A855F7);background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:5px;text-align:center;margin-bottom:6px;}
.subt{text-align:center;color:rgba(196,181,253,.65);letter-spacing:3px;margin-bottom:30px;font-size:11px;}
.card{padding:24px;background:rgba(20,5,50,.6);border:1.5px solid rgba(139,92,246,.3);border-radius:14px;margin-bottom:18px;}
.cardTitle{font-family:Orbitron,sans-serif;font-size:13px;color:#A855F7;letter-spacing:3px;margin-bottom:14px;text-shadow:0 0 10px rgba(168,85,247,.4);}
.linkBox{display:flex;gap:8px;margin-bottom:14px;}
.linkInput{flex:1;background:rgba(0,0,0,.5);border:1.5px solid rgba(139,92,246,.4);border-radius:8px;padding:12px 14px;color:#4ADE80;font-family:'JetBrains Mono',monospace;font-size:12px;outline:none;letter-spacing:0;overflow:hidden;text-overflow:ellipsis;}
.copyBtn{padding:12px 18px;background:linear-gradient(135deg,#22C55E,#15803D);color:#fff;border:none;border-radius:8px;font-family:Orbitron,sans-serif;font-size:11px;font-weight:900;letter-spacing:2px;cursor:pointer;}
.copyBtn.copied{background:#4ADE80;color:#000;}
.shareGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:10px;}
.shareBtn{padding:11px;border:none;border-radius:8px;font-family:Orbitron,sans-serif;font-size:10px;font-weight:900;letter-spacing:1.5px;cursor:pointer;color:#fff;text-decoration:none;text-align:center;display:block;}
.shareX{background:linear-gradient(135deg,#1DA1F2,#0d7abf);}
.shareTG{background:linear-gradient(135deg,#0088CC,#005580);}
.shareCopy{background:linear-gradient(135deg,#A855F7,#7C3AED);}

.statsRow{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px;}
.stat{background:rgba(0,0,0,.3);border:1px solid rgba(139,92,246,.25);border-radius:10px;padding:16px;text-align:center;}
.stat .v{font-family:Orbitron,sans-serif;font-size:24px;font-weight:900;color:#fff;}
.stat .l{font-size:9px;color:rgba(167,139,250,.6);letter-spacing:1.5px;margin-top:4px;}

.connectPrompt{text-align:center;padding:40px 20px;}
.connectBtn{padding:16px 32px;background:linear-gradient(135deg,#22C55E,#15803D);color:#fff;border:none;border-radius:12px;font-family:Orbitron,sans-serif;font-size:14px;font-weight:900;letter-spacing:3px;cursor:pointer;animation:pulse 2.5s infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.5);}50%{box-shadow:0 0 0 12px rgba(34,197,94,0);}}

.lbCard{background:rgba(20,5,50,.6);border:1.5px solid rgba(252,211,77,.3);border-radius:14px;padding:22px;}
.lbTitle{font-family:Orbitron,sans-serif;font-size:13px;color:#FCD34D;letter-spacing:3px;margin-bottom:14px;text-align:center;}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:8px;margin-bottom:5px;border:1px solid rgba(139,92,246,.15);background:rgba(0,0,0,.2);}
.row.gold{background:linear-gradient(90deg,rgba(252,211,77,.15),transparent);border-color:rgba(252,211,77,.4);}
.row.me{background:rgba(74,222,128,.1);border-color:rgba(74,222,128,.4);}
.rank{font-family:Orbitron,sans-serif;font-size:16px;font-weight:900;width:36px;text-align:center;color:rgba(167,139,250,.5);}
.row.gold .rank{color:#FCD34D;}
.who{flex:1;font-family:Orbitron,sans-serif;font-size:12px;color:#fff;font-weight:700;}
.cnt{font-family:Orbitron,sans-serif;font-size:18px;font-weight:900;color:#4ADE80;}
.empty{text-align:center;padding:30px;color:rgba(139,92,246,.5);font-size:11px;letter-spacing:1.5px;}
.howBox{padding:18px;background:rgba(74,222,128,.06);border:1px solid rgba(74,222,128,.2);border-radius:10px;font-size:11px;color:rgba(220,210,255,.75);text-align:center;line-height:1.7;letter-spacing:.5px;margin-top:14px;}
.kingP{position:fixed;bottom:6px;right:10px;font-size:9px;color:rgba(255,255,255,.18);letter-spacing:1.5px;}
</style>
</head>
<body>
<div class="wrap">
<a class="bk" href="/">← ARCADE</a>
<h1>REFER & EARN</h1>
<div class="subt">RECRUIT THE TRENCHES · TOP REFERRERS GET FUTURE PERKS</div>

<div id="content"></div>
</div>

<script src="/monshi-shared.js"></script>
<script src="/referral-track.js" defer></script>
<script src="/prize-banner.js" defer></script>
<script src="/pwa-install.js" defer></script>
<div class="kingP">a KING PETTY build</div>

<script>
var SUPABASE_URL='https://cuqhqcmrgpdjlhyqztnc.supabase.co';
var SUPABASE_KEY='sb_publishable_nu-E2mvgdQ0l1DsSsOswWA_ma2RbV4z';

function shortAddr(a){return a.slice(0,6)+'...'+a.slice(-4);}

function render(){
  var c = document.getElementById('content');
  if(!window.MONSHI || !MONSHI.wallet){
    c.innerHTML = '<div class="card"><div class="connectPrompt">'+
      '<div style="font-size:48px;margin-bottom:14px;">🤝</div>'+
      '<div style="font-family:Orbitron,sans-serif;font-size:18px;color:#A855F7;letter-spacing:2px;margin-bottom:10px;">CONNECT WALLET TO GET YOUR LINK</div>'+
      '<div style="font-size:12px;color:rgba(196,181,253,.7);margin-bottom:24px;letter-spacing:1px;line-height:1.6;">Each wallet gets a unique referral link. When someone joins through your link, they\\'re tagged to you forever.</div>'+
      '<button class="connectBtn" onclick="MONSHI.connectWallet().then(function(){setTimeout(render,1200);});">🔌 CONNECT WALLET</button>'+
      '</div></div>';
    return;
  }
  
  var refLink = window.location.origin+'/?ref='+MONSHI.wallet;
  var displayLink = window.location.host+'/?ref='+MONSHI.wallet.slice(0,6)+'...'+MONSHI.wallet.slice(-4);
  
  var html = '<div class="card">'+
    '<div class="cardTitle">🔗 YOUR REFERRAL LINK</div>'+
    '<div class="linkBox">'+
      '<input class="linkInput" id="refLink" value="'+refLink+'" readonly>'+
      '<button class="copyBtn" id="copyBtn">COPY</button>'+
    '</div>'+
    '<div class="shareGrid">'+
      '<a class="shareBtn shareX" id="xShare" target="_blank">𝕏 SHARE</a>'+
      '<a class="shareBtn shareTG" id="tgShare" target="_blank">📱 TELEGRAM</a>'+
      '<button class="shareBtn shareCopy" id="copyBtn2">📋 COPY LINK</button>'+
    '</div>'+
  '</div>'+
  
  '<div class="card">'+
    '<div class="cardTitle">📊 YOUR STATS</div>'+
    '<div class="statsRow">'+
      '<div class="stat"><div class="v" id="myRefs">--</div><div class="l">RECRUITS</div></div>'+
      '<div class="stat"><div class="v" id="myRank">--</div><div class="l">YOUR RANK</div></div>'+
      '<div class="stat"><div class="v" id="myEarned">--</div><div class="l">FUTURE BONUS</div></div>'+
    '</div>'+
  '</div>'+
  
  '<div class="lbCard">'+
    '<div class="lbTitle">🏆 TOP RECRUITERS</div>'+
    '<div id="lbList" class="empty">Loading...</div>'+
    '<div class="howBox">'+
      '<b style="color:#4ADE80;">HOW IT WORKS:</b> Share your link. When wallets connect through it, they\\'re permanently tagged as your recruit. Top recruiters at launch milestones get $MONSHI airdrops, NFT mints, and tier upgrades. Currently tracking — rewards coming.'+
    '</div>'+
  '</div>';
  
  c.innerHTML = html;
  
  // Wire up handlers
  function copyText(){
    navigator.clipboard.writeText(refLink).then(function(){
      var b = document.getElementById('copyBtn');
      b.textContent = 'COPIED!';
      b.classList.add('copied');
      setTimeout(function(){b.textContent='COPY';b.classList.remove('copied');},1500);
    });
  }
  document.getElementById('copyBtn').onclick = copyText;
  document.getElementById('copyBtn2').onclick = copyText;
  
  var msg = "Just found this Monad arcade with 27 games and live $MONSHI tracking 🎮\\n\\nUse my link if you join — building the trenches together:\\n";
  document.getElementById('xShare').href = 'https://twitter.com/intent/tweet?text='+encodeURIComponent(msg + refLink + '\\n\\n$MONSHI #Monad');
  document.getElementById('tgShare').href = 'https://t.me/share/url?url='+encodeURIComponent(refLink)+'&text='+encodeURIComponent(msg);
  
  loadRefs();
}

async function loadRefs(){
  try{
    var r = await fetch(SUPABASE_URL+'/rest/v1/referrals?select=referrer_wallet,referrer_name,referred_wallet&limit=2000',{headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}});
    var data = await r.json();
    if(!Array.isArray(data))data=[];
    
    // Count by referrer
    var counts = {};
    data.forEach(function(d){
      var w = d.referrer_wallet.toLowerCase();
      if(!counts[w])counts[w]={wallet:w, name:d.referrer_name, count:0};
      counts[w].count++;
    });
    var sorted = Object.values(counts).sort(function(a,b){return b.count-a.count;});
    
    var myW = MONSHI.wallet.toLowerCase();
    var myStats = counts[myW] || {count:0};
    var myRankIdx = sorted.findIndex(function(s){return s.wallet===myW;});
    
    document.getElementById('myRefs').textContent = myStats.count;
    document.getElementById('myRank').textContent = myRankIdx>=0 ? '#'+(myRankIdx+1) : '--';
    document.getElementById('myEarned').textContent = myStats.count > 0 ? '✨' : '0';
    
    var list = document.getElementById('lbList');
    if(sorted.length===0){list.innerHTML='<div class="empty">Be the first to recruit 🚀</div>';return;}
    list.className='';
    list.innerHTML='';
    sorted.slice(0,15).forEach(function(p,i){
      var rowClass = i===0?'gold':'';
      if(p.wallet===myW)rowClass+=' me';
      var medal = ['🥇','🥈','🥉'][i] || '#'+(i+1);
      var row = document.createElement('div');
      row.className='row '+rowClass;
      row.innerHTML='<div class="rank">'+medal+'</div><div class="who">'+(p.name||shortAddr(p.wallet))+'</div><div class="cnt">'+p.count+'</div>';
      list.appendChild(row);
    });
  }catch(e){console.log('refs err',e);}
}

setTimeout(render,500);
window.addEventListener('monshi:connect', function(){setTimeout(render,1200);});
</script>
</body>
</html>
