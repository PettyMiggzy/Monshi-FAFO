<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">

<title>$RENE · TREAT RUN</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;background:#0a0418;overflow:hidden;font-family:'Space Mono',monospace;color:#EDE9FF;display:flex;align-items:center;justify-content:center;user-select:none;}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 100%,rgba(168,85,247,.18),transparent 70%);z-index:-1;pointer-events:none;}
#hubBtn{position:fixed;top:8px;left:8px;z-index:7;color:rgba(168,85,247,.85);text-decoration:none;font-size:11px;letter-spacing:1.5px;background:rgba(0,0,0,.5);padding:7px 12px;border-radius:8px;border:1px solid rgba(168,85,247,.3);font-family:Orbitron,sans-serif;font-weight:700;}
.game{display:flex;flex-direction:column;align-items:center;gap:10px;width:min(440px,94vw);padding:14px 0;}
.title{font-family:Orbitron,sans-serif;font-size:22px;font-weight:900;letter-spacing:3px;color:#FCD34D;text-shadow:0 0 18px rgba(252,211,77,.5);text-align:center;}
.title .sub{display:block;font-size:9px;color:rgba(252,211,77,.6);letter-spacing:2px;margin-top:3px;}
.hud{display:flex;gap:8px;width:100%;font-family:Orbitron,sans-serif;}
.hud-cell{flex:1;padding:8px 4px;background:rgba(20,5,50,.7);border:1px solid rgba(168,85,247,.3);border-radius:9px;text-align:center;}
.hud-cell .v{font-size:16px;color:#fff;font-weight:900;line-height:1;}
.hud-cell .l{font-size:8px;color:rgba(167,139,250,.65);letter-spacing:1.3px;margin-top:4px;font-weight:700;}
.hud-cell.treats .v{color:#FCD34D;}
.hud-cell.dist .v{color:#4ADE80;}
.stage{width:100%;aspect-ratio:1.4/1;background:linear-gradient(to bottom,#0a0418 0%,#1a0f33 60%,#2a1a4d 100%);border:1.5px solid rgba(168,85,247,.4);border-radius:14px;position:relative;overflow:hidden;box-shadow:0 0 24px rgba(168,85,247,.2);}
canvas{width:100%;height:100%;display:block;cursor:pointer;}
.mult-badge{position:absolute;top:8px;right:8px;font-family:Orbitron,sans-serif;font-size:10px;color:#A855F7;background:rgba(0,0,0,.7);padding:4px 9px;border-radius:6px;border:1px solid rgba(168,85,247,.4);letter-spacing:1px;z-index:4;pointer-events:none;}
.tap-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:Orbitron,sans-serif;font-size:18px;color:#FCD34D;letter-spacing:3px;text-shadow:0 0 16px rgba(252,211,77,.6),0 2px 4px rgba(0,0,0,.8);z-index:5;pointer-events:none;text-align:center;font-weight:900;}
.tap-hint.hide{display:none;}
.tap-hint .small{font-size:10px;color:rgba(220,210,255,.8);letter-spacing:2px;display:block;margin-top:8px;font-weight:700;}
.prompt{font-size:11px;color:rgba(196,181,253,.85);letter-spacing:1.5px;text-align:center;min-height:16px;font-weight:700;}
.btn-secondary{padding:13px 22px;background:linear-gradient(135deg,#FCD34D,#F59E0B);border:none;border-radius:10px;color:#000;font-family:Orbitron,sans-serif;font-size:13px;font-weight:900;cursor:pointer;letter-spacing:2px;box-shadow:0 0 18px rgba(252,211,77,.4);}
.btn-secondary:active{transform:scale(.97);}
.death{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,8,.92);z-index:8;backdrop-filter:blur(5px);padding:20px;}
.death.show{display:flex;}
.deathCard{background:linear-gradient(135deg,rgba(168,85,247,.18),rgba(20,5,50,.85));border:1.5px solid rgba(168,85,247,.5);border-radius:18px;padding:20px;width:min(440px,94vw);max-height:90vh;overflow-y:auto;text-align:center;box-shadow:0 0 40px rgba(168,85,247,.4);}
.dEmoji{font-size:42px;margin-bottom:6px;}
.rugged{font-family:Orbitron,sans-serif;font-size:28px;font-weight:900;color:#FCA5A5;text-shadow:0 0 22px #EF4444;margin-bottom:6px;letter-spacing:2px;}
.rugged.win{color:#4ADE80;text-shadow:0 0 22px #22C55E;}
.scoreNum{font-family:Orbitron,sans-serif;font-size:32px;color:#FCD34D;margin:6px 0;text-shadow:0 0 14px rgba(252,211,77,.5);}
.lbl{font-size:10px;color:rgba(167,139,250,.65);letter-spacing:1.5px;margin-bottom:12px;}
#nameSubmit{margin-bottom:14px;display:none;}
#nameSubmit input{background:rgba(0,0,0,.5);border:1.5px solid rgba(168,85,247,.5);border-radius:8px;padding:9px 12px;color:#fff;font-family:'Space Mono',monospace;font-size:13px;outline:none;text-align:center;letter-spacing:2px;width:160px;}
#nameSubmit button{margin-left:6px;padding:9px 16px;background:linear-gradient(135deg,#A855F7,#7C3AED);border:none;border-radius:8px;color:#fff;font-family:Orbitron,sans-serif;font-size:11px;font-weight:900;cursor:pointer;letter-spacing:1px;}
#btnRow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px;}
.btn{padding:10px 14px;border:none;border-radius:8px;font-family:Orbitron,sans-serif;font-size:11px;font-weight:900;cursor:pointer;letter-spacing:1.5px;color:#fff;}
#btnRetry{background:linear-gradient(135deg,#A855F7,#5B21B6);}
#btnHub{background:linear-gradient(135deg,#374151,#1F2937);}
#btnShare{background:linear-gradient(135deg,#1DA1F2,#0d7abf);}
#btnBuy{background:linear-gradient(135deg,#22C55E,#15803D);animation:pls 2s infinite;}
@keyframes pls{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.5);}50%{box-shadow:0 0 0 8px rgba(34,197,94,0);}}
.lbT{width:100%;border-collapse:collapse;margin:14px 0 6px;font-size:11px;}
.lbT th{color:rgba(168,85,247,.7);text-align:left;padding:4px 6px;border-bottom:1px solid rgba(168,85,247,.3);font-size:9px;letter-spacing:1.5px;font-family:Orbitron,sans-serif;}
.lbT td{padding:5px 6px;color:rgba(220,210,255,.8);}
.lbT tr.me td{color:#FCD34D;background:rgba(252,211,77,.08);}
.lbT .sc{text-align:right;font-family:Orbitron,sans-serif;font-weight:700;}
.boost-tag{font-size:10px;color:#A855F7;letter-spacing:1.5px;margin-top:4px;font-family:Orbitron,sans-serif;font-weight:700;}
</style>
</head>
<body>
<a href="/rene-hub.html" id="hubBtn">← RENE HUB</a>
<div class="game">
  <div class="title">TREAT RUN <span class="sub">TAP TO HOP · GRAB 🦴 · DODGE THE PAW</span></div>
  <div class="hud">
    <div class="hud-cell dist"><div class="v" id="hudDist">0</div><div class="l">DISTANCE</div></div>
    <div class="hud-cell treats"><div class="v" id="hudTreats">0</div><div class="l">🦴 TREATS</div></div>
    <div class="hud-cell"><div class="v" id="hudScore">0</div><div class="l">SCORE</div></div>
  </div>
  <div class="stage">
    <div class="mult-badge" id="multBadge">1.0x</div>
    <canvas id="run"></canvas>
    <div class="tap-hint" id="tapHint">TAP TO HOP<br><span class="small">DODGE 📉 🛁 🧹 · GRAB 🦴</span></div>
  </div>
  <div class="prompt" id="prompt">CTO MODE · SHOW THEM THE PAW</div>
  <button class="btn-secondary" id="btnStart">▶ START RUN</button>
</div>
<div class="death" id="deathPanel">
  <div class="deathCard">
    <div class="dEmoji" id="dEmoji">🐾</div>
    <div class="rugged" id="ruggedTitle">PAW'D</div>
    <div class="scoreNum" id="dScore">0</div>
    <div class="lbl" id="lvlTag"></div>
    <div class="boost-tag" id="boostTag"></div>
    <div class="lbl" id="rankTag" style="color:#4ADE80;"></div>
    <div id="nameSubmit">
      <p style="color:rgba(196,181,253,.7);font-size:10px;letter-spacing:1.5px;margin-bottom:8px;">SUBMIT TO LEADERBOARD</p>
      <div style="display:flex;gap:6px;justify-content:center;">
        <input id="dNameInput" type="text" maxlength="16" placeholder="YOUR NAME">
        <button id="dSubmit">GO</button>
      </div>
    </div>
    <table class="lbT"><thead><tr><th>#</th><th>PLAYER</th><th class="sc">SCORE</th></tr></thead><tbody id="lbBody"></tbody></table>
    <div id="btnRow">
      <button class="btn" id="btnShare">SHARE 𝕏</button>
      <button class="btn" id="btnBuy">BUY $RENE</button>
      <button class="btn" id="btnRetry">RETRY</button>
      <button class="btn" id="btnHub">HUB</button>
    </div>
  </div>
</div>
<script src="/monshi-shared.js"></script>
<script src="/rene-shared.js"></script>
<script>
var TABLE='scores_rene_run', BUY_URL='https://nad.fun/tokens/0xaCA86430cCCEdbedB35910fC8A5AFEF07dA37777';
var PLAY_URL='https://monshi-fafo.vercel.app/rene-run.html';

// Preload sprites
var SPRITES = {
  run: ['run2_01','run2_02','run2_03','run2_04'].map(function(n){return '/public/rene/sprites/run_2leg/'+n+'.png';}),
  jumpRise: '/public/rene/sprites/jump/jump_02_rise.png',
  jumpPeak: '/public/rene/sprites/jump/jump_03_peak.png',
  jumpFall: '/public/rene/sprites/jump/jump_04_descend.png'
};
var imgs = {};
['run','jumpRise','jumpPeak','jumpFall'].forEach(function(k){
  if(Array.isArray(SPRITES[k])){
    imgs[k] = SPRITES[k].map(function(src){var i=new Image();i.src=src;return i;});
  } else {
    imgs[k] = new Image();
    imgs[k].src = SPRITES[k];
  }
});

// Audio
var AC=window.AudioContext||window.webkitAudioContext, actx=null, master=null;
function initAudio(){if(actx)return;try{actx=new AC();master=actx.createGain();master.gain.value=.22;master.connect(actx.destination);}catch(e){}}
function tone(f,t,v,o,d){if(!actx)return;var st=actx.currentTime+(o||0);var os=actx.createOscillator();var g=actx.createGain();os.type=t||'square';os.frequency.setValueAtTime(f,st);g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(v,st+.01);g.gain.exponentialRampToValueAtTime(.001,st+d);os.connect(g);g.connect(master);os.start(st);os.stop(st+d+.05);}
function sfxJump(){tone(660,'square',.18,0,.08);tone(880,'square',.12,.05,.08);}
function sfxTreat(){tone(1046,'square',.16,0,.06);tone(1568,'square',.14,.06,.08);}
function sfxHurt(){tone(140,'sawtooth',.28,0,.22);tone(80,'sawtooth',.22,.05,.18);}

// Canvas
var canvas = document.getElementById('run');
var ctx = canvas.getContext('2d');
var W=640, H=460, GROUND_Y=H-70;
function fitCanvas(){
  var dpr=window.devicePixelRatio||1;
  var rect=canvas.getBoundingClientRect();
  canvas.width=Math.floor(rect.width*dpr);
  canvas.height=Math.floor(rect.height*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  W=rect.width; H=rect.height; GROUND_Y=H-50;
}
window.addEventListener('resize', fitCanvas);

// State
var state, player, obstacles, treats, particles;

function reset(){
  state = {
    running:false, gameOver:false,
    distance:0, treats:0, score:0,
    speed:5, spawnTimer:90, treatTimer:50,
    runFrame:0, frameCounter:0,
    lastT:0
  };
  player = {x:W*0.18, y:GROUND_Y, vy:0, w:64, h:64, grounded:true, flash:0};
  obstacles = [];
  treats = [];
  particles = [];
}

function updateHUD(){
  document.getElementById('hudDist').textContent = Math.floor(state.distance);
  document.getElementById('hudTreats').textContent = state.treats;
  document.getElementById('hudScore').textContent = state.score;
  document.getElementById('multBadge').textContent = (window.RENE ? RENE.getMultiplier().toFixed(1) : '1.0') + 'x';
}

function jump(){
  if(state.gameOver || !state.running)return;
  initAudio();
  if(player.grounded){
    player.vy = -13;
    player.grounded = false;
    sfxJump();
  }
}

// Obstacle types
function spawnObstacle(){
  var types = [
    {emoji:'📉', w:42, h:64, color:'#EF4444', y:GROUND_Y-14, label:'redCandle'},
    {emoji:'🛁', w:60, h:36, color:'#60A5FA', y:GROUND_Y-2, label:'bath'},
    {emoji:'🧹', w:48, h:54, color:'#A78BFA', y:GROUND_Y-10, label:'vacuum'}
  ];
  var t = types[Math.floor(Math.random()*types.length)];
  obstacles.push({
    x:W+30, y:t.y-t.h/2, w:t.w, h:t.h,
    color:t.color, emoji:t.emoji, label:t.label
  });
}
function spawnTreat(){
  var ground = Math.random()<.4;
  treats.push({
    x:W+30, y: ground ? GROUND_Y-22 : GROUND_Y-80-Math.random()*40,
    w:28, h:28, taken:false
  });
}

function drawBackground(){
  // far parallax — purple peaks
  ctx.fillStyle = 'rgba(124,58,237,.15)';
  var off = (state.distance*.3) % 200;
  for(var x=-200;x<W+200;x+=200){
    ctx.beginPath();
    ctx.moveTo(x-off, GROUND_Y);
    ctx.lineTo(x+100-off, GROUND_Y-90);
    ctx.lineTo(x+200-off, GROUND_Y);
    ctx.fill();
  }
  // mid parallax
  ctx.fillStyle = 'rgba(168,85,247,.25)';
  var off2 = (state.distance*.6) % 140;
  for(var x=-140;x<W+140;x+=140){
    ctx.beginPath();
    ctx.moveTo(x-off2, GROUND_Y);
    ctx.lineTo(x+70-off2, GROUND_Y-50);
    ctx.lineTo(x+140-off2, GROUND_Y);
    ctx.fill();
  }
  // ground line
  ctx.strokeStyle = '#A855F7';
  ctx.lineWidth = 2;
  ctx.shadowBlur = 8;
  ctx.shadowColor = '#A855F7';
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y);
  ctx.lineTo(W, GROUND_Y);
  ctx.stroke();
  ctx.shadowBlur = 0;
  // dashed lane lines moving
  ctx.strokeStyle = 'rgba(252,211,77,.5)';
  ctx.lineWidth = 2;
  ctx.setLineDash([20, 30]);
  ctx.lineDashOffset = -state.distance*.8;
  ctx.beginPath();
  ctx.moveTo(0, GROUND_Y+12);
  ctx.lineTo(W, GROUND_Y+12);
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawPlayer(){
  var img;
  if(!player.grounded){
    if(player.vy < -3) img = imgs.jumpRise;
    else if(player.vy > 3) img = imgs.jumpFall;
    else img = imgs.jumpPeak;
  } else {
    img = imgs.run[state.runFrame];
  }
  var dw=80, dh=80;
  var dx = player.x - dw/2;
  var dy = player.y - dh + 4;
  if(player.flash>0 && Math.floor(player.flash*8)%2===0){
    ctx.globalAlpha = 0.45;
  }
  if(img && img.complete && img.naturalWidth>0){
    ctx.drawImage(img, dx, dy, dw, dh);
  } else {
    // fallback purple square
    ctx.fillStyle = '#A855F7';
    ctx.fillRect(dx+15, dy+15, 50, 60);
  }
  ctx.globalAlpha = 1;
}

function drawObstacle(o){
  // glow base
  ctx.shadowBlur = 12;
  ctx.shadowColor = o.color;
  ctx.fillStyle = o.color;
  ctx.fillRect(o.x, o.y, o.w, o.h);
  ctx.shadowBlur = 0;
  // emoji on top
  ctx.font = 'bold '+(o.h*.7)+'px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(o.emoji, o.x+o.w/2, o.y+o.h/2);
}

function drawTreat(t){
  if(t.taken)return;
  ctx.shadowBlur = 14;
  ctx.shadowColor = '#FCD34D';
  ctx.font = 'bold 26px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🦴', t.x+t.w/2, t.y+t.h/2);
  ctx.shadowBlur = 0;
}

function drawParticles(){
  particles.forEach(function(p){
    p.life--;
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.3;
    if(p.life>0){
      ctx.globalAlpha = Math.min(1, p.life/30);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fill();
    }
  });
  particles = particles.filter(function(p){return p.life>0;});
  ctx.globalAlpha = 1;
}

function rectsOverlap(a, b){
  return !(a.x+a.w < b.x+8 || a.x+8 > b.x+b.w || a.y+a.h < b.y+8 || a.y+8 > b.y+b.h);
}

function tick(){
  if(!state.running)return;
  state.frameCounter++;

  // Animate run cycle every 6 frames
  if(player.grounded && state.frameCounter%6===0){
    state.runFrame = (state.runFrame+1) % imgs.run.length;
  }

  // Physics
  if(!player.grounded){
    player.vy += 0.7;
    player.y += player.vy;
    if(player.y >= GROUND_Y){
      player.y = GROUND_Y;
      player.vy = 0;
      player.grounded = true;
    }
  }
  if(player.flash>0) player.flash -= 0.05;

  // Move world
  state.distance += state.speed*0.4;
  state.score = Math.floor(state.distance) + state.treats*50;
  state.score = window.RENE ? RENE.boostScore(Math.floor(state.distance + state.treats*50)) : state.score;

  // Spawning
  state.spawnTimer--;
  if(state.spawnTimer <= 0){
    spawnObstacle();
    state.spawnTimer = 70 + Math.floor(Math.random()*60) - Math.min(40, Math.floor(state.distance/300));
    if(state.spawnTimer < 30) state.spawnTimer = 30;
  }
  state.treatTimer--;
  if(state.treatTimer <= 0){
    spawnTreat();
    state.treatTimer = 40 + Math.floor(Math.random()*60);
  }

  // Move obstacles + treats
  obstacles.forEach(function(o){o.x -= state.speed;});
  treats.forEach(function(t){t.x -= state.speed;});

  // Cull
  obstacles = obstacles.filter(function(o){return o.x+o.w > -20;});
  treats = treats.filter(function(t){return t.x+t.w > -20;});

  // Collisions
  var pBox = {x: player.x-22, y: player.y-58, w:44, h:60};
  if(player.flash <= 0){
    obstacles.forEach(function(o){
      if(rectsOverlap(pBox, o)){
        // Hit
        sfxHurt();
        endGame();
      }
    });
  }
  treats.forEach(function(t){
    if(!t.taken && rectsOverlap(pBox, t)){
      t.taken = true;
      state.treats++;
      sfxTreat();
      // sparkle particles
      for(var i=0;i<8;i++){
        particles.push({x:t.x+t.w/2, y:t.y+t.h/2, vx:(Math.random()-.5)*4, vy:-Math.random()*4, r:2+Math.random()*2, life:30, color:'#FCD34D'});
      }
    }
  });

  // Difficulty ramp
  if(state.frameCounter%180===0 && state.speed<11){
    state.speed += 0.3;
  }

  // Render
  ctx.clearRect(0,0,W,H);
  drawBackground();
  obstacles.forEach(drawObstacle);
  treats.forEach(drawTreat);
  drawPlayer();
  drawParticles();
  updateHUD();

  if(!state.gameOver) requestAnimationFrame(tick);
}

function start(){
  initAudio();
  fitCanvas();
  reset();
  state.running = true;
  document.getElementById('tapHint').classList.add('hide');
  document.getElementById('btnStart').style.display='none';
  document.getElementById('prompt').textContent = 'TAP ANYWHERE TO HOP';
  requestAnimationFrame(tick);
}

function endGame(){
  state.running = false;
  state.gameOver = true;
  fetchLB().then(function(){
    showDeath(state.score, state.distance >= 800);
  });
}

// Input
function handleTap(e){
  if(e)e.preventDefault();
  if(!state.running){return;}
  jump();
}
canvas.addEventListener('click', function(e){e.preventDefault();jump();});
canvas.addEventListener('touchstart', function(e){e.preventDefault();jump();}, {passive:false});
document.addEventListener('keydown', function(e){if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump();}});

document.getElementById('btnStart').onclick = start;
document.getElementById('btnRetry').onclick = function(){location.reload();};
document.getElementById('btnHub').onclick = function(){location.href='/rene-hub.html';};

// Leaderboard
var leaderboard=[], playerRank=0;
var playerName = localStorage.getItem('monshi_name')||'';
function fetchLB(){
  if(!window.RENE) return Promise.resolve();
  return RENE.fetchLeaderboard(TABLE, 10).then(function(d){if(Array.isArray(d))leaderboard=d;});
}
function submitScore(score, cb){
  if(!playerName||!window.RENE){if(cb)cb();return;}
  RENE.submitScore(TABLE, score).then(function(){
    return RENE.fetchLeaderboard(TABLE, 10);
  }).then(function(d){
    if(Array.isArray(d)){
      leaderboard=d;
      playerRank=leaderboard.findIndex(function(s){return s.name===playerName && s.score===Math.floor(score);})+1;
    }
    if(cb)cb();
  }).catch(function(){if(cb)cb();});
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function showDeath(sc, isWin){
  function render(){
    document.getElementById('ruggedTitle').textContent = isWin?'GG · TREATS SECURED':'PAW\'D';
    document.getElementById('ruggedTitle').className = 'rugged'+(isWin?' win':'');
    document.getElementById('dEmoji').textContent = isWin?'🦴':'🐾';
    document.getElementById('dScore').textContent = sc;
    document.getElementById('lvlTag').textContent = 'DISTANCE · '+Math.floor(state.distance)+' · TREATS · '+state.treats;
    var mult = window.RENE ? RENE.getMultiplier() : 1;
    document.getElementById('boostTag').textContent = mult>1?mult.toFixed(1)+'x BOOST APPLIED':'';
    document.getElementById('rankTag').textContent = playerRank>0?'#'+playerRank+' GLOBALLY':'';
    var tb = document.getElementById('lbBody'); tb.innerHTML='';
    leaderboard.slice(0,5).forEach(function(s,i){
      var tr=document.createElement('tr');
      var isMe = s.name===playerName && s.score===Math.floor(sc);
      if(isMe)tr.className='me';
      var medal = ['🥇','🥈','🥉'][i] || '#'+(i+1);
      tr.innerHTML='<td>'+medal+'</td><td>'+esc(s.name)+'</td><td class="sc">'+s.score+'</td>';
      tb.appendChild(tr);
    });
    document.getElementById('deathPanel').classList.add('show');
  }
  if(playerName){submitScore(sc, render);} else {document.getElementById('nameSubmit').style.display='block'; render();}
  document.getElementById('dSubmit').onclick = function(){
    var n = document.getElementById('dNameInput').value.trim();
    playerName = (n||'ANON').toUpperCase().slice(0,16);
    localStorage.setItem('monshi_name', playerName);
    document.getElementById('nameSubmit').style.display='none';
    submitScore(sc, render);
  };
  document.getElementById('dNameInput').onkeydown = function(e){if(e.key==='Enter')document.getElementById('dSubmit').click();};
  document.getElementById('btnShare').onclick = function(){
    var tw = 'I scored '+sc+' on $RENE TREAT RUN — '+state.treats+' treats grabbed before getting paw\'d 🐾🦴 '+PLAY_URL+' $RENE #Monad';
    window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(tw),'_blank');
  };
  document.getElementById('btnBuy').onclick = function(){window.open(BUY_URL,'_blank');};
}

reset();
fitCanvas();
fetchLB();
updateHUD();
ctx.clearRect(0,0,W,H);
drawBackground();
drawPlayer();
</script>
<script src="/pwa-install.js" defer></script>
