<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>THE LEDGER · Roby's Calls</title>
<meta name="description" content="Every call Roby has made, with live ROI from DexScreener. Verifiable receipts.">
<link rel="icon" type="image/png" href="/roby/data/roby-pfp.png">
<meta name="theme-color" content="#FCC419">
<style>
.page-head {
  padding:50px 22px 24px;
  text-align:center;
}
.eyebrow {
  font-family:'JetBrains Mono', monospace;
  font-size:11px; letter-spacing:4px;
  color:#FCC419;
  font-weight:700;
  margin-bottom:12px;
}
.page-head h1 {
  font-family:'Cinzel', serif;
  font-weight:900;
  font-size:clamp(38px, 7vw, 64px);
  letter-spacing:4px;
  color:#FCC419;
  text-shadow:0 0 60px rgba(252,196,25,.4);
  margin-bottom:8px;
}
.page-head p {
  font-family:'Cinzel', serif;
  font-style:italic;
  color:rgba(245,230,204,.7);
  max-width:560px;
  margin:0 auto;
  font-size:15px;
  line-height:1.7;
}

/* Stats summary */
.summary {
  max-width:1100px;
  margin:24px auto;
  padding:0 20px;
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));
  gap:10px;
}
.summary-card {
  padding:14px 14px;
  background:rgba(252,196,25,.06);
  border:1px solid rgba(252,196,25,.25);
  border-radius:10px;
}
.summary-card .l {
  font-family:'JetBrains Mono', monospace;
  font-size:9px; letter-spacing:1.5px;
  color:rgba(245,230,204,.5);
  font-weight:700;
}
.summary-card .v {
  font-family:'Cinzel', serif;
  font-weight:900;
  font-size:22px;
  color:#FCC419;
  margin-top:4px;
}
.summary-card .v.up { color:#4ADE80; }
.summary-card .v.dn { color:#EF4444; }

/* Filter bar */
.filters {
  max-width:1100px;
  margin:0 auto 14px;
  padding:0 20px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  justify-content:center;
}
.filter-btn {
  padding:8px 14px;
  background:rgba(252,196,25,.06);
  border:1px solid rgba(252,196,25,.25);
  border-radius:8px;
  color:rgba(245,230,204,.7);
  font-family:'Cinzel', serif;
  font-weight:700;
  font-size:11px; letter-spacing:1.5px;
  cursor:pointer;
  text-transform:uppercase;
  transition:all .15s;
}
.filter-btn:hover { color:#FCC419; border-color:#FCC419; }
.filter-btn.active {
  background:linear-gradient(135deg, #FCC419, #E0A800);
  color:#0d0a06;
  border-color:#FCC419;
}

/* Call cards */
.calls-list {
  max-width:1100px;
  margin:0 auto;
  padding:0 20px 60px;
  display:grid;
  gap:14px;
}
.call-card {
  position:relative;
  display:grid;
  grid-template-columns:auto 1fr auto;
  gap:18px;
  align-items:center;
  padding:18px 22px;
  background:linear-gradient(180deg, rgba(252,196,25,.05), rgba(0,0,0,.3));
  border:1.5px solid rgba(252,196,25,.25);
  border-left:4px solid #FCC419;
  border-radius:14px;
  transition:all .15s;
}
.call-card:hover { border-color:#FCC419; transform:translateX(2px); }
.call-card.status-hit { border-left-color:#4ADE80; }
.call-card.status-open { border-left-color:#FCC419; }
.call-card.status-stop { border-left-color:#EF4444; }
.call-card.status-closed { border-left-color:#94A3B8; }

.call-status-badge {
  position:absolute;
  top:14px; right:18px;
  padding:3px 10px;
  border-radius:30px;
  font-family:'JetBrains Mono', monospace;
  font-size:9px;
  font-weight:700;
  letter-spacing:1.5px;
  text-transform:uppercase;
}
.status-hit .call-status-badge { background:rgba(74,222,128,.15); color:#4ADE80; border:1px solid #4ADE80; }
.status-open .call-status-badge { background:rgba(252,196,25,.15); color:#FCC419; border:1px solid #FCC419; }
.status-stop .call-status-badge { background:rgba(239,68,68,.15); color:#EF4444; border:1px solid #EF4444; }
.status-closed .call-status-badge { background:rgba(148,163,184,.15); color:#94A3B8; border:1px solid #94A3B8; }

.call-symbol {
  width:64px; height:64px;
  border-radius:12px;
  background:linear-gradient(135deg, #FCC419, #E0A800);
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Cinzel', serif;
  font-weight:900;
  font-size:16px;
  letter-spacing:1px;
  color:#0d0a06;
  flex-shrink:0;
  text-align:center;
  padding:0 4px;
  line-height:1;
}

.call-info {
  display:grid;
  gap:6px;
  min-width:0;
}
.call-name {
  font-family:'Cinzel', serif;
  font-weight:900;
  font-size:18px;
  color:#fff;
  letter-spacing:1px;
}
.call-meta {
  font-family:'JetBrains Mono', monospace;
  font-size:11px;
  color:rgba(245,230,204,.55);
  display:flex;
  flex-wrap:wrap;
  gap:10px;
}
.call-meta span b { color:#FCC419; font-weight:700; }
.call-note {
  font-size:12px;
  color:rgba(245,230,204,.7);
  font-style:italic;
  margin-top:4px;
  line-height:1.5;
}

.call-roi {
  text-align:right;
  flex-shrink:0;
  min-width:120px;
}
.call-roi-label {
  font-family:'JetBrains Mono', monospace;
  font-size:9px;
  letter-spacing:1.5px;
  color:rgba(245,230,204,.5);
  font-weight:700;
}
.call-roi-value {
  font-family:'Cinzel', serif;
  font-weight:900;
  font-size:24px;
  margin-top:3px;
  letter-spacing:.5px;
}
.call-roi-value.up { color:#4ADE80; }
.call-roi-value.dn { color:#EF4444; }
.call-roi-value.flat { color:rgba(245,230,204,.5); }
.call-roi-current {
  font-family:'JetBrains Mono', monospace;
  font-size:10px;
  color:rgba(245,230,204,.5);
  margin-top:2px;
}

.empty {
  text-align:center;
  padding:80px 20px;
  font-family:'Cinzel', serif;
  font-style:italic;
  color:rgba(245,230,204,.5);
  font-size:16px;
}

@media(max-width:680px) {
  .call-card {
    grid-template-columns:auto 1fr;
    gap:14px;
  }
  .call-roi {
    grid-column:1 / -1;
    text-align:left;
    border-top:1px solid rgba(252,196,25,.15);
    padding-top:10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .call-status-badge {
    position:static;
    margin-bottom:4px;
    align-self:flex-start;
  }
  .call-symbol { width:48px; height:48px; font-size:13px; }
  .call-name { font-size:16px; }
  .call-roi-value { font-size:22px; }
}
</style>
</head>
<body class="roby-body">

<div id="roby-shell"></div>

<section class="page-head">
  <div class="eyebrow">📜 THE ROYAL LEDGER</div>
  <h1>EVERY CALL</h1>
  <p>"A king's word is binding. Every call shown — winners and losers both. ROI computed live from DexScreener."</p>
</section>

<div class="summary" id="summary">
  <div class="summary-card"><div class="l">TOTAL</div><div class="v" id="sumTotal">—</div></div>
  <div class="summary-card"><div class="l">OPEN</div><div class="v" id="sumOpen">—</div></div>
  <div class="summary-card"><div class="l">HIT TARGET</div><div class="v up" id="sumHit">—</div></div>
  <div class="summary-card"><div class="l">STOPPED OUT</div><div class="v dn" id="sumStop">—</div></div>
  <div class="summary-card"><div class="l">WIN RATE</div><div class="v" id="sumWinrate">—</div></div>
  <div class="summary-card"><div class="l">AVG ROI</div><div class="v" id="sumAvg">—</div></div>
</div>

<div class="filters">
  <button class="filter-btn active" data-filter="all">ALL</button>
  <button class="filter-btn" data-filter="open">OPEN</button>
  <button class="filter-btn" data-filter="hit">HITS</button>
  <button class="filter-btn" data-filter="stop">STOPPED</button>
  <button class="filter-btn" data-filter="closed">CLOSED</button>
</div>

<div class="calls-list" id="callsList">
  <div class="empty">loading the ledger...</div>
</div>

<div id="roby-footer"></div>
<script src="/roby/roby-shell.js"></script>

<script>
(async function(){
  function fmtPrice(n){
    if(!n||isNaN(n))return '—';
    if(n>=1)return '$'+n.toFixed(2);
    if(n>=0.01)return '$'+n.toFixed(4);
    if(n>=0.0001)return '$'+n.toFixed(6);
    var s=n.toFixed(20).split('.')[1]||''; var z=0;
    for(var i=0;i<s.length;i++){if(s[i]==='0')z++;else break;}
    var sig=s.slice(z,z+4).replace(/0+$/,'')||'0';
    var sub=String(z).split('').map(function(d){return '₀₁₂₃₄₅₆₇₈₉'[+d];}).join('');
    return '$0.0'+sub+sig;
  }
  function fmtDate(d){
    var dt = new Date(d);
    return dt.toLocaleDateString('en-US', {month:'short',day:'numeric',year:'numeric'});
  }
  function daysSince(d){
    var diff = Math.floor((Date.now() - new Date(d).getTime()) / (1000*60*60*24));
    return diff;
  }

  var allCalls = [];
  var currentFilter = 'all';

  async function loadCalls() {
    try {
      var resp = await fetch('/roby/data/calls.json');
      var data = await resp.json();
      var calls = data.calls || [];

      // Pull live prices
      var prices = await Promise.all(calls.map(function(c){
        return fetch('https://api.dexscreener.com/latest/dex/tokens/' + c.contract)
          .then(function(r){return r.json();})
          .then(function(d){
            if(!d.pairs || !d.pairs.length) return null;
            var p = d.pairs.sort(function(a,b){return (b.liquidity?.usd||0)-(a.liquidity?.usd||0);})[0];
            return parseFloat(p.priceUsd||0);
          })
          .catch(function(){return null;});
      }));

      // Enrich
      allCalls = calls.map(function(c, i){
        var current = prices[i];
        var roi = (current && c.entryPrice) ? ((current - c.entryPrice) / c.entryPrice) * 100 : null;
        return Object.assign({}, c, { currentPrice: current, roi: roi });
      });

      // Sort: open first (most recent date), then resolved by date
      allCalls.sort(function(a,b){
        if (a.status === 'open' && b.status !== 'open') return -1;
        if (b.status === 'open' && a.status !== 'open') return 1;
        return new Date(b.callDate) - new Date(a.callDate);
      });

      renderSummary();
      renderList();
    } catch (e) {
      document.getElementById('callsList').innerHTML = '<div class="empty">⚠ unable to load the ledger</div>';
      console.error(e);
    }
  }

  function renderSummary() {
    var total = allCalls.length;
    var open = allCalls.filter(function(c){return c.status === 'open';}).length;
    var hit = allCalls.filter(function(c){return c.status === 'hit';}).length;
    var stop = allCalls.filter(function(c){return c.status === 'stop';}).length;
    var resolved = hit + stop;
    var rois = allCalls.filter(function(c){return c.roi !== null;}).map(function(c){return c.roi;});
    var avgRoi = rois.length ? rois.reduce(function(a,b){return a+b;},0) / rois.length : 0;
    var winRate = resolved > 0 ? Math.round((hit / resolved) * 100) + '%' : '—';

    document.getElementById('sumTotal').textContent = total;
    document.getElementById('sumOpen').textContent = open;
    document.getElementById('sumHit').textContent = hit;
    document.getElementById('sumStop').textContent = stop;
    document.getElementById('sumWinrate').textContent = winRate;
    var avgEl = document.getElementById('sumAvg');
    avgEl.textContent = rois.length ? (avgRoi >= 0 ? '+' : '') + avgRoi.toFixed(1) + '%' : '—';
    avgEl.classList.add(avgRoi >= 0 ? 'up' : 'dn');
  }

  function renderList() {
    var list = document.getElementById('callsList');
    var filtered = currentFilter === 'all' ? allCalls : allCalls.filter(function(c){return c.status === currentFilter;});
    if (!filtered.length) {
      list.innerHTML = '<div class="empty">no calls in this category yet</div>';
      return;
    }
    list.innerHTML = filtered.map(function(c){
      var roiCls = '';
      var roiText = '—';
      if (c.roi !== null) {
        roiCls = c.roi > 0 ? 'up' : c.roi < 0 ? 'dn' : 'flat';
        roiText = (c.roi >= 0 ? '+' : '') + c.roi.toFixed(1) + '%';
      }
      var statusLabel = {
        'open': '⚡ OPEN',
        'hit': '✓ HIT TARGET',
        'stop': '✗ STOPPED',
        'closed': '◯ CLOSED'
      }[c.status] || c.status.toUpperCase();
      var days = daysSince(c.callDate);
      var ageText = days === 0 ? 'today' : days === 1 ? '1d ago' : days + 'd ago';
      return (
        '<div class="call-card status-' + c.status + '">' +
          '<div class="call-status-badge">' + statusLabel + '</div>' +
          '<div class="call-symbol">$' + c.symbol + '</div>' +
          '<div class="call-info">' +
            '<div class="call-name">' + c.symbol + '</div>' +
            '<div class="call-meta">' +
              '<span>📅 <b>' + fmtDate(c.callDate) + '</b> · ' + ageText + '</span>' +
              '<span>🎯 ENTRY <b>' + fmtPrice(c.entryPrice) + '</b></span>' +
              (c.target ? '<span>🏁 TARGET <b>' + fmtPrice(c.target) + '</b></span>' : '') +
              (c.stopLoss ? '<span>🛑 STOP <b>' + fmtPrice(c.stopLoss) + '</b></span>' : '') +
            '</div>' +
            (c.note ? '<div class="call-note">"' + c.note + '"</div>' : '') +
          '</div>' +
          '<div class="call-roi">' +
            '<div class="call-roi-label">ROI</div>' +
            '<div class="call-roi-value ' + roiCls + '">' + roiText + '</div>' +
            '<div class="call-roi-current">now ' + fmtPrice(c.currentPrice) + '</div>' +
          '</div>' +
        '</div>'
      );
    }).join('');
  }

  // Filter buttons
  document.querySelectorAll('.filter-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active');});
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      renderList();
    });
  });

  loadCalls();
  // Auto-refresh every 60s
  setInterval(loadCalls, 60000);
})();
</script>
</body>
</html>
