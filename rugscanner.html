<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{min-height:100vh;background:#0a0418;font-family:'Space Mono',monospace;color:#EDE9FF;overflow-x:hidden;}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 20% 10%,rgba(239,68,68,.18),transparent 60%),radial-gradient(circle at 80% 90%,rgba(252,211,77,.10),transparent 55%);z-index:-1;pointer-events:none;}

#hubBtn{position:fixed;top:8px;left:8px;z-index:7;color:rgba(252,211,77,.85);text-decoration:none;font-size:11px;letter-spacing:1.5px;background:rgba(0,0,0,.5);padding:7px 12px;border-radius:8px;border:1px solid rgba(252,211,77,.3);font-family:Orbitron,sans-serif;font-weight:700;}
#glossaryBtn{position:fixed;top:8px;right:8px;z-index:7;color:rgba(168,85,247,.85);text-decoration:none;font-size:11px;letter-spacing:1.5px;background:rgba(0,0,0,.5);padding:7px 12px;border-radius:8px;border:1px solid rgba(168,85,247,.3);font-family:Orbitron,sans-serif;font-weight:700;}

.wrap{max-width:680px;margin:0 auto;padding:50px 14px 80px;display:flex;flex-direction:column;align-items:center;gap:14px;}

.title{font-family:Orbitron,sans-serif;font-size:clamp(26px,6vw,38px);font-weight:900;letter-spacing:3px;color:#FCD34D;text-shadow:0 0 22px rgba(252,211,77,.5);text-align:center;}
.title .skull{color:#EF4444;}
.title .sub{display:block;font-size:11px;color:rgba(252,211,77,.7);letter-spacing:3px;margin-top:6px;font-weight:700;}

/* HUD */
.hud{display:flex;gap:8px;width:100%;font-family:Orbitron,sans-serif;}
.hud-cell{flex:1;padding:10px 6px;background:rgba(20,5,50,.7);border:1px solid rgba(252,211,77,.3);border-radius:9px;text-align:center;}
.hud-cell .v{font-size:18px;color:#fff;font-weight:900;line-height:1;}
.hud-cell .l{font-size:8px;color:rgba(167,139,250,.65);letter-spacing:1.5px;margin-top:5px;font-weight:700;}
.hud-cell.streak .v{color:#FCD34D;}
.hud-cell.lives .v{color:#F87171;letter-spacing:2px;}
.hud-cell.diff .v{font-size:14px;}

/* Code panel */
.code-wrap{width:100%;background:#0d1117;border:1.5px solid rgba(252,211,77,.4);border-radius:12px;overflow:hidden;box-shadow:0 0 22px rgba(239,68,68,.15);}
.code-header{background:rgba(0,0,0,.5);padding:8px 14px;font-family:Orbitron,sans-serif;font-size:10px;letter-spacing:2px;color:rgba(252,211,77,.7);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(252,211,77,.2);}
.code-header .filename{display:flex;align-items:center;gap:6px;}
.code-header .difftag{font-size:10px;padding:3px 8px;border-radius:6px;background:rgba(168,85,247,.15);border:1px solid rgba(168,85,247,.4);color:#C4B5FD;}
.code-block{padding:16px 14px;font-family:'JetBrains Mono','Space Mono',monospace;font-size:13px;line-height:1.6;color:#c9d1d9;white-space:pre-wrap;word-break:break-word;overflow-x:auto;max-height:55vh;overflow-y:auto;}
.rs-term{color:#FCD34D;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;cursor:pointer;font-weight:700;transition:all .15s;}
.rs-term:active{background:rgba(252,211,77,.2);border-radius:3px;}

.hint{font-size:11px;color:rgba(196,181,253,.65);letter-spacing:1px;text-align:center;font-style:italic;}

/* Action buttons */
.actions{display:flex;gap:10px;width:100%;}
.act{flex:1;padding:18px 8px;border:none;border-radius:12px;font-family:Orbitron,sans-serif;font-size:13px;font-weight:900;cursor:pointer;letter-spacing:1.5px;transition:all .12s;color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;}
.act:active{transform:scale(.96);}
.act.rug{background:linear-gradient(135deg,#EF4444,#991B1B);box-shadow:0 0 18px rgba(239,68,68,.4);}
.act.safe{background:linear-gradient(135deg,#22C55E,#15803D);box-shadow:0 0 18px rgba(34,197,94,.4);}
.act.explain{background:linear-gradient(135deg,#A855F7,#5B21B6);box-shadow:0 0 18px rgba(168,85,247,.4);flex:0 0 auto;padding:18px 16px;}
.act .e{font-size:24px;}
.act:disabled{opacity:.5;cursor:not-allowed;}

/* Result flash */
.flash{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:50;padding:24px 36px;border-radius:14px;font-family:Orbitron,sans-serif;font-size:24px;font-weight:900;letter-spacing:3px;opacity:0;pointer-events:none;transition:opacity .2s;text-align:center;}
.flash.show{opacity:1;}
.flash.win{background:rgba(34,197,94,.95);color:#fff;box-shadow:0 0 50px rgba(34,197,94,.6);}
.flash.loss{background:rgba(239,68,68,.95);color:#fff;box-shadow:0 0 50px rgba(239,68,68,.6);}

/* Tooltip popup (slides up from bottom on mobile, centered on desktop) */
.tip-overlay{position:fixed;inset:0;background:rgba(0,0,8,.85);z-index:90;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px);}
.tip-overlay.show{display:flex;}
.tip-card{background:linear-gradient(135deg,rgba(168,85,247,.15),rgba(20,5,50,.95));border:1.5px solid rgba(252,211,77,.5);border-top-left-radius:20px;border-top-right-radius:20px;padding:22px 20px 32px;width:100%;max-width:600px;box-shadow:0 -10px 40px rgba(252,211,77,.2);animation:slideUp .25s ease;max-height:80vh;overflow-y:auto;}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.tip-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:12px;}
.tip-term{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:900;color:#FCD34D;letter-spacing:.5px;}
.tip-cat{font-size:9px;letter-spacing:2px;padding:3px 8px;border-radius:6px;background:rgba(168,85,247,.2);border:1px solid rgba(168,85,247,.4);color:#C4B5FD;font-family:Orbitron,sans-serif;font-weight:700;flex-shrink:0;}
.tip-cat.redflag{background:rgba(239,68,68,.2);border-color:rgba(239,68,68,.5);color:#FCA5A5;}
.tip-cat.security{background:rgba(34,197,94,.2);border-color:rgba(34,197,94,.5);color:#86EFAC;}
.tip-short{font-size:14px;color:#fff;line-height:1.5;margin-bottom:12px;font-weight:700;}
.tip-why{font-size:13px;color:rgba(196,181,253,.85);line-height:1.55;margin-bottom:14px;}
.tip-looks-label{font-family:Orbitron,sans-serif;font-size:9px;letter-spacing:2px;color:rgba(252,211,77,.7);margin-bottom:6px;font-weight:700;}
.tip-looks{font-family:'JetBrains Mono',monospace;font-size:11px;background:#0d1117;color:#c9d1d9;padding:10px 12px;border-radius:8px;border:1px solid rgba(252,211,77,.2);overflow-x:auto;white-space:pre-wrap;line-height:1.5;}
.tip-sev{margin-top:14px;text-align:center;font-size:18px;letter-spacing:8px;}
.tip-close{position:absolute;top:14px;right:18px;background:rgba(0,0,0,.5);border:1px solid rgba(168,85,247,.4);color:#fff;width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}

/* Reveal/explain panel after answering */
.reveal{display:none;width:100%;background:linear-gradient(135deg,rgba(20,5,50,.85),rgba(0,0,0,.9));border:1.5px solid rgba(252,211,77,.4);border-radius:12px;padding:18px;text-align:center;}
.reveal.show{display:block;}
.reveal .verdict{font-family:Orbitron,sans-serif;font-size:22px;font-weight:900;letter-spacing:3px;margin-bottom:10px;}
.reveal .verdict.rug{color:#FCA5A5;}
.reveal .verdict.safe{color:#86EFAC;}
.reveal .lesson{font-size:13px;color:rgba(220,210,255,.9);line-height:1.55;margin-bottom:14px;}
.reveal .next-btn{padding:12px 28px;background:linear-gradient(135deg,#FCD34D,#F59E0B);border:none;border-radius:10px;color:#000;font-family:Orbitron,sans-serif;font-size:12px;font-weight:900;cursor:pointer;letter-spacing:2px;}
.reveal .next-btn:active{transform:scale(.97);}

.btn-secondary{padding:14px 24px;background:linear-gradient(135deg,#FCD34D,#F59E0B);border:none;border-radius:10px;color:#000;font-family:Orbitron,sans-serif;font-size:13px;font-weight:900;cursor:pointer;letter-spacing:2px;box-shadow:0 0 18px rgba(252,211,77,.4);}

/* Death panel */
.death{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,8,.95);z-index:80;backdrop-filter:blur(5px);padding:20px;}
.death.show{display:flex;}
.deathCard{background:linear-gradient(135deg,rgba(252,211,77,.15),rgba(20,5,50,.9));border:1.5px solid rgba(252,211,77,.5);border-radius:18px;padding:24px 22px;width:min(440px,94vw);max-height:90vh;overflow-y:auto;text-align:center;box-shadow:0 0 40px rgba(252,211,77,.4);}
.dEmoji{font-size:46px;margin-bottom:6px;}
.dTitle{font-family:Orbitron,sans-serif;font-size:24px;font-weight:900;color:#FCD34D;text-shadow:0 0 22px rgba(252,211,77,.5);margin-bottom:6px;letter-spacing:2px;}
.dTitle.rugged{color:#FCA5A5;text-shadow:0 0 22px #EF4444;}
.scoreNum{font-family:Orbitron,sans-serif;font-size:32px;color:#FCD34D;margin:6px 0;text-shadow:0 0 14px rgba(252,211,77,.5);}
.lbl{font-size:10px;color:rgba(167,139,250,.65);letter-spacing:1.5px;margin-bottom:10px;}
#nameSubmit{margin-bottom:14px;display:none;}
#nameSubmit input{background:rgba(0,0,0,.5);border:1.5px solid rgba(168,85,247,.5);border-radius:8px;padding:9px 12px;color:#fff;font-family:'Space Mono',monospace;font-size:13px;outline:none;text-align:center;letter-spacing:2px;width:160px;}
#nameSubmit button{margin-left:6px;padding:9px 16px;background:linear-gradient(135deg,#A855F7,#7C3AED);border:none;border-radius:8px;color:#fff;font-family:Orbitron,sans-serif;font-size:11px;font-weight:900;cursor:pointer;}
#btnRow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px;}
.btn{padding:10px 14px;border:none;border-radius:8px;font-family:Orbitron,sans-serif;font-size:11px;font-weight:900;cursor:pointer;letter-spacing:1.5px;color:#fff;}
#btnRetry{background:linear-gradient(135deg,#A855F7,#5B21B6);}
#btnHub{background:linear-gradient(135deg,#374151,#1F2937);}
#btnGloss{background:linear-gradient(135deg,#A855F7,#7C3AED);}
#btnShare{background:linear-gradient(135deg,#1DA1F2,#0d7abf);}
.lbT{width:100%;border-collapse:collapse;margin:14px 0 6px;font-size:11px;}
.lbT th{color:rgba(168,85,247,.7);text-align:left;padding:4px 6px;border-bottom:1px solid rgba(168,85,247,.3);font-size:9px;letter-spacing:1.5px;font-family:Orbitron,sans-serif;}
.lbT td{padding:5px 6px;color:rgba(220,210,255,.8);}
.lbT tr.me td{color:#FCD34D;background:rgba(252,211,77,.08);}
.lbT .sc{text-align:right;font-family:Orbitron,sans-serif;font-weight:700;}
</style>
</head>

<script>
var TABLE = 'scores_rugscan';
var SUPABASE_URL = 'https://cuqhqcmrgpdjlhyqztnc.supabase.co';
var SUPABASE_KEY = 'sb_publishable_nu-E2mvgdQ0l1DsSsOswWA_ma2RbV4z';
var PLAY_URL = 'https://monshi-fafo.vercel.app/rugscanner.html';

// Audio
var AC=window.AudioContext||window.webkitAudioContext, actx=null, master=null;
function initAudio(){if(actx)return;try{actx=new AC();master=actx.createGain();master.gain.value=.22;master.connect(actx.destination);}catch(e){}}
function tone(f,t,v,o,d){if(!actx)return;var st=actx.currentTime+(o||0);var os=actx.createOscillator();var g=actx.createGain();os.type=t||'square';os.frequency.setValueAtTime(f,st);g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(v,st+.01);g.gain.exponentialRampToValueAtTime(.001,st+d);os.connect(g);g.connect(master);os.start(st);os.stop(st+d+.05);}
function sfxWin(){[523,659,784,1046].forEach(function(f,i){tone(f,'square',.18,i*.05,.1);});}
function sfxLose(){[440,330,220].forEach(function(f,i){tone(f,'sawtooth',.22,i*.1,.16);});}
function sfxClick(){tone(820,'square',.08,0,.04);}

// State
var state = {
  score:0, streak:0, lives:3, round:0, snippets:[],
  current:null, locked:true, hintUsed:false
};
var leaderboard=[], playerRank=0;
var playerName = (typeof MONSHI !== 'undefined' && MONSHI.playerName) || localStorage.getItem('monshi_name') || '';

function shuffle(a){
  for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x;}
  return a;
}

function updateHUD(){
  document.getElementById('hudScore').textContent = state.score;
  document.getElementById('hudStreak').textContent = state.streak;
  document.getElementById('hudRound').textContent = (state.round)+'/'+state.snippets.length;
  document.getElementById('hudLives').textContent = '❤'.repeat(state.lives) + '🤍'.repeat(3-state.lives);
}

function flash(text, kind){
  var el = document.getElementById('flash');
  el.textContent = text;
  el.className = 'flash show '+kind;
  setTimeout(function(){el.classList.remove('show');}, 900);
}

function loadSnippet(){
  if(state.round >= state.snippets.length){endGame();return;}
  state.current = state.snippets[state.round];
  state.locked = false;
  state.hintUsed = false;
  document.getElementById('codeBlock').innerHTML = RUGSCAN.highlightCode(state.current.code, state.current.terms);
  document.getElementById('diffTag').textContent = 'DIFFICULTY '+state.current.difficulty;
  document.getElementById('snipFilename').textContent = 'Snippet_'+String(state.current.id).padStart(2,'0')+'.sol';
  document.getElementById('btnRug').disabled = false;
  document.getElementById('btnSafe').disabled = false;
  document.getElementById('btnExplain').disabled = false;
  document.getElementById('revealPanel').classList.remove('show');
  attachTermListeners();
  updateHUD();
}

function attachTermListeners(){
  var spans = document.querySelectorAll('.rs-term');
  spans.forEach(function(s){
    s.onclick = function(e){
      e.stopPropagation();
      var term = this.getAttribute('data-term');
      showTip(term);
    };
  });
}

function showTip(term){
  var entry = RUGSCAN.lookup(term);
  if(!entry)return;
  document.getElementById('tipTerm').textContent = term;
  var catEl = document.getElementById('tipCat');
  var catLabels = {redflag:'🚨 RED FLAG', function:'⚙️ FUNCTION', data:'📦 DATA', security:'🔐 SECURITY', token:'💸 TOKEN'};
  catEl.textContent = catLabels[entry.cat] || entry.cat.toUpperCase();
  catEl.className = 'tip-cat '+entry.cat;
  document.getElementById('tipShort').textContent = entry.short;
  document.getElementById('tipWhy').textContent = entry.why;
  document.getElementById('tipLooks').textContent = entry.looks;
  document.getElementById('tipSev').textContent = entry.sev;
  document.getElementById('tipOverlay').classList.add('show');
}

document.getElementById('tipClose').onclick = function(){document.getElementById('tipOverlay').classList.remove('show');};
document.getElementById('tipOverlay').onclick = function(e){if(e.target===this)this.classList.remove('show');};

function answer(call){
  if(state.locked)return;
  state.locked = true;
  initAudio();
  document.getElementById('btnRug').disabled = true;
  document.getElementById('btnSafe').disabled = true;
  document.getElementById('btnExplain').disabled = true;
  var correct = call === state.current.verdict;
  var earned = 0;
  if(correct){
    sfxWin();
    var base = state.current.difficulty * 100;
    var streakBonus = state.streak * 25;
    var hintPenalty = state.hintUsed ? 0.5 : 1;
    earned = Math.floor((base + streakBonus) * hintPenalty);
    state.score += earned;
    state.streak++;
    flash('+'+earned+(state.hintUsed?' (hint used)':''), 'win');
  } else {
    sfxLose();
    state.streak = 0;
    state.lives--;
    flash(state.current.verdict==='RUG'?'🚩 IT WAS A RUG':'✅ IT WAS SAFE', 'loss');
  }
  // Show explanation
  var rv = document.getElementById('revealVerdict');
  rv.textContent = state.current.verdict==='RUG' ? '🚩 RUG' : '✅ SAFE';
  rv.className = 'verdict '+(state.current.verdict==='RUG' ? 'rug' : 'safe');
  document.getElementById('revealLesson').textContent = state.current.explain;
  setTimeout(function(){
    document.getElementById('revealPanel').classList.add('show');
    updateHUD();
    if(state.lives <= 0){
      setTimeout(function(){document.getElementById('nextBtn').textContent = 'SEE RESULTS →';}, 100);
    }
  }, 700);
}

document.getElementById('btnRug').onclick = function(){if(!state.locked){sfxClick();answer('RUG');}};
document.getElementById('btnSafe').onclick = function(){if(!state.locked){sfxClick();answer('SAFE');}};
document.getElementById('btnExplain').onclick = function(){
  if(state.locked)return;
  state.hintUsed = true;
  this.disabled = true;
  // Show all term tooltips inline by highlighting first red flag term
  var redFlags = state.current.terms.filter(function(t){
    var e = RUGSCAN.lookup(t);
    return e && (e.cat==='redflag' || e.sev.indexOf('🚩')>=0);
  });
  if(redFlags.length>0){
    showTip(redFlags[0]);
  } else if(state.current.terms.length>0){
    showTip(state.current.terms[0]);
  }
};

document.getElementById('nextBtn').onclick = function(){
  if(state.lives <= 0){endGame();return;}
  state.round++;
  loadSnippet();
};

document.getElementById('btnStart').onclick = function(){
  initAudio();
  this.style.display='none';
  // Mix difficulties — 6 easy, 9 medium, 15 hard. Take random 15 total for game length.
  var byDiff = {1:[], 2:[], 3:[]};
  RUGSCAN.SNIPPETS.forEach(function(s){byDiff[s.difficulty].push(s);});
  var picked = []
    .concat(shuffle(byDiff[1]).slice(0,5))
    .concat(shuffle(byDiff[2]).slice(0,5))
    .concat(shuffle(byDiff[3]).slice(0,5));
  state = {score:0, streak:0, lives:3, round:0, snippets:picked, current:null, locked:true, hintUsed:false};
  updateHUD();
  loadSnippet();
};

// Leaderboard
function sbHeaders(){return{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=representation'};}
function fetchLB(){
  return fetch(SUPABASE_URL+'/rest/v1/'+TABLE+'?select=name,score&order=score.desc&limit=10',{headers:sbHeaders()})
    .then(function(r){return r.json();})
    .then(function(d){if(Array.isArray(d))leaderboard=d;})
    .catch(function(){});
}
function submitScore(score, cb){
  if(!playerName){if(cb)cb();return;}
  fetch(SUPABASE_URL+'/rest/v1/'+TABLE,{method:'POST',headers:sbHeaders(),body:JSON.stringify({name:playerName,score:Math.floor(score)})})
    .then(function(){return fetch(SUPABASE_URL+'/rest/v1/'+TABLE+'?select=name,score&order=score.desc&limit=10',{headers:sbHeaders()});})
    .then(function(r){return r.json();})
    .then(function(d){if(Array.isArray(d)){leaderboard=d;playerRank=leaderboard.findIndex(function(s){return s.name===playerName && s.score===Math.floor(score);})+1;}if(cb)cb();})
    .catch(function(){if(cb)cb();});
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function endGame(){
  fetchLB().then(function(){showDeath(state.score);});
}

function showDeath(sc){
  var didWell = sc >= 800;
  function render(){
    document.getElementById('dTitle').textContent = state.lives<=0 ? 'YOU GOT RUGGED' : 'SCAN COMPLETE';
    document.getElementById('dTitle').className = 'dTitle' + (state.lives<=0?' rugged':'');
    document.getElementById('dEmoji').textContent = state.lives<=0?'💀':(didWell?'🕵️':'📚');
    document.getElementById('dScore').textContent = sc;
    document.getElementById('lvlTag').textContent = 'CONTRACTS SCANNED · '+state.round;
    document.getElementById('rankTag').textContent = playerRank>0?'#'+playerRank+' GLOBAL RANK':'';
    var tb = document.getElementById('lbBody'); tb.innerHTML='';
    leaderboard.slice(0,5).forEach(function(s,i){
      var tr = document.createElement('tr');
      var isMe = s.name===playerName && s.score===Math.floor(sc);
      if(isMe) tr.className='me';
      var medal = ['🥇','🥈','🥉'][i] || '#'+(i+1);
      tr.innerHTML = '<td>'+medal+'</td><td>'+esc(s.name)+'</td><td class="sc">'+s.score+'</td>';
      tb.appendChild(tr);
    });
    document.getElementById('deathPanel').classList.add('show');
  }
  if(playerName){submitScore(sc, render);} else {document.getElementById('nameSubmit').style.display='block'; render();}
  document.getElementById('dSubmit').onclick = function(){
    var n = document.getElementById('dNameInput').value.trim();
    playerName = (n||'ANON').toUpperCase().slice(0,16);
    localStorage.setItem('monshi_name', playerName);
    document.getElementById('nameSubmit').style.display='none';
    submitScore(sc, render);
  };
  document.getElementById('dNameInput').onkeydown = function(e){if(e.key==='Enter')document.getElementById('dSubmit').click();};
  document.getElementById('btnShare').onclick = function(){
    var tw = 'I scored '+sc+' on RUG SCANNER 🕵️ — spotted '+state.round+' contract patterns. Can you read Solidity? '+PLAY_URL+' #Monad #DontGetRugged';
    window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(tw),'_blank');
  };
  document.getElementById('btnGloss').onclick = function(){location.href='/glossary.html';};
  document.getElementById('btnRetry').onclick = function(){location.reload();};
  document.getElementById('btnHub').onclick = function(){location.href='/';};
}

fetchLB();
updateHUD();
</script>
