<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="shortcut icon" href="/favicon.ico">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>MONSHI SHOOTER</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:'Space Mono',monospace;}
#c{position:fixed;top:0;left:0;image-rendering:crisp-edges;cursor:crosshair;touch-action:none;}
.overlay{position:fixed;display:none;flex-direction:column;align-items:center;justify-content:center;}
.overlay.show{display:flex;}
#deathPanel{background:rgba(0,0,8,.92);z-index:8;pointer-events:all;width:100vw;height:100vh;top:0;left:0;}
#deathCard{background:rgba(90,30,180,.18);border:1.5px solid rgba(150,120,255,.4);border-radius:18px;padding:22px 28px;width:min(490px,90vw);text-align:center;}
.rugged{font-family:Orbitron,sans-serif;font-size:clamp(28px,5vw,44px);font-weight:900;color:#FCA5A5;text-shadow:0 0 24px #EF4444;margin-bottom:4px;}
.lvlTag{font-size:11px;color:#4ADE80;letter-spacing:2px;margin-bottom:10px;}
.scoreRow{display:flex;justify-content:center;gap:32px;margin-bottom:10px;}
.sBlock .num{font-family:Orbitron,sans-serif;font-size:clamp(16px,3vw,22px);color:#EDE9FF;}
.sBlock .lbl{font-size:9px;color:rgba(167,139,250,.5);letter-spacing:1px;}
.rankTag{font-size:11px;color:#4ADE80;margin-bottom:10px;min-height:16px;}
#lbTable{width:100%;border-collapse:collapse;margin-bottom:12px;font-size:11px;}
#lbTable th{color:rgba(139,92,246,.6);text-align:left;padding:3px 6px;border-bottom:1px solid rgba(139,92,246,.2);font-size:9px;letter-spacing:1px;}
#lbTable td{padding:4px 6px;color:rgba(220,210,255,.8);}
#lbTable tr.me td{color:#4ADE80;background:rgba(74,222,128,.08);}
#lbTable .rank{width:28px;color:rgba(139,92,246,.5);}
#lbTable .sc{text-align:right;font-family:Orbitron,sans-serif;}
#lbTable tr.me .sc{color:#4ADE80;}
#btnRow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
.btn{padding:10px 14px;border:none;border-radius:8px;font-family:Orbitron,sans-serif;font-size:11px;font-weight:700;cursor:pointer;letter-spacing:1px;}
.btn:hover{opacity:.82;}
#btnRetry{background:linear-gradient(135deg,#7C3AED,#5B21B6);color:#fff;}
#btnShare{background:linear-gradient(135deg,#1DA1F2,#0d7abf);color:#fff;}
#btnBuy{background:linear-gradient(135deg,#22C55E,#15803D);color:#fff;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.5);}50%{box-shadow:0 0 0 8px rgba(34,197,94,0);}}
#priceTicker{position:fixed;font-size:10px;color:rgba(139,92,246,.6);letter-spacing:1px;pointer-events:none;z-index:4;padding:8px 12px;}
#startLb{position:fixed;top:50%;right:20px;transform:translateY(-50%);background:rgba(0,0,0,.85);border:1.5px solid rgba(139,92,246,.4);border-radius:14px;padding:18px 22px;width:260px;pointer-events:none;z-index:4;display:none;box-shadow:0 0 30px rgba(139,92,246,.3);}
#startLb h3{font-family:Orbitron,sans-serif;font-size:13px;color:#C4B5FD;letter-spacing:3px;margin-bottom:12px;text-align:center;text-shadow:0 0 10px rgba(139,92,246,.8);}
#startLbList{list-style:none;font-size:12px;}
#startLbList li{display:flex;justify-content:space-between;align-items:center;padding:6px 4px;border-bottom:1px solid rgba(139,92,246,.15);color:rgba(220,210,255,.85);gap:10px;}
#startLbList li:last-child{border:none;}
#startLbList li:nth-child(1){background:linear-gradient(90deg,rgba(252,211,77,.12),transparent);border-radius:6px;padding:7px;}
#startLbList .pn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#startLbList .sn{font-family:Orbitron,sans-serif;color:#4ADE80;font-size:12px;font-weight:700;}
#musicBtn{position:fixed;z-index:6;background:rgba(0,0,0,.5);border:1px solid rgba(139,92,246,.3);border-radius:20px;color:rgba(167,139,250,.7);font-family:'Space Mono',monospace;font-size:10px;padding:5px 10px;cursor:pointer;}
#musicBtn:hover{border-color:#8B5CF6;color:#C4B5FD;}
#nameSubmit input{background:rgba(0,0,0,.5);border:1.5px solid rgba(139,92,246,.5);border-radius:8px;padding:8px 12px;color:#fff;font-family:'Space Mono',monospace;font-size:13px;outline:none;text-align:center;letter-spacing:2px;width:160px;}
#nameSubmit button{padding:8px 16px;background:linear-gradient(135deg,#7C3AED,#4ADE80);border:none;border-radius:8px;color:#fff;font-family:Orbitron,sans-serif;font-size:11px;font-weight:700;cursor:pointer;letter-spacing:1px;}
#backLink{position:fixed;top:12px;left:12px;z-index:7;color:rgba(139,92,246,.7);text-decoration:none;font-size:11px;font-family:'Space Mono',monospace;letter-spacing:1px;background:rgba(0,0,0,.5);padding:5px 10px;border-radius:8px;border:1px solid rgba(139,92,246,.2);}
#backLink:hover{color:#C4B5FD;}
</style>

<canvas id="c"></canvas>

        <button id="dSubmit" type="button">SUBMIT</button>

    <table id="lbTable"><thead><tr><th class="rank">#</th><th>PLAYER</th><th class="sc">SCORE</th></tr></thead><tbody id="lbBody"></tbody></table>

var AC=window.AudioContext||window.webkitAudioContext;
var actx=null,musicOn=true,musicTimer=null,master=null,beat=0;
function initAudio(){if(actx)return;try{actx=new AC();master=actx.createGain();master.gain.value=0.22;master.connect(actx.destination);}catch(e){}}
function tone(f,t,v,o,d){if(!actx)return;var st=actx.currentTime+(o||0);var os=actx.createOscillator();var g=actx.createGain();os.type=t||'square';os.frequency.setValueAtTime(f,st);g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(v,st+0.01);g.gain.exponentialRampToValueAtTime(0.001,st+d);os.connect(g);g.connect(master);os.start(st);os.stop(st+d+0.05);}
function noise(v,o,d){if(!actx)return;var st=actx.currentTime+(o||0);var bs=Math.floor(actx.sampleRate*d);var b=actx.createBuffer(1,bs,actx.sampleRate);var dt=b.getChannelData(0);for(var i=0;i<bs;i++)dt[i]=(Math.random()*2-1)*0.5;var s=actx.createBufferSource();s.buffer=b;var g=actx.createGain();g.gain.setValueAtTime(v,st);g.gain.exponentialRampToValueAtTime(0.001,st+d);s.connect(g);g.connect(master);s.start(st);}

function sfxHit(){noise(0.15,0,0.05);tone(180,'square',0.12,0,0.08);}
function sfxKill(){tone(440,'square',0.12,0,0.06);tone(660,'square',0.12,0.05,0.06);tone(880,'square',0.12,0.1,0.08);}
function sfxHurt(){tone(120,'sawtooth',0.25,0,0.15);}

function sfxBoss(){[110,138,164,110].forEach(function(f,i){tone(f,'sawtooth',0.3,i*0.12,0.16);});}

function musicTick(){
  if(!actx||!musicOn)return;
  var lv=Math.min(wave,5);
  var bassR=[55,58,49,55,73,98];
  if(beat%4===0)tone(bassR[lv]||55,'sawtooth',0.2,0,0.22);
  if(beat%4===0||beat%4===2){var t=actx.currentTime;var k=actx.createOscillator();var kg=actx.createGain();k.frequency.setValueAtTime(140,t);k.frequency.exponentialRampToValueAtTime(40,t+0.08);kg.gain.setValueAtTime(0.5,t);kg.gain.exponentialRampToValueAtTime(0.001,t+0.12);k.connect(kg);kg.connect(master);k.start(t);k.stop(t+0.15);}
  noise(beat%2===0?0.06:0.1,0,0.03);
  if(beat%2===0){var sc=[261,329,392,523,587];var n=sc[Math.floor(Math.random()*sc.length)];tone(n*(lv>2?2:1),'square',0.06,0,0.14);}
  beat=(beat+1)%32;
}
function startMusic(){if(musicTimer)return;if(!actx)initAudio();if(actx&&actx.state==='suspended')actx.resume();musicTimer=setInterval(musicTick,125);}
function stopMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null;}beat=0;}

var state='start',score=0,best=0,tick=0;
var wave=1,waveKills=0,waveTarget=8;

var leaderboard=[],playerRank=0,lastScore=0,lastWave=0;

// ── Player ───────────────────────────────────────────────
var P={
  x:BW/2, y:BH/2, r:24,
  hp:100, maxHp:100,
  spd:3.2,
  fireRate:18, // frames between shots
  fireT:0,
  bulletSpd:8,
  bulletDmg:1,
  pierce:0,
  nukeAt:0,
  invuln:0,
  flash:0,
  draw:function(){
    if(this.invuln>0&&Math.floor(tick/3)%2===0)return;
    ctx.save();
    if(this.flash>0){ctx.shadowColor='#fff';ctx.shadowBlur=20;}
    if(playerImg.complete){
      ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.clip();
      ctx.drawImage(playerImg,this.x-this.r,this.y-this.r,this.r*2,this.r*2);
    }
    ctx.restore();
    // Border glow
    ctx.save();ctx.shadowColor='#8B5CF6';ctx.shadowBlur=15;
    ctx.strokeStyle='#8B5CF6';ctx.lineWidth=2.5;
    ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.stroke();ctx.restore();
    // Health bar above
    var bw=50, bh=5, bx=this.x-bw/2, by=this.y-this.r-12;
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(bx,by,bw,bh);
    var pct=this.hp/this.maxHp;
    ctx.fillStyle=pct>0.5?'#22C55E':pct>0.25?'#FCD34D':'#EF4444';
    ctx.fillRect(bx,by,bw*pct,bh);
    ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=1;ctx.strokeRect(bx,by,bw,bh);
    if(this.flash>0)this.flash--;
  }
};

canvas.addEventListener('touchmove',function(e){e.preventDefault();if(!joy.active)return;var t=e.touches[0];var rect=canvas.getBoundingClientRect();joy.x=(t.clientX-rect.left)/SCALE;joy.y=(t.clientY-rect.top)/SCALE;var ddx=joy.x-joy.baseX,ddy=joy.y-joy.baseY;var d=Math.sqrt(ddx*ddx+ddy*ddy);var maxR=50;if(d>maxR){ddx=ddx/d*maxR;ddy=ddy/d*maxR;}joy.dx=ddx/maxR;joy.dy=ddy/maxR;});
canvas.addEventListener('touchend',function(e){e.preventDefault();joy.active=false;joy.dx=0;joy.dy=0;});

// ── Enemies ──────────────────────────────────────────────
var enemies=[];
function spawnEnemy(typeIdx,x,y,scale){
  var T=ENEMY_TYPES[typeIdx];
  var hpScale=1+(wave-1)*0.25;
  var spdScale=1+(wave-1)*0.06;
  enemies.push({
    typeIdx:typeIdx,x:x,y:y,
    r:(scale||1)*22,
    hp:T.hp*hpScale*(scale?scale*scale:1),
    maxHp:T.hp*hpScale*(scale?scale*scale:1),
    spd:T.spd*spdScale,
    dmg:T.dmg,pts:T.pts*(scale||1),
    flash:0,scale:scale||1
  });
}
function spawnBoss(){
  // Dev boss - centered top
  enemies.push({
    typeIdx:-1, // -1 = dev boss (uses devImg)
    x:BW/2,y:-80,r:60,
    hp:200+wave*30,maxHp:200+wave*30,
    spd:0.5,dmg:25,pts:500,
    flash:0,scale:2.5,boss:true
  });
  bossActive=true;sfxBoss();
}
function spawnWave(){
  // Spawn enemies from edges
  var count=Math.min(6+wave,18);
  for(var i=0;i<count;i++){
    var side=Math.floor(Math.random()*4);
    var x,y;
    if(side===0){x=rnd(0,BW);y=-30;}
    else if(side===1){x=BW+30;y=rnd(0,BH);}
    else if(side===2){x=rnd(0,BW);y=BH+30;}
    else{x=-30;y=rnd(0,BH);}
    var maxType=Math.min(wave-1,ENEMY_TYPES.length-1);
    var typeIdx=Math.floor(Math.random()*(maxType+1));
    spawnEnemy(typeIdx,x,y);
  }
  waveTarget=count;  // sync target to actual spawn count
  waveKills=0;       // reset kills for new wave
}
function drawEnemy(e){
  ctx.save();
  if(e.flash>0){ctx.shadowColor='#fff';ctx.shadowBlur=15;e.flash--;}
  if(e.typeIdx===-1){
    // Dev boss - use devImg
    if(devImg.complete){
      ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.clip();
      ctx.drawImage(devImg,e.x-e.r,e.y-e.r,e.r*2,e.r*2);
    }
  }else{
    if(enemyImg.complete){
      ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.clip();
      ctx.drawImage(enemyImg,e.typeIdx*100,0,100,100,e.x-e.r,e.y-e.r,e.r*2,e.r*2);
    }
  }
  ctx.restore();
  // Border
  var T=e.typeIdx>=0?ENEMY_TYPES[e.typeIdx]:{color:'#FCD34D'};
  ctx.save();ctx.shadowColor=T.color;ctx.shadowBlur=8;
  ctx.strokeStyle=T.color;ctx.lineWidth=e.boss?3:1.5;
  ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.stroke();ctx.restore();
  // HP bar
  if(e.hp<e.maxHp){
    var bw=e.r*1.6,bh=3,bx=e.x-bw/2,by=e.y-e.r-8;
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(bx,by,bw,bh);
    ctx.fillStyle='#EF4444';ctx.fillRect(bx,by,bw*(e.hp/e.maxHp),bh);
  }
  if(e.boss){
    ctx.fillStyle='#FCD34D';ctx.font='900 11px Orbitron,sans-serif';ctx.textAlign='center';
    ctx.fillText('THE DEV',e.x,e.y-e.r-15);ctx.textAlign='left';
  }
}

// ── Bullets ──────────────────────────────────────────────
var bullets=[];
function shoot(){
  // Find nearest enemy
  if(!enemies.length)return;
  var nearest=null,nd=99999;
  for(var i=0;i<enemies.length;i++){
    var d=dist(P.x,P.y,enemies[i].x,enemies[i].y);
    if(d<nd){nd=d;nearest=enemies[i];}
  }
  if(!nearest)return;
  var ang=Math.atan2(nearest.y-P.y,nearest.x-P.x);
  bullets.push({x:P.x,y:P.y,vx:Math.cos(ang)*P.bulletSpd,vy:Math.sin(ang)*P.bulletSpd,life:60,dmg:P.bulletDmg,pierce:P.pierce,hits:[]});
  sfxShoot();
}
function drawBullet(b){
  ctx.save();
  ctx.shadowColor='#22C55E';ctx.shadowBlur=12;
  // Mini Monad logo - diamond shape
  ctx.translate(b.x,b.y);
  var ang=Math.atan2(b.vy,b.vx);
  ctx.rotate(ang+tick*0.2);
  ctx.fillStyle='#22C55E';
  ctx.beginPath();
  ctx.moveTo(0,-7);ctx.lineTo(7,0);ctx.lineTo(0,7);ctx.lineTo(-7,0);ctx.closePath();
  ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.5)';
  ctx.beginPath();
  ctx.moveTo(0,-3);ctx.lineTo(3,0);ctx.lineTo(0,3);ctx.lineTo(-3,0);ctx.closePath();
  ctx.fill();
  ctx.restore();
}

// ── XP / Pickups ─────────────────────────────────────────
var pickups=[];
function dropPickup(x,y){
  // 30% chance to drop coin (score bonus)
  if(Math.random()<0.4){
    pickups.push({x:x,y:y,type:'coin',life:600});
  }
  // 8% chance health
  if(Math.random()<0.08){
    pickups.push({x:x+10,y:y,type:'heal',life:600});
  }
  // 4% chance nuke
  if(Math.random()<0.04){
    pickups.push({x:x-10,y:y,type:'nuke',life:600});
  }
}
function drawPickup(p){
  ctx.save();
  var bob=Math.sin(tick*0.1+p.x*0.01)*2;
  if(p.type==='coin'){ctx.shadowColor='#FCD34D';ctx.shadowBlur=10;ctx.fillStyle='#FCD34D';ctx.beginPath();ctx.arc(p.x,p.y+bob,7,0,Math.PI*2);ctx.fill();ctx.fillStyle='#92400E';ctx.font='bold 10px Orbitron';ctx.textAlign='center';ctx.fillText('$',p.x,p.y+bob+4);ctx.textAlign='left';}
  else if(p.type==='heal'){ctx.shadowColor='#EF4444';ctx.shadowBlur=10;ctx.fillStyle='#EF4444';ctx.fillRect(p.x-8,p.y+bob-3,16,6);ctx.fillRect(p.x-3,p.y+bob-8,6,16);}
  else if(p.type==='nuke'){ctx.shadowColor='#A855F7';ctx.shadowBlur=15;ctx.fillStyle='#A855F7';ctx.beginPath();ctx.arc(p.x,p.y+bob,9,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 9px Orbitron';ctx.textAlign='center';ctx.fillText('NUKE',p.x,p.y+bob+3);ctx.textAlign='left';}
  ctx.restore();
}

// ── Particles ────────────────────────────────────────────
var parts=[];
function explode(x,y,col,count){
  count=count||10;
  for(var i=0;i<count;i++){
    var a=Math.random()*Math.PI*2;
    var s=rnd(2,5);
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,r:rnd(2,5),c:col});
  }
}

// ── Background ───────────────────────────────────────────
function drawBG(){
  // Dark gradient
  var g=ctx.createRadialGradient(BW/2,BH/2,50,BW/2,BH/2,BW*0.7);
  g.addColorStop(0,'#1a0040');g.addColorStop(1,'#02000a');
  ctx.fillStyle=g;ctx.fillRect(0,0,BW,BH);
  // Grid
  ctx.strokeStyle='rgba(120,50,200,.1)';ctx.lineWidth=1;
  var gs=40;
  for(var x=0;x<BW;x+=gs){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,BH);ctx.stroke();}
  for(var y=0;y<BH;y+=gs){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(BW,y);ctx.stroke();}
  // Border glow
  ctx.save();ctx.shadowColor='#8B5CF6';ctx.shadowBlur=15;
  ctx.strokeStyle='#8B5CF6';ctx.lineWidth=2;
  ctx.strokeRect(0,0,BW,BH);ctx.restore();
}

// ── Update / Loop ────────────────────────────────────────
function nuke(){
  for(var i=enemies.length-1;i>=0;i--){
    var e=enemies[i];
    if(e.boss){e.hp-=80;e.flash=8;continue;}
    explode(e.x,e.y,'#A855F7',12);
    score+=e.pts;waveKills++;
    enemies.splice(i,1);
  }
  P.flash=12;
  // Big explosion
  for(var p=0;p<60;p++){
    var a=Math.random()*Math.PI*2,s=rnd(5,12);
    parts.push({x:P.x,y:P.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1.5,r:rnd(3,7),c:'#A855F7'});
  }
}

function update(){
  tick++;
  // Player movement
  var dx=0,dy=0;
  if(keys['w']||keys['arrowup'])dy-=1;
  if(keys['s']||keys['arrowdown'])dy+=1;
  if(keys['a']||keys['arrowleft'])dx-=1;
  if(keys['d']||keys['arrowright'])dx+=1;
  if(joy.active){dx=joy.dx;dy=joy.dy;}
  if(dx||dy){var d=Math.sqrt(dx*dx+dy*dy);dx/=d;dy/=d;}
  P.x+=dx*P.spd;P.y+=dy*P.spd;
  P.x=Math.max(P.r,Math.min(BW-P.r,P.x));
  P.y=Math.max(P.r,Math.min(BH-P.r,P.y));

  // Auto-shoot
  P.fireT++;
  if(P.fireT>=P.fireRate){P.fireT=0;shoot();}

  // Update bullets
  for(var i=bullets.length-1;i>=0;i--){
    var b=bullets[i];b.x+=b.vx;b.y+=b.vy;b.life--;
    if(b.life<=0||b.x<-20||b.x>BW+20||b.y<-20||b.y>BH+20){bullets.splice(i,1);continue;}
    // Hit enemies
    for(var j=enemies.length-1;j>=0;j--){
      var e=enemies[j];
      if(b.hits.indexOf(e)>=0)continue;
      if(dist(b.x,b.y,e.x,e.y)<e.r+8){
        e.hp-=b.dmg;e.flash=4;
        explode(b.x,b.y,'#22C55E',4);
        b.hits.push(e);
        if(e.hp<=0){
          score+=Math.floor(e.pts);waveKills++;
          if(e.boss){bossActive=false;explode(e.x,e.y,'#FCD34D',40);sfxKill();waveKills=999;}
          else{explode(e.x,e.y,ENEMY_TYPES[e.typeIdx].color,15);sfxKill();}
          dropPickup(e.x,e.y);
          enemies.splice(j,1);
        }else{sfxHit();}
        if(b.pierce<=0){bullets.splice(i,1);break;}
        else b.pierce--;
      }
    }
  }

  // Update enemies
  for(var i=enemies.length-1;i>=0;i--){
    var e=enemies[i];
    var ang=Math.atan2(P.y-e.y,P.x-e.x);
    e.x+=Math.cos(ang)*e.spd;e.y+=Math.sin(ang)*e.spd;
    if(P.invuln<=0&&dist(e.x,e.y,P.x,P.y)<e.r+P.r-3){
      P.hp-=e.dmg;P.invuln=45;P.flash=8;sfxHurt();
      // Knockback
      var kang=Math.atan2(P.y-e.y,P.x-e.x);
      P.x+=Math.cos(kang)*15;P.y+=Math.sin(kang)*15;
      if(P.hp<=0){state='dead';lastScore=score;lastWave=wave;sfxDie();stopMusic();
        if(score>best)best=score;
        if(playerName)submitScore(score,wave);
        else showDeathNoSubmit(score,wave);
        break;
      }
    }
  }
  if(P.invuln>0)P.invuln--;

  // Pickups
  for(var i=pickups.length-1;i>=0;i--){
    var p=pickups[i];p.life--;
    var d=dist(p.x,p.y,P.x,P.y);
    if(d<P.r+20){
      // Magnet effect
      if(d<P.r+10){
        if(p.type==='coin')score+=25;
        else if(p.type==='heal')P.hp=Math.min(P.maxHp,P.hp+30);
        else if(p.type==='nuke')nuke();
        pickups.splice(i,1);continue;
      }else{
        var ang=Math.atan2(P.y-p.y,P.x-p.x);
        p.x+=Math.cos(ang)*4;p.y+=Math.sin(ang)*4;
      }
    }
    if(p.life<=0)pickups.splice(i,1);
  }

  // Wave check - advance when all enemies cleared
  if(enemies.length===0&&!bossActive&&waveKills>0){
    wave++;
    bossWaveCounter++;
    sfxWave();
    // Permanent upgrades
    if(wave%2===0)P.fireRate=Math.max(6,P.fireRate-1);
    if(wave%3===0)P.bulletDmg+=0.5;
    if(wave%5===0){P.maxHp+=20;P.hp=Math.min(P.maxHp,P.hp+30);}
    // Boss every 4 waves
    if(bossWaveCounter>=4){bossWaveCounter=0;spawnBoss();waveKills=0;waveTarget=1;}
    else{spawnWave();}
  }

  // Particles
  for(var i=parts.length-1;i>=0;i--){
    var p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vx*=0.94;p.vy*=0.94;p.life-=0.04;
    if(p.life<=0)parts.splice(i,1);
  }
}

function drawHUD(){
  ctx.fillStyle='rgba(0,0,0,.55)';ctx.beginPath();ctx.roundRect(12,12,180,52,8);ctx.fill();
  ctx.strokeStyle='rgba(139,92,246,.4)';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(12,12,180,52,8);ctx.stroke();
  ctx.save();ctx.shadowColor='#A78BFA';ctx.shadowBlur=8;
  ctx.fillStyle='#fff';ctx.font='900 24px Orbitron,sans-serif';ctx.fillText(String(score).padStart(7,'0'),20,42);ctx.restore();
  ctx.fillStyle='rgba(167,139,250,.6)';ctx.font='700 9px Space Mono,monospace';ctx.fillText('SCORE',20,57);

  ctx.fillStyle='rgba(0,0,0,.55)';ctx.beginPath();ctx.roundRect(BW-192,12,180,52,8);ctx.fill();
  ctx.strokeStyle='rgba(74,222,128,.4)';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(BW-192,12,180,52,8);ctx.stroke();
  ctx.fillStyle='#4ADE80';ctx.font='900 24px Orbitron,sans-serif';ctx.fillText(String(best).padStart(7,'0'),BW-184,42);
  ctx.fillStyle='rgba(74,222,128,.5)';ctx.font='700 9px Space Mono,monospace';ctx.fillText('BEST',BW-184,57);

  // Wave progress bar bottom
  var bw=BW-200,bh=6,bx=100,by=BH-22;
  ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(bx,by,bw,bh);
  var pct=Math.min(waveKills/waveTarget,1);
  ctx.fillStyle=bossActive?'#FCD34D':'#22C55E';ctx.fillRect(bx,by,bw*pct,bh);
  ctx.strokeStyle='rgba(139,92,246,.4)';ctx.lineWidth=1;ctx.strokeRect(bx,by,bw,bh);
  ctx.fillStyle='#C4B5FD';ctx.font='700 11px Orbitron,sans-serif';ctx.textAlign='center';
  var label=bossActive?'⚠ BOSS ⚠':'WAVE '+wave+'  '+waveKills+'/'+waveTarget;
  ctx.fillText(label,BW/2,BH-30);ctx.textAlign='left';
  // Player name + credit
  ctx.fillStyle='rgba(139,92,246,.4)';ctx.font='700 9px Space Mono,monospace';
  if(playerName)ctx.fillText(playerName,20,BH-8);
  ctx.fillStyle='rgba(255,255,255,.18)';ctx.textAlign='right';
  ctx.fillText('a KING PETTY build',BW-12,BH-8);ctx.textAlign='left';
}

// ── Start screen ─────────────────────────────────────────
function drawStart(){
  ctx.fillStyle='rgba(0,0,8,.85)';ctx.fillRect(0,0,BW,BH);
  ctx.save();ctx.shadowColor='#8B5CF6';ctx.shadowBlur=30;
  ctx.fillStyle='#EDE9FF';ctx.font='900 56px Orbitron,sans-serif';ctx.textAlign='center';
  ctx.fillText('MONSHI',BW/2,BH/2-50);ctx.restore();
  ctx.save();ctx.shadowColor='#22C55E';ctx.shadowBlur=20;
  ctx.fillStyle='#4ADE80';ctx.font='900 28px Orbitron,sans-serif';
  ctx.fillText('SHOOTER',BW/2,BH/2-15);ctx.restore();
  ctx.fillStyle='rgba(196,181,253,.7)';ctx.font='700 13px Space Mono,monospace';
  ctx.fillText('AUTO-SHOOT • SURVIVE THE WAVES',BW/2,BH/2+18);
  ctx.fillStyle='rgba(196,181,253,.5)';ctx.font='700 11px Space Mono,monospace';
  ctx.fillText('WASD or ARROWS to move • Touch to use joystick',BW/2,BH/2+38);
  ctx.fillText('Auto-fires Monad bullets at nearest target',BW/2,BH/2+55);
  var pulse=0.5+0.5*Math.sin(tick*0.07);
  ctx.fillStyle='rgba(74,222,128,'+pulse+')';ctx.font='700 14px Space Mono,monospace';
  ctx.fillText('[ CLICK / TAP / SPACE TO PLAY ]',BW/2,BH/2+90);
  ctx.fillStyle='rgba(252,211,77,.7)';ctx.font='700 10px Space Mono,monospace';
  ctx.fillText('BEWARE THE DEV - HE BOSSES UP',BW/2,BH/2+115);
  ctx.textAlign='left';
}

function drawJoy(){
  if(!joy.active)return;
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(joy.baseX,joy.baseY,50,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle='rgba(139,92,246,.5)';
  ctx.beginPath();ctx.arc(joy.baseX+joy.dx*40,joy.baseY+joy.dy*40,22,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

// ── Leaderboard ──────────────────────────────────────────
function sbH(){return{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=representation'};}
function fetchLeaderboard(){
  if(!SUPABASE_URL||SUPABASE_URL.indexOf('YOUR')>=0)return;
  fetch(SUPABASE_URL+'/rest/v1/scores_shooter?select=name,score,wave&order=score.desc&limit=10',{headers:sbH()})
    .then(function(r){return r.json();}).then(function(d){if(Array.isArray(d)){leaderboard=d;renderStartLb();}}).catch(function(){});
}
function submitScore(sc,wv){
  if(!playerName)return;
  fetch(SUPABASE_URL+'/rest/v1/scores_shooter',{method:'POST',headers:sbH(),body:JSON.stringify({name:playerName,score:Math.floor(sc),wave:wv})})
    .then(function(){return fetch(SUPABASE_URL+'/rest/v1/scores_shooter?select=name,score,wave&order=score.desc&limit=10',{headers:sbH()});})
    .then(function(r){return r.json();}).then(function(d){if(Array.isArray(d)){leaderboard=d;playerRank=leaderboard.findIndex(function(s){return s.name===playerName&&s.score===Math.floor(sc);})+1;renderDeath(sc,wv);}}).catch(function(){renderDeath(sc,wv);});
}
function showDeathNoSubmit(sc,wv){
  document.getElementById('nameSubmit').style.display='block';
  document.getElementById('dNameInput').value='';
  document.getElementById('dNameInput').focus();
  renderDeath(sc,wv);
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function renderStartLb(){
  var ul=document.getElementById('startLbList');
  if(!leaderboard.length){ul.innerHTML='<li><span style="color:rgba(139,92,246,.4)">No scores yet — be first</span></li>';return;}
  ul.innerHTML='';leaderboard.slice(0,8).forEach(function(s,i){var li=document.createElement('li');var medal=['🥇','🥈','🥉'][i]||'#'+(i+1);li.innerHTML='<span class="pn">'+medal+' '+esc(s.name)+'</span><span class="sn">'+String(Math.floor(s.score)).padStart(7,'0')+'</span>';ul.appendChild(li);});
}
function renderDeath(sc,wv){
  if(playerName)document.getElementById('nameSubmit').style.display='none';
  document.getElementById('dScore').textContent=String(Math.floor(sc)).padStart(7,'0');
  document.getElementById('dBest').textContent=String(Math.floor(best)).padStart(7,'0');
  document.getElementById('lvlTag').textContent='SURVIVED TO WAVE '+wv;
  document.getElementById('rankTag').textContent=playerRank>0?'YOU PLACED #'+playerRank+' GLOBALLY':'';
  var tbody=document.getElementById('lbBody');tbody.innerHTML='';
  leaderboard.slice(0,6).forEach(function(s,i){var tr=document.createElement('tr');var isMe=s.name===playerName&&s.score===Math.floor(sc);if(isMe)tr.className='me';var medal=['🥇','🥈','🥉'][i]||'#'+(i+1);tr.innerHTML='<td class="rank">'+medal+'</td><td>'+esc(s.name)+'</td><td class="sc">'+String(Math.floor(s.score)).padStart(7,'0')+'</td>';tbody.appendChild(tr);});
  document.getElementById('deathPanel').classList.add('show');
}
document.getElementById('dSubmit').addEventListener('click',function(){
  var n=document.getElementById('dNameInput').value.trim();
  playerName=(n||'ANON').toUpperCase().slice(0,16);
  localStorage.setItem('monshi_name',playerName);
  document.getElementById('nameSubmit').style.display='none';
  submitScore(lastScore,lastWave);
});
document.getElementById('dNameInput').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('dSubmit').click();});

// ── Price ticker ─────────────────────────────────────────
function fetchPrice(){
  fetch('https://api.dexscreener.com/latest/dex/search?q=MONSHI').then(function(r){return r.json();}).then(function(d){
    if(d.pairs&&d.pairs.length){var p=d.pairs[0];var price=parseFloat(p.priceUsd);var ch=parseFloat((p.priceChange&&p.priceChange.h24)||0);var col=ch>=0?'#4ADE80':'#F87171';document.getElementById('priceTicker').innerHTML='$MONSHI <span style="color:#EDE9FF">$'+price.toFixed(8)+'</span> <span style="color:'+col+'">'+(ch>=0?'+':'')+ch.toFixed(2)+'%</span>';}
  }).catch(function(){});setTimeout(fetchPrice,60000);
}
fetchLeaderboard();fetchPrice();
document.getElementById('startLb').style.display='block';

// ── Buttons ──────────────────────────────────────────────
document.getElementById('btnShare').addEventListener('click',function(){
  var tweet='I scored '+String(Math.floor(lastScore)).padStart(7,'0')+' on MONSHI SHOOTER reaching WAVE '+lastWave+'! Auto-blasted FUDders with $MONSHI bullets. Play: '+('https://monshi-fafo.vercel.app/api/share?game=MONSHI%20SHOOTER&score='+lastScore+'&name='+encodeURIComponent(playerName||'ANON')+'&rank='+(typeof playerRank!=='undefined'?playerRank:'')+'&goto='+encodeURIComponent(GAME_URL))+' $MONSHI #Monad';
  window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(tweet),'_blank');
});
document.getElementById('btnBuy').addEventListener('click',function(){window.open(BUY_URL,'_blank');});
document.getElementById('btnRetry').addEventListener('click',function(){
  document.getElementById('deathPanel').classList.remove('show');
  document.getElementById('startLb').style.display='none';
  reset();state='playing';initAudio();if(musicOn)startMusic();
});

// ── Reset ────────────────────────────────────────────────
function reset(){
  P.x=BW/2;P.y=BH/2;P.hp=100;P.maxHp=100;P.fireRate=18;P.bulletDmg=1;P.fireT=0;P.invuln=0;P.flash=0;
  enemies=[];bullets=[];pickups=[];parts=[];
  score=0;wave=1;bossActive=false;bossWaveCounter=0;
  spawnWave();  // this sets waveKills=0, waveTarget=count
  state='playing';
}

// ── Input: keyboard start ────────────────────────────────
window.addEventListener('keydown',function(e){
  if(e.code==='Space'){
    e.preventDefault();
    if(state==='start'){state='playing';if(!enemies.length)spawnWave();initAudio();if(musicOn)startMusic();document.getElementById('startLb').style.display='none';}
  }
});
canvas.addEventListener('click',function(){
  if(state==='start'){state='playing';if(!enemies.length)spawnWave();initAudio();if(musicOn)startMusic();document.getElementById('startLb').style.display='none';}
});

// ── Loop ─────────────────────────────────────────────────
spawnWave();
function loop(){
  requestAnimationFrame(loop);
  drawBG();
  if(state==='playing')update();
  else tick++;
  pickups.forEach(drawPickup);
  enemies.forEach(drawEnemy);
  bullets.forEach(drawBullet);
  parts.forEach(function(p){ctx.fillStyle='rgba('+(p.c==='#22C55E'?'34,197,94':p.c==='#FCD34D'?'252,211,77':p.c==='#A855F7'?'168,85,247':'139,92,246')+','+p.life+')';ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);ctx.fill();});
  P.draw();drawHUD();drawJoy();
  if(state==='start')drawStart();
}
loop();

</script>
