var AC=window.AudioContext||window.webkitAudioContext,actx=null,master=null;
function initAudio(){if(actx)return;try{actx=new AC();master=actx.createGain();master.gain.value=0.25;master.connect(actx.destination);}catch(e){}}
function tone(f,t,v,o,d){if(!actx)return;var st=actx.currentTime+(o||0);var os=actx.createOscillator();var g=actx.createGain();os.type=t||'square';os.frequency.setValueAtTime(f,st);g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(v,st+0.01);g.gain.exponentialRampToValueAtTime(0.001,st+d);os.connect(g);g.connect(master);os.start(st);os.stop(st+d+0.05);}
function sfxEat(){tone(660,'square',0.15,0,0.06);tone(880,'square',0.12,0.05,0.08);}
function sfxDie(){[440,330,220].forEach(function(f,i){tone(f,'sawtooth',0.25,i*0.12,0.18);});}

var state='start',score=0,best=parseInt(localStorage.getItem('snake_best')||'0'),tick=0;

var lastScore=0,leaderboard=[],playerRank=0;
var snake=[{x:12,y:12}],dir={x:1,y:0},nextDir={x:1,y:0};
var food={x:18,y:12};var moveT=0,SPD=8;

function placeFood(){
  while(true){
    food.x=Math.floor(Math.random()*GW);food.y=Math.floor(Math.random()*GH);
    var ok=true;snake.forEach(function(s){if(s.x===food.x&&s.y===food.y)ok=false;});
    if(ok)break;
  }
}
function reset(){snake=[{x:12,y:12},{x:11,y:12},{x:10,y:12}];dir={x:1,y:0};nextDir={x:1,y:0};score=0;moveT=0;SPD=8;placeFood();state='playing';}

addEventListener('keydown',function(e){
  if(state==='start'&&(e.code==='Space'||e.key.startsWith('Arrow')||['w','a','s','d'].indexOf(e.key.toLowerCase())>=0)){reset();initAudio();return;}
  var k=e.key.toLowerCase();
  if(k==='arrowup'||k==='w'){if(dir.y===0)nextDir={x:0,y:-1};e.preventDefault();}
  else if(k==='arrowdown'||k==='s'){if(dir.y===0)nextDir={x:0,y:1};e.preventDefault();}
  else if(k==='arrowleft'||k==='a'){if(dir.x===0)nextDir={x:-1,y:0};e.preventDefault();}
  else if(k==='arrowright'||k==='d'){if(dir.x===0)nextDir={x:1,y:0};e.preventDefault();}
});

canvas.addEventListener('touchend',function(e){e.preventDefault();ts.active=false;},{passive:false});
canvas.addEventListener('click',function(){initAudio();if(state==='start')reset();});

function update(){
  tick++;moveT++;
  if(moveT<SPD)return;
  moveT=0;
  dir=nextDir;
  var head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(head.x<0||head.x>=GW||head.y<0||head.y>=GH){return die();}
  for(var i=0;i<snake.length;i++)if(snake[i].x===head.x&&snake[i].y===head.y)return die();
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){score++;sfxEat();placeFood();if(SPD>3)SPD--;}
  else{snake.pop();}
}

function die(){if(state!=='playing')return;state='dead';sfxDie();lastScore=score;if(score>best){best=score;localStorage.setItem('snake_best',best);}if(playerName)submitScore(score);else showDeathNoSubmit();}

function drawBG(){
  ctx.fillStyle='#02000a';ctx.fillRect(0,0,BW,BH);
  // Grid
  ctx.strokeStyle='rgba(120,50,200,.08)';
  for(var i=0;i<=GW;i++){ctx.beginPath();ctx.moveTo(i*GS,0);ctx.lineTo(i*GS,BH);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*GS);ctx.lineTo(BW,i*GS);ctx.stroke();}
  ctx.save();ctx.shadowColor='#8B5CF6';ctx.shadowBlur=15;ctx.strokeStyle='#8B5CF6';ctx.lineWidth=2;ctx.strokeRect(0,0,BW,BH);ctx.restore();
}

function drawSnake(){
  snake.forEach(function(s,i){
    var x=s.x*GS,y=s.y*GS;
    ctx.save();
    if(i===0){
      // Head = Monshi face
      ctx.shadowColor='#8B5CF6';ctx.shadowBlur=12;
      if(face.complete){
        ctx.beginPath();ctx.arc(x+GS/2,y+GS/2,GS/2-1,0,Math.PI*2);ctx.clip();
        ctx.drawImage(face,x,y,GS,GS);
      }
      ctx.restore();
      ctx.save();ctx.shadowColor='#8B5CF6';ctx.shadowBlur=10;
      ctx.strokeStyle='#8B5CF6';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(x+GS/2,y+GS/2,GS/2-1,0,Math.PI*2);ctx.stroke();
    }else{
      // Body segments
      var t=i/snake.length;
      var alpha=Math.max(0.3,1-t*0.5);
      ctx.shadowColor='#7C3AED';ctx.shadowBlur=6;
      ctx.fillStyle='rgba(139,92,246,'+alpha+')';
      ctx.beginPath();ctx.roundRect(x+2,y+2,GS-4,GS-4,4);ctx.fill();
    }
    ctx.restore();
  });
}

function drawFood(){
  var x=food.x*GS,y=food.y*GS;
  ctx.save();
  ctx.shadowColor='#FCD34D';ctx.shadowBlur=15+5*Math.sin(tick*0.1);
  ctx.fillStyle='#FCD34D';
  ctx.beginPath();ctx.arc(x+GS/2,y+GS/2,GS/2-3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#92400E';ctx.font='bold 16px Orbitron';ctx.textAlign='center';
  ctx.fillText('$',x+GS/2,y+GS/2+5);
  ctx.textAlign='left';ctx.restore();
}

function drawHUD(){
  if(state==='playing'){
    ctx.save();ctx.shadowColor='#8B5CF6';ctx.shadowBlur=15;
    ctx.fillStyle='#fff';ctx.font='900 36px Orbitron,sans-serif';ctx.textAlign='center';
    ctx.fillText(score,BW/2,55);ctx.restore();
  }
  ctx.fillStyle='rgba(255,255,255,.16)';ctx.font='700 9px Space Mono,monospace';ctx.textAlign='right';
  ctx.fillText('a KING PETTY build',BW-12,BH-10);ctx.textAlign='left';
}

function drawStart(){
  ctx.fillStyle='rgba(0,0,8,.7)';ctx.fillRect(0,0,BW,BH);
  ctx.save();ctx.shadowColor='#8B5CF6';ctx.shadowBlur=30;
  ctx.fillStyle='#EDE9FF';ctx.font='900 50px Orbitron,sans-serif';ctx.textAlign='center';
  ctx.fillText('MONSHI',BW/2,BH/2-50);ctx.restore();
  ctx.save();ctx.shadowColor='#FCD34D';ctx.shadowBlur=20;
  ctx.fillStyle='#FCD34D';ctx.font='900 36px Orbitron,sans-serif';
  ctx.fillText('SNAKE',BW/2,BH/2-10);ctx.restore();
  ctx.fillStyle='rgba(196,181,253,.7)';ctx.font='700 13px Space Mono,monospace';
  ctx.fillText('Eat the $ — dont eat yourself',BW/2,BH/2+30);
  ctx.fillText('WASD / ARROWS / SWIPE',BW/2,BH/2+50);
  var pulse=0.5+0.5*Math.sin(tick*0.1);
  ctx.fillStyle='rgba(74,222,128,'+pulse+')';ctx.font='700 16px Orbitron,sans-serif';
  ctx.fillText('TAP / SPACE TO PLAY',BW/2,BH/2+90);
  ctx.fillStyle='#FCD34D';ctx.font='700 12px Space Mono,monospace';
  ctx.fillText('BEST: '+best,BW/2,BH/2+125);
  ctx.textAlign='left';
}

function sbH(){return{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=representation'};}
function fetchLeaderboard(){fetch(SUPABASE_URL+'/rest/v1/scores_snake?select=name,score&order=score.desc&limit=10',{headers:sbH()}).then(function(r){return r.json();}).then(function(d){if(Array.isArray(d))leaderboard=d;}).catch(function(){});}
function submitScore(sc){fetch(SUPABASE_URL+'/rest/v1/scores_snake',{method:'POST',headers:sbH(),body:JSON.stringify({name:playerName,score:Math.floor(sc)})}).then(function(){return fetch(SUPABASE_URL+'/rest/v1/scores_snake?select=name,score&order=score.desc&limit=10',{headers:sbH()});}).then(function(r){return r.json();}).then(function(d){if(Array.isArray(d)){leaderboard=d;playerRank=leaderboard.findIndex(function(s){return s.name===playerName&&s.score===Math.floor(sc);})+1;renderDeath(sc);}}).catch(function(){renderDeath(sc);});}
function showDeathNoSubmit(){document.getElementById('nameSubmit').style.display='block';document.getElementById('dNameInput').value='';renderDeath(lastScore);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function renderDeath(sc){
  if(playerName)document.getElementById('nameSubmit').style.display='none';
  document.getElementById('dScore').textContent=sc;
  document.getElementById('dBest').textContent=best;
  document.getElementById('lvlTag').textContent='ATE '+sc+' BAGS';
  document.getElementById('rankTag').textContent=playerRank>0?'YOU PLACED #'+playerRank+' GLOBALLY':'';
  var tbody=document.getElementById('lbBody');tbody.innerHTML='';
  leaderboard.slice(0,6).forEach(function(s,i){var tr=document.createElement('tr');var isMe=s.name===playerName&&s.score===Math.floor(sc);if(isMe)tr.className='me';var medal=['🥇','🥈','🥉'][i]||'#'+(i+1);tr.innerHTML='<td class="rank">'+medal+'</td><td>'+esc(s.name)+'</td><td class="sc">'+s.score+'</td>';tbody.appendChild(tr);});
  document.getElementById('deathPanel').classList.add('show');
}
document.getElementById('dSubmit').addEventListener('click',function(){var n=document.getElementById('dNameInput').value.trim();playerName=(n||'ANON').toUpperCase().slice(0,16);localStorage.setItem('monshi_name',playerName);document.getElementById('nameSubmit').style.display='none';submitScore(lastScore);});
document.getElementById('dNameInput').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('dSubmit').click();});
document.getElementById('btnShare').addEventListener('click',function(){var tweet='I scored '+lastScore+' on MONSHI SNAKE! Beat me: '+('https://monshi-fafo.vercel.app/api/share?game=MONSHI%20SNAKE&score='+lastScore+'&name='+encodeURIComponent(playerName||'ANON')+'&rank='+(typeof playerRank!=='undefined'?playerRank:'')+'&goto='+encodeURIComponent(GAME_URL))+' $MONSHI #Monad';window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(tweet),'_blank');});
document.getElementById('btnBuy').addEventListener('click',function(){window.open(BUY_URL,'_blank');});
document.getElementById('btnRetry').addEventListener('click',function(){document.getElementById('deathPanel').classList.remove('show');reset();});
fetchLeaderboard();

placeFood();
function loop(){requestAnimationFrame(loop);drawBG();drawFood();drawSnake();if(state==='playing')update();else tick++;drawHUD();if(state==='start')drawStart();}
loop();
</script></body></html>
