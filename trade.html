<style>@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#02000a;overflow:hidden;font-family:'Space Mono',monospace;color:#EDE9FF;}
body{display:flex;align-items:center;justify-content:center;}
#wrap{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
#hubBtn{position:fixed;top:8px;left:8px;z-index:7;color:rgba(139,92,246,.7);text-decoration:none;font-size:11px;letter-spacing:1px;background:rgba(0,0,0,.5);padding:6px 12px;border-radius:8px;border:1px solid rgba(139,92,246,.2);}
.btn{padding:10px 14px;border:none;border-radius:8px;font-family:Orbitron,sans-serif;font-size:11px;font-weight:700;cursor:pointer;letter-spacing:1px;}
#btnRetry{background:linear-gradient(135deg,#7C3AED,#5B21B6);color:#fff;}
#btnShare{background:linear-gradient(135deg,#1DA1F2,#0d7abf);color:#fff;}
#btnBuy{background:linear-gradient(135deg,#22C55E,#15803D);color:#fff;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.5);}50%{box-shadow:0 0 0 8px rgba(34,197,94,0);}}
.death{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,8,.92);z-index:8;}
.death.show{display:flex;}
.dCard{background:rgba(90,30,180,.18);border:1.5px solid rgba(150,120,255,.4);border-radius:18px;padding:22px 28px;width:min(440px,90vw);text-align:center;}
.rugged{font-family:Orbitron,sans-serif;font-size:38px;font-weight:900;color:#FCA5A5;text-shadow:0 0 24px #EF4444;margin-bottom:6px;}
.rugged.win{color:#4ADE80;text-shadow:0 0 24px #22C55E;}
.scoreNum{font-family:Orbitron,sans-serif;font-size:24px;color:#EDE9FF;margin:10px 0;}
.lbl{font-size:9px;color:rgba(167,139,250,.5);letter-spacing:1px;margin-bottom:10px;}
#nS{margin-bottom:14px;display:none;}
#nS input{background:rgba(0,0,0,.5);border:1.5px solid rgba(139,92,246,.5);border-radius:8px;padding:8px 12px;color:#fff;font-family:'Space Mono',monospace;font-size:13px;outline:none;text-align:center;letter-spacing:2px;width:160px;}
#nS button{padding:8px 16px;background:linear-gradient(135deg,#7C3AED,#4ADE80);border:none;border-radius:8px;color:#fff;font-family:Orbitron,sans-serif;font-size:11px;font-weight:700;cursor:pointer;letter-spacing:1px;}
#btnRow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px;}
.lbT{width:100%;border-collapse:collapse;margin-bottom:12px;font-size:11px;}
.lbT th{color:rgba(139,92,246,.6);text-align:left;padding:3px 6px;border-bottom:1px solid rgba(139,92,246,.2);font-size:9px;letter-spacing:1px;}
.lbT td{padding:4px 6px;color:rgba(220,210,255,.8);}
.lbT tr.me td{color:#4ADE80;background:rgba(74,222,128,.08);}
.lbT .sc{text-align:right;font-family:Orbitron,sans-serif;}
.kingP{position:fixed;bottom:6px;right:10px;font-size:9px;color:rgba(255,255,255,.18);letter-spacing:1.5px;}
.gw{display:flex;flex-direction:column;align-items:center;gap:14px;width:min(560px,92vw);}.tit{font-family:Orbitron,sans-serif;font-size:28px;font-weight:900;letter-spacing:2px;color:#22C55E;text-shadow:0 0 16px rgba(34,197,94,.5);}.hud{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;width:100%;}.st{padding:8px;background:rgba(20,5,50,.6);border:1px solid rgba(139,92,246,.3);border-radius:8px;text-align:center;}.st .n{font-family:Orbitron,sans-serif;font-size:18px;color:#fff;}.st .l{font-size:8px;color:rgba(167,139,250,.6);letter-spacing:1.5px;}canvas{width:100%;background:rgba(20,5,50,.6);border:1.5px solid rgba(139,92,246,.3);border-radius:14px;}.bts{display:flex;gap:10px;width:100%;}.bb{flex:1;padding:14px;border:none;border-radius:10px;font-family:Orbitron,sans-serif;font-size:13px;font-weight:900;letter-spacing:2px;cursor:pointer;color:#fff;}.bBuy{background:linear-gradient(135deg,#22C55E,#15803D);}.bSell{background:linear-gradient(135deg,#EF4444,#991B1B);}.bb:disabled{opacity:.4;cursor:not-allowed;}</style><script src="/monshi-shared.js"></script>
<script src="/achievements.js"></script>
</head><body>
<a href="/" id="hubBtn">← ALL GAMES</a>
<div id="wrap"><div class="gw"><div class="tit">TRADING SIM</div><div class="hud"><div class="st"><div class="n" id="cs">$1000</div><div class="l">CASH</div></div><div class="st"><div class="n" id="hd">0</div><div class="l">$MONSHI</div></div><div class="st"><div class="n" id="pn" style="color:#4ADE80;">$0</div><div class="l">P/L</div></div></div><canvas id="cv" width="600" height="280"></canvas><div style="font-family:Orbitron;font-size:14px;color:#FCD34D;letter-spacing:2px;" id="px">$1.00</div><div class="bts"><button class="bb bBuy" id="bBuy">BUY 10%</button><button class="bb bSell" id="bSell">SELL ALL</button></div><div style="font-size:11px;color:rgba(167,139,250,.6);letter-spacing:1.5px;text-align:center;">100 ROUNDS &middot; GROW YOUR BAG &middot; DON'T BUY THE TOP</div></div></div>
<div class="death" id="dP"><div class="dCard">
<div class="rugged" id="rT">RUGGED</div>
<div class="scoreNum" id="dS">0</div>
<div class="lbl" id="lT"></div>
<div class="lbl" id="rTag" style="color:#4ADE80;"></div>
<div id="nS"><p style="color:rgba(196,181,253,.7);font-size:10px;letter-spacing:1.5px;margin-bottom:8px;">SUBMIT TO LEADERBOARD</p>
<div style="display:flex;gap:6px;justify-content:center;"><input id="dN" type="text" maxlength="16" placeholder="YOUR NAME"><button id="dSb">SUBMIT</button></div></div>
<table class="lbT"><thead><tr><th>#</th><th>PLAYER</th><th class="sc">SCORE</th></tr></thead><tbody id="lB"></tbody></table>
<div id="btnRow"><button class="btn" id="btnShare">SHARE 𝕏</button><button class="btn" id="btnBuy">BUY $MONSHI</button><button class="btn" id="btnRetry" onclick="location.reload()">RETRY</button></div>
</div></div>
<div class="kingP">a KING PETTY build</div>
<script>var SUPABASE_URL='https://cuqhqcmrgpdjlhyqztnc.supabase.co';
var SUPABASE_KEY='sb_publishable_nu-E2mvgdQ0l1DsSsOswWA_ma2RbV4z';
var BUY_URL='https://nad.fun/tokens/0xB744F5CDb792d8187640214C4A1c9aCE29af7777';
var playerName=localStorage.getItem('monshi_name')||'';
var leaderboard=[],playerRank=0,lastScore=0;
function sbH(){return{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=representation'};}
function fetchLB(t){fetch(SUPABASE_URL+'/rest/v1/'+t+'?select=name,score&order=score.desc&limit=10',{headers:sbH()}).then(function(r){return r.json();}).then(function(d){if(Array.isArray(d))leaderboard=d;}).catch(function(){});}
function submitS(t,sc,cb){if(!playerName)return cb&&cb();var mult=(window.MONSHI&&window.MONSHI.tier)?window.MONSHI.tier.mult:1;var boosted=Math.floor(sc*mult);var body={name:playerName,score:boosted};if(window.MONSHI&&window.MONSHI.wallet)body.wallet=window.MONSHI.wallet;fetch(SUPABASE_URL+'/rest/v1/'+t,{method:'POST',headers:sbH(),body:JSON.stringify(body)}).then(function(){return fetch(SUPABASE_URL+'/rest/v1/'+t+'?select=name,score,wallet&order=score.desc&limit=10',{headers:sbH()});}).then(function(r){return r.json();}).then(function(d){if(Array.isArray(d)){leaderboard=d;playerRank=leaderboard.findIndex(function(s){return s.name===playerName&&s.score===boosted;})+1;}lastScore=boosted;cb&&cb();}).catch(function(){cb&&cb();});}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function showDeath(GN,GU,T,sc,sub,isWin){
  lastScore=sc;
  if(window.MONSHI_ACHIEVEMENTS){MONSHI_ACHIEVEMENTS.trackPlay(T);MONSHI_ACHIEVEMENTS.trackScore(playerRank||0);}
  function render(){
    document.getElementById('rT').textContent=isWin?'YOU WON':'RUGGED';
    document.getElementById('rT').className='rugged'+(isWin?' win':'');
    document.getElementById('dS').textContent=Math.floor(sc);
    document.getElementById('lT').textContent=sub||'';
    document.getElementById('rTag').textContent=playerRank>0?'#'+playerRank+' GLOBALLY':'';
    var tb=document.getElementById('lB');tb.innerHTML='';
    leaderboard.slice(0,5).forEach(function(s,i){var tr=document.createElement('tr');var isMe=s.name===playerName&&s.score===Math.floor(sc);if(isMe)tr.className='me';var medal=['🥇','🥈','🥉'][i]||'#'+(i+1);var walletBadge='';if(s.wallet){walletBadge=' <span title="holder" style="color:#FCD34D;font-size:9px;">◆</span>';}tr.innerHTML='<td>'+medal+'</td><td>'+esc(s.name)+walletBadge+'</td><td class="sc">'+s.score+'</td>';tb.appendChild(tr);});
    document.getElementById('dP').classList.add('show');
  }
  if(playerName){submitS(T,sc,render);}else{document.getElementById('nS').style.display='block';render();}
  document.getElementById('dSb').onclick=function(){var n=document.getElementById('dN').value.trim();playerName=(n||'ANON').toUpperCase().slice(0,16);localStorage.setItem('monshi_name',playerName);document.getElementById('nS').style.display='none';submitS(T,sc,render);};
  document.getElementById('dN').onkeydown=function(e){if(e.key==='Enter')document.getElementById('dSb').click();};
  document.getElementById('btnShare').onclick=function(){var shareUrl='https://monshi.xyz/api/share?game='+encodeURIComponent(GN)+'&score='+sc+'&name='+encodeURIComponent(playerName||'ANON')+'&rank='+playerRank+'&goto='+encodeURIComponent(GU);var tw='I scored '+sc+' on '+GN+' on the MONSHI ARCADE 🚀 Can you beat me? '+shareUrl+' $MONSHI #Monad';window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(tw),'_blank');};
  document.getElementById('btnBuy').onclick=function(){window.open(BUY_URL,'_blank');};
}
var AC=window.AudioContext||window.webkitAudioContext,actx=null,ma=null;
function initA(){if(actx)return;try{actx=new AC();ma=actx.createGain();ma.gain.value=0.2;ma.connect(actx.destination);}catch(e){}}
function tone(f,t,v,o,d){if(!actx)return;var st=actx.currentTime+(o||0);var os=actx.createOscillator();var g=actx.createGain();os.type=t||'square';os.frequency.setValueAtTime(f,st);g.gain.setValueAtTime(0,st);g.gain.linearRampToValueAtTime(v,st+0.01);g.gain.exponentialRampToValueAtTime(0.001,st+d);os.connect(g);g.connect(ma);os.start(st);os.stop(st+d+0.05);}
function sfxWin(){[523,659,784,1046].forEach(function(f,i){tone(f,'square',0.18,i*0.06,0.12);});}
function sfxLose(){[440,330,220].forEach(function(f,i){tone(f,'sawtooth',0.25,i*0.12,0.18);});}
function sfxClick(){tone(800,'square',0.08,0,0.04);}
function sfxCoin(){tone(880,'square',0.12,0,0.05);tone(1320,'square',0.1,0.05,0.06);}
var c=document.getElementById("cv"),x=c.getContext("2d");c.width=600;c.height=280;var W=c.width,H=c.height;
var prices=[1.0],idx=0,N=100,cash=1000,holdings=0,startCash=1000;
function nextCandle(){var lastP=prices[prices.length-1];var trend=Math.sin(idx*0.1)*0.02;var noise=(Math.random()-0.5)*0.08;var spike=Math.random()<0.05?(Math.random()-0.5)*0.3:0;var newP=Math.max(0.01,lastP*(1+trend+noise+spike));prices.push(newP);idx++;}
for(var i=0;i<20;i++)nextCandle();
function draw(){x.fillStyle="#0a0015";x.fillRect(0,0,W,H);if(prices.length<2)return;var min=Math.min.apply(null,prices),max=Math.max.apply(null,prices);var rg=max-min||1;var step=W/Math.max(prices.length-1,1);x.strokeStyle="#22C55E";x.lineWidth=2;x.shadowColor="#22C55E";x.shadowBlur=8;x.beginPath();prices.forEach(function(p,i){var px=i*step,py=H-((p-min)/rg)*(H-30)-15;if(i===0)x.moveTo(px,py);else x.lineTo(px,py);});x.stroke();x.shadowBlur=0;var lp=prices[prices.length-1];document.getElementById("px").textContent="$"+lp.toFixed(4);document.getElementById("cs").textContent="$"+cash.toFixed(2);document.getElementById("hd").textContent=holdings.toFixed(2);var pnl=cash+holdings*lp-startCash;document.getElementById("pn").textContent=(pnl>=0?"+$":"-$")+Math.abs(pnl).toFixed(2);document.getElementById("pn").style.color=pnl>=0?"#4ADE80":"#F87171";}
draw();fetchLB("scores_trade");
document.getElementById("bBuy").onclick=function(){var p=prices[prices.length-1];var amt=cash*0.1;var bought=amt/p;cash-=amt;holdings+=bought;initA();sfxClick();nextCandle();draw();checkEnd();};
document.getElementById("bSell").onclick=function(){var p=prices[prices.length-1];cash+=holdings*p;holdings=0;initA();sfxCoin();nextCandle();draw();checkEnd();};
function checkEnd(){if(idx>=N){var p=prices[prices.length-1];var final=cash+holdings*p;var pnl=final-startCash;showDeath("TRADING SIM","https://monshi.xyz/trade.html","scores_trade",Math.floor(pnl),"$"+final.toFixed(2)+" final",pnl>0);}}</script>
</body></html>
